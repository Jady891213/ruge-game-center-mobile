<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>看字打拼音</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:#FFFFFF;color:#1A1A1A;
    font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}

  /* ══════════ 选关 ══════════ */
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 14px);
    overflow-y:auto}
  #menu.hide{display:none}
  .mtitle{font-size:27px;font-weight:800;letter-spacing:2px;color:#0B4E96;text-align:center}
  .msub{font-size:13px;color:#8E9BA6;text-align:center;margin-top:5px}
  .mtotal{display:flex;justify-content:center;gap:26px;margin:16px 0 6px;font-size:13px;color:#6B7A88}
  .mtotal b{font-size:21px;color:#C2410C;font-weight:800}
  .mtotal .st{color:#E8A317}
  #levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media (orientation:landscape){ #levels{grid-template-columns:1fr 1fr 1fr} }
  .lvcard{border:2px solid #DCE5EC;background:#FBFDFF;border-radius:16px;padding:13px 14px;
    cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s}
  .lvcard:active{transform:scale(.975)}
  .lvcard .no{font-size:12px;color:#8E9BA6;letter-spacing:1px}
  .lvcard .nm{font-size:17px;font-weight:700;margin:3px 0 2px;color:#1A1A1A}
  .lvcard .cs{font-size:clamp(17px,4.4vw,23px);letter-spacing:2px;color:#5A6A78;
    line-height:1.25;word-break:break-all}
  .lvcard .stars{font-size:15px;letter-spacing:2px;margin-top:5px;color:#E8A317}
  .lvcard .stars i{font-style:normal;color:#D6DEE5}
  .lvcard.bonus{background:#FFF8EC;border-color:#F0D9AE}
  #menuFoot{margin-top:auto;padding-top:16px;font-size:12px;color:#A8B4BE;text-align:center;line-height:1.8}

  /* ══════════ 游戏 ══════════ */
  #play{position:absolute;inset:0;display:none;flex-direction:column;text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 7px) 12px calc(env(safe-area-inset-bottom,0px) + 7px)}
  #play.on{display:flex}

  header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:0 2px 4px;font-size:11.5px;color:#6B7A88;flex-wrap:nowrap}
  .stat{display:flex;gap:10px;align-items:baseline;white-space:nowrap;flex:none}
  .stat b{font-size:20px;color:#0B6BCB;font-weight:800;transition:transform .12s}
  .stat b.bump{transform:scale(1.32)}
  .stat .cb b{color:#C2410C}
  .stat .ac b{color:#0F7B3D}
  .stat .cb b.hot{color:#E8340C}
  .tools{display:flex;gap:5px;flex:none}
  .tb{border:1.5px solid #D3DCE4;background:#F7FAFC;color:#4A5A68;font-family:inherit;
    font-size:11.5px;padding:5px 9px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .tb.on{background:#E3F0FB;border-color:#0B6BCB;color:#0B4E96}

  /* 进度条 */
  /* 分数行（HTML 里叫 .statrow，CSS 原来只写了 .stat，漏了样式 → 挤成一团） */
  .statrow{flex:none;display:flex;justify-content:center;gap:24px;align-items:baseline;
    font-size:12.5px;color:#6B7A88;padding:3px 0 5px}
  .statrow b{font-size:22px;color:#0B6BCB;font-weight:800;transition:transform .12s}
  .statrow .cb b{color:#C2410C}
  .statrow .ac b{color:#0F7B3D}
  .statrow .cb b.hot{color:#E8340C}
  #prog{flex:none;height:7px;background:#EDF1F5;border-radius:5px;margin:2px 4px 0;overflow:hidden}
  #progFill{height:100%;width:0;border-radius:5px;
    background:linear-gradient(90deg,#5FD98A,#0B6BCB);transition:width .25s}

  #body{flex:1;min-height:0;display:flex;flex-direction:column}
  #main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;position:relative}
  @media (orientation:landscape){
    body #play{padding:calc(env(safe-area-inset-top,0px) + 5px) 16px calc(env(safe-area-inset-bottom,0px) + 5px)}
    #body{flex-direction:row;align-items:center;gap:2.2vw}
    #main{flex:1.05;min-width:0}
    #bar{flex:.95;min-width:0;padding-top:0}
    #foot{padding-top:12px;line-height:1.7}
  }

  #prev,#next{position:absolute;top:50%;transform:translateY(-50%);text-align:center;opacity:.5}
  #prev{left:1.5%} #next{right:1.5%}
  #prev .c,#next .c{font-size:clamp(28px,min(12vh,5.6vw),66px);line-height:1;color:#3A3A3A;
    font-family:"Noto Serif CJK SC","Songti SC",serif}
  #prev .p,#next .p{font-size:clamp(10px,min(1.7vh,1.1vw),14px);color:#7A8894;margin-top:3px}
  #prev .lab,#next .lab{font-size:10.5px;color:#B6C0C8;margin-bottom:3px}

  /* 大字 / 笔画动画 共用一块地方 */
  /* ★ 必须给个最小高度：原来 #stage 靠里面的大字撑开，
     而打对后大字会被 display:none 藏掉 → #stage 塌成 0 高 →
     绝对定位的笔画层也是 0 高，整个笔画动画画不出来（真机实测踩到）。 */
  #stage{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:clamp(96px,min(60vh,30vw),416px);min-width:clamp(96px,min(60vh,30vw),416px)}
  #big{font-size:clamp(90px,min(58vh,29vw),400px);line-height:.94;font-weight:700;color:#111;
    font-family:"Noto Serif CJK SC","Songti SC","Noto Sans CJK SC",serif}
  #big.hit{animation:pop .36s cubic-bezier(.34,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.10)}100%{transform:scale(1)}}
  #big.miss{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-12px)}
    70%{transform:translateX(12px)}}

  /* 笔画动画：宽度 = 大字宽度，高度 = 同比例 */
  #ink{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
  #ink.on{display:flex}
  #ink svg{width:clamp(96px,min(60vh,30vw),416px);height:clamp(96px,min(60vh,30vw),416px)}
  .ghost{fill:#EEF2F6}
  .inkS{fill:none;stroke:#111;stroke-linecap:round;stroke-linejoin:round}
  /* ★ 动画的**终点就是自然状态**（实线画满），万一动画被冻结也不会卡在半截 */
  .inkS{animation:draw .34s cubic-bezier(.4,.1,.3,1) both}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

  #py{font-size:clamp(22px,min(10vh,5vw),72px);line-height:1.15;margin-top:clamp(2px,1.2vh,14px);
    letter-spacing:3px;color:#0B6BCB;font-weight:700;min-height:1.15em}
  #py.hidden-py{color:#F4F7F9}

  #bar{flex:none;padding-top:clamp(6px,1.8vh,20px)}
  #type{width:100%;max-width:min(640px,46vw);margin:0 auto;display:block;
    background:#FFF;border:3px solid #C9D6E0;border-radius:16px;color:#111;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:clamp(22px,min(5.6vh,3.2vw),50px);letter-spacing:5px;text-align:center;
    padding:clamp(5px,1.2vh,14px) 14px;outline:none;caret-color:#0B6BCB}
  #type.good{border-color:#0F7B3D;background:#ECFAF1;color:#0B5B2C}
  #type.bad{border-color:#C62828;background:#FDECEC;color:#8E1B1B}
  #type::placeholder{color:#A8B4BE;letter-spacing:2px;font-size:.5em}
  #foot{flex:none;font-size:12.5px;color:#8E9BA6;padding-top:7px;min-height:20px}
  #foot em{font-style:normal;color:#5A6A78}

  /* 飘分 */
  .pop{position:absolute;font-size:clamp(24px,4.6vh,44px);font-weight:800;color:#0F7B3D;
    pointer-events:none;animation:rise .95s ease-out both;z-index:50}
  @keyframes rise{from{opacity:1;transform:translateY(0) scale(.9)}
    to{opacity:0;transform:translateY(-110px) scale(1.25)}}
  .pop.combo{color:#E8340C}

  /* ══════════ 结算 ══════════ */
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(255,255,255,.985);z-index:300;padding:0 26px;text-align:center}
  #over.on{display:flex}
  #over .big3{font-size:clamp(34px,7vh,64px);letter-spacing:6px;color:#E8A317}
  #over .big3 i{font-style:normal;color:#DCE3E9}
  #over h2{font-size:26px;color:#0B6BCB;letter-spacing:2px;margin-top:6px}
  #over .rows{margin-top:16px;font-size:16px;line-height:2;color:#4A5A68}
  #over .rows b{color:#C2410C;font-size:21px}
  #over .btns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #over button{border:none;border-radius:24px;padding:13px 30px;font-family:inherit;
    font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer}
  .bp{background:linear-gradient(180deg,#2E9BD6,#0B6BCB);color:#fff}
  .bs{background:#F1F5F9;color:#4A5A68;border:1.5px solid #D3DCE4 !important}

  #dbg{display:none;position:fixed;left:0;right:0;bottom:0;z-index:400;pointer-events:none;
    background:#F0F4F8;border-top:1px solid #D3DCE4;color:#0F5B3D;
    font:11px/1.5 ui-monospace,monospace;padding:5px 8px;white-space:pre-wrap;word-break:break-all}
  body.dbg #dbg{display:block}

  /* ══════════ 评级徽章 ══════════ */
  .gbadge{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:10px;font-weight:900;font-size:19px;
    color:#fff;flex:none}
  .g-S{background:linear-gradient(160deg,#FFD86B,#E8A317);box-shadow:0 2px 8px rgba(232,163,23,.45)}
  .g-A{background:linear-gradient(160deg,#7FE0A0,#0F7B3D)}
  .g-B{background:linear-gradient(160deg,#8FC7F0,#0B6BCB)}
  .g-C{background:linear-gradient(160deg,#C9D3DC,#7C8A96)}
  .g-D{background:linear-gradient(160deg,#E4E9ED,#AEB9C2)}
  .gbadge.big{width:clamp(64px,13vh,110px);height:clamp(64px,13vh,110px);
    border-radius:22px;font-size:clamp(38px,8vh,68px);letter-spacing:0}
  .lvcard .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .lvcard .best{font-size:12px;color:#8E9BA6;margin-top:4px}
  .lvcard .best b{color:#C2410C}
  .lvcard.pass{border-color:#B9E3C8;background:#F7FDF9}

  /* 组提示 */
  #groupTag{font-size:12px;color:#8E9BA6;white-space:nowrap;flex:none}
  #groupTag b{color:#0B6BCB}
  #targetTag{font-size:12px;color:#8E9BA6;white-space:nowrap}
  #targetTag b{color:#C2410C}

  /* 组结算 / 统计 面板 */
  .panel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(255,255,255,.985);z-index:320;padding:0 26px;text-align:center}
  .panel.on{display:flex}
  .panel h2{font-size:24px;color:#0B6BCB;letter-spacing:2px;margin-top:8px}
  .panel .rows{margin-top:14px;font-size:16px;line-height:2;color:#4A5A68}
  .panel .rows b{color:#C2410C;font-size:21px}

  /* 统计表 */
  #statsBody{width:100%;max-width:520px;margin-top:16px;font-size:13px;color:#4A5A68}
  .srow{display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;border-bottom:1px solid #EDF1F5;gap:8px}
  .srow .d{color:#8E9BA6;flex:none;width:74px;text-align:left}
  .srow .n{font-weight:700;color:#0B6BCB;flex:none;width:62px;text-align:right}
  .srow .a{color:#0F7B3D;flex:none;width:54px;text-align:right}
  .srow .t{color:#A8B4BE;flex:1;text-align:right;font-size:12px}
  .sbar{height:8px;border-radius:4px;background:#EDF1F5;overflow:hidden;flex:1;margin:0 8px}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#7FE0A0,#0B6BCB)}
  #statsEmpty{color:#A8B4BE;font-size:14px;margin-top:22px;line-height:1.9}
</style>
</head>
<body>

<!-- ══════════ 选关 ══════════ -->
<div id="menu">
  <div class="mtitle">看字打拼音</div>
  <div class="msub">看着大字，用键盘把拼音打出来</div>
  <div class="mtotal">
    <span>总星星 <b class="st" id="mStars">0</b> / 21</span>
    <span>最高分 <b id="mBest">0</b></span>
    <span>练过 <b id="mDays">0</b> 天</span>
  </div>
  <div class="mbtns">
    <button class="tb" id="mStats">📊 统计</button>
    <button class="tb" id="mHome">🏠 回游戏中心</button>
  </div>
  <div id="levels"></div>
  <div id="menuFoot">
    共 60 个字 · 6 关 + 挑战 · 每关 2 组、每组 5 个字<br>
    评分 <b>S</b> 完美 &nbsp;·&nbsp; <b>A</b> 优秀 &nbsp;·&nbsp; <b>B</b> 不错 &nbsp;·&nbsp; <b>C</b> 及格 &nbsp;·&nbsp; <b>D</b> 再来
  </div>
</div>

<!-- ══════════ 游戏 ══════════ -->
<div id="play">
  <header>
    <button class="tb" id="tBack">←</button>
    <div id="groupTag">第 <b>1</b> 关 · 第 <b>1</b>/2 组</div>
    <div id="targetTag">目标 <b>0</b></div>
    <div class="tools">
      <button class="tb" id="tSound">🔊</button>
      <button class="tb" id="tPy">拼音</button>
      <button class="tb" id="tKb">⌨</button>
    </div>
  </header>
  <div class="statrow">
    <span>分数 <b id="sScore">0</b></span>
    <span class="cb">连击 <b id="sCombo">0</b></span>
    <span class="ac">正确率 <b id="sAcc">–</b></span>
  </div>
  <div id="prog"><div id="progFill"></div></div>

  <div id="body">
    <div id="main">
      <div id="prev"><div class="lab">上一个</div><div class="c">·</div><div class="p"></div></div>
      <div id="next"><div class="lab">下一个</div><div class="c">·</div><div class="p"></div></div>
      <div id="stage">
        <div id="big">字</div>
        <div id="ink"></div>
      </div>
      <div id="py">zì</div>
    </div>
    <div id="bar">
      <input id="type" autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" inputmode="none" placeholder="在这里打拼音">
      <div id="foot"><em>看着大字，把它的拼音打出来</em> · 打对自动跳下一个</div>
    </div>
  </div>
</div>

<!-- ══════════ 组结算 ══════════ -->
<div class="panel" id="gpanel">
  <div style="font-size:44px" id="gpIcon">👍</div>
  <h2 id="gpTitle">第一组完成</h2>
  <div class="rows" id="gpRows"></div>
  <button class="bp" id="gpNext" style="margin-top:24px;border:none;border-radius:24px;
    padding:13px 34px;font-family:inherit;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,#2E9BD6,#0B6BCB);cursor:pointer">继续</button>
</div>

<!-- ══════════ 关结算 ══════════ -->
<div class="panel" id="over">
  <div class="gbadge big" id="ovGrade">A</div>
  <h2 id="ovTitle">过关！</h2>
  <div class="rows" id="ovRows"></div>
  <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button id="ovNext" style="border:none;border-radius:24px;padding:13px 30px;font-family:inherit;
      font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,#2E9BD6,#0B6BCB);cursor:pointer">下一关</button>
    <button id="ovAgain" class="bs" style="border:none;border-radius:24px;padding:13px 30px;font-family:inherit;
      font-size:16px;font-weight:800;color:#4A5A68;background:#F1F5F9;border:1.5px solid #D3DCE4;cursor:pointer">再来一次</button>
    <button id="ovMenu" class="bs" style="border:none;border-radius:24px;padding:13px 30px;font-family:inherit;
      font-size:16px;font-weight:800;color:#4A5A68;background:#F1F5F9;border:1.5px solid #D3DCE4;cursor:pointer">回选关</button>
  </div>
</div>

<!-- ══════════ 统计 ══════════ -->
<div class="panel" id="stats">
  <h2>练习统计</h2>
  <div class="rows" id="statsTop"></div>
  <div id="statsBody"></div>
  <div id="statsEmpty" style="display:none">还没有练习记录<br>去玩一关吧！</div>
  <button id="statsClose" style="margin-top:22px;border:none;border-radius:24px;padding:13px 34px;
    font-family:inherit;font-size:16px;font-weight:800;color:#4A5A68;background:#F1F5F9;
    border:1.5px solid #D3DCE4;cursor:pointer">返回</button>
</div>

<div id="dbg"></div>

<script>
'use strict';

function norm(s){
  return String(s || '').toLowerCase()
    .replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, c => TONE_MAP[c] || c)

  const t = norm(typed);

  const t = norm(typed);

 */
function diffOf(ch, strokeCount, answers){
  const n = strokeCount || 0;

  if (n){ if (n >= 10) d = 3; else if (n >= 6) d = 2; }

  return d;

function scoreFor(secs, wrong, streak, diff){
  let pts = 100 - wrong * 30;
  if (secs <= 2) pts += 50; else if (secs <= 4) pts += 25; else if (secs <= 7) pts += 10;
  pts = Math.max(10, pts);
  const combo = 1 + Math.min(streak, 10) * 0.1;
  const dm = DIFF_MULT[diff || 1] || 1;
  return Math.round(pts * combo * dm);
}

const PAR_PER_CHAR = 125;
function parScore(nChars){ return PAR_PER_CHAR * nChars; }

/**
 * 评级：S 最好（完美）→ A → B → C → D
 * S 要求**一次都没错**且分数够高 —— 给小朋友一个够得着的"完美"目标
 */
function gradeFor(score, par, wrongTotal){
  const r = par > 0 ? score / par : 0;
  if (wrongTotal === 0 && r >= 0.95) return 'S';
  if (r >= 0.90) return 'A';
  if (r >= 0.75) return 'B';
  if (r >= 0.55) return 'C';
  return 'D';
}

function starsFromGrade(g){ return ({ S:3, A:3, B:2, C:1, D:0 })[g] || 0; }
function passed(g){ return GRADE_ORDER[g] >= GRADE_ORDER['C']; }

function groupsOf(chars, per){
  per = per || PER_GROUP;
  const arr = typeof chars === 'string' ? [...chars] : chars.slice();
  const out = [];
  for (let i = 0; i < arr.length; i += per) out.push(arr.slice(i, i + per));
  return out;
}
function shuffled(n, rnd){
  const a = []; for (let i = 0; i < n; i++) a.push(i);
  rnd = rnd || Math.random;
  for (let i = a.length - 1; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }

    const t = this.d.days[k] || { chars:0, right:0, wrong:0, score:0, secs:0, levels:0 };
    for (const p in patch) t[p] = (t[p]||0) + patch[p];
    this.d.days[k] = t;
    this.put();
  },
  totalStars(){ let n=0; for(const k in this.d.lv) n += starsFromGrade(this.d.lv[k].grade); return n; },
  dayCount(){ return Object.keys(this.d.days).length; },
  recentDays(n){
    const out=[];
    for (let i=0;i<(n||7);i++){
      const dt=new Date(); dt.setDate(dt.getDate()-i);
      const k=dayKey(dt);
      out.push({ key:k, label: i===0?'今天':(i===1?'昨天':k.slice(5)), d: this.d.days[k]||null });
    }
    return out;
  },
};
Save.load();

/* ══════════ 状态 ══════════ */
const $ = s => document.querySelector(s);
const DEBUG = /[?&]debug=1/.test(location.search);
if (DEBUG) document.body.classList.add('dbg');

const S = {
  li: 0, groups: [], gi: 0, list: [], pos: 0,
  score: 0, combo: 0, bestCombo: 0, right: 0, wrong: 0,
  t0: 0, wrongThis: 0, times: [], showPy: true, softKb: false, playing: false,
  groupScore: 0, charsDone: 0, secsTotal: 0,
};

function strokeCount(ch){ return (window.STROKES && window.STROKES[ch] && window.STROKES[ch].s.length) || 0; }
function diff(ch){ return diffOf(ch, strokeCount(ch), answersOf(ch)); }
function levelChars(li){ return li < 0 ? LEVELS.map(l=>l.chars).join('') : LEVELS[li].chars; }
function parOfLevel(li){
  const chars = levelChars(li);
  let par = 0;
  for (const ch of chars) par += PAR_PER_CHAR * (DIFF_MULT[diff(ch)] || 1);
  return Math.round(par);
}
function parOfGroup(chars){
  let par = 0;
  for (const ch of chars) par += PAR_PER_CHAR * (DIFF_MULT[diff(ch)] || 1);
  return Math.round(par);
}

/* ══════════ 选关界面 ══════════ */
const GRADE_ICON = { S:'★', A:'✓', B:'·', C:'·', D:'·' };
function renderMenu(){
  $('#mStars').textContent = Save.totalStars();
  $('#mBest').textContent = Save.d.best || 0;
  $('#mDays').textContent = Save.dayCount();
  const box = $('#levels'); box.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const rec = Save.d.lv[i];
    const chars = lv.chars;
    const b = document.createElement('button');
    b.className='lvcard' + (rec && passed(rec.grade) ? ' pass' : '');
    b.innerHTML =
      '<div class="top"><div class="no">第 '+(i+1)+' 关</div>' +
      (rec ? '<div class="gbadge g-'+rec.grade+'">'+rec.grade+'</div>' : '<div class="no">未玩</div>') + '</div>' +
      '<div class="cs">'+chars+'</div>' +
      '<div class="best">过关线 '+parOfLevel(i)+' 分' + (rec ? '　最高 <b>'+rec.score+'</b>' : '') +
      (rec && rec.plays ? '　玩了 '+rec.plays+' 次' : '') + '</div>';
    b.addEventListener('click', ()=>startLevel(i));
    box.appendChild(b);
  });
  const recA = Save.d.lv.all;
  const b2=document.createElement('button');
  b2.className='lvcard bonus';
  b2.innerHTML =
    '<div class="top"><div class="no">挑战</div>' +
    (recA ? '<div class="gbadge g-'+recA.grade+'">'+recA.grade+'</div>' : '<div class="no">未玩</div>') + '</div>' +
    '<div class="nm">全部 60 个字</div>' +
    '<div class="cs" style="font-size:13px;letter-spacing:0">一次打完，看你能拿什么评级</div>' +
    '<div class="best">过关线 '+parOfLevel(-1)+' 分' + (recA ? '　最高 <b>'+recA.score+'</b>' : '') + '</div>';
  b2.addEventListener('click', ()=>startLevel(-1));
  box.appendChild(b2);
}

/* ══════════ 开始 ══════════ */
function startLevel(li){
  S.li = li;
  const chars = levelChars(li);
  // 按组切，组内打乱
  S.groups = groupsOf([...chars]).map(g => shuffled(g.length).map(k=>g[k]));
  S.gi = 0; S.score = 0; S.combo = 0; S.bestCombo = 0;
  S.right = 0; S.wrong = 0; S.times = []; S.charsDone = 0; S.secsTotal = 0;
  S.playing = true;
  $('#menu').classList.add('hide');
  $('#play').classList.add('on');
  $('#over').classList.remove('on');
  $('#gpanel').classList.remove('on');
  wantLandscape();
  startGroup();
  focusInput();
}

function startGroup(){
  S.list = S.groups[S.gi];
  S.pos = 0; S.groupScore = S.score;
  $('#groupTag').innerHTML = (S.li<0?'挑战':'第 '+(S.li+1)+' 关') +
    ' · 第 <b>'+(S.gi+1)+'</b>/'+S.groups.length+' 组';
  $('#targetTag').innerHTML = '目标 <b>'+parOfGroup(S.list)+'</b>';
  showCard();
}

/* ══════════ 出题 ══════════ */
function cur(){ return S.list[S.pos]; }

function showCard(){
  const ch = cur();
  $('#big').textContent = ch;
  $('#big').style.display='';
  $('#ink').classList.remove('on'); $('#ink').innerHTML='';
  $('#py').textContent = answersOf(ch)[0] || '';
  $('#py').style.visibility = S.showPy ? 'visible' : 'hidden';
  const p = S.pos>0 ? S.list[S.pos-1] : null;
  const n = S.pos<S.list.length-1 ? S.list[S.pos+1] : null;
  $('#prev .c').textContent = p||'·'; $('#prev .p').textContent = p?(answersOf(p)[0]||''):'';
  $('#next .c').textContent = n||'·'; $('#next .p').textContent = n?(answersOf(n)[0]||''):'';
  $('#prev').style.opacity = p?.5:.1; $('#next').style.opacity = n?.5:.1;
  const inp=$('#type'); inp.value=''; inp.className='';
  S.t0 = performance.now(); S.wrongThis = 0; wasPrefix = true;
  syncHud(); dbg();
}

function syncHud(){
  $('#sScore').textContent = S.score;
  const cb=$('#sCombo'); cb.textContent = S.combo; cb.classList.toggle('hot', S.combo>=5);
  const tot = S.right + S.wrong;
  $('#sAcc').textContent = tot ? Math.round(S.right/tot*100)+'%' : '–';
  const done = S.charsDone, all = levelChars(S.li).length;
  $('#progFill').style.width = (all ? done/all*100 : 0) + '%';
}
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'),150); }
function flyPop(text, cls){
  const st=$('#stage').getBoundingClientRect();
  const d=document.createElement('div'); d.className='pop'+(cls?' '+cls:'');
  d.textContent=text;
  d.style.left=(st.left+st.width/2-30+(Math.random()*60-30))+'px';
  d.style.top=(st.top+st.height*0.16)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1000);
}

/* ══════════ 输入 ══════════ */
let wasPrefix = true;
function focusInput(){ const i=$('#type'); try{ i.focus({preventScroll:true}); }catch(e){ i.focus(); } }

$('#type').addEventListener('input', ()=>{
  const inp=$('#type'), raw=inp.value;
  if (!raw) return;
  Snd.key();
  const ch=cur();
  if (isExact(ch, raw)){ hit(); return; }
  const ok = isPrefix(ch, raw);
  if (!ok && wasPrefix){
    S.wrong++; S.wrongThis++; S.combo=0;
    Snd.wrong();
    inp.classList.remove('good'); inp.classList.add('bad');
    const b=$('#big'); b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss');
    syncHud();
  } else if (ok){ inp.classList.remove('bad'); }
  wasPrefix = ok; dbg();
});

function hit(){
  const ch = cur();
  const secs = (performance.now()-S.t0)/1000;
  const d = diff(ch);
  const gain = scoreFor(secs, S.wrongThis, S.combo, d);
  S.score += gain; S.right++; S.times.push(secs);
  S.charsDone++; S.secsTotal += secs;
  if (S.wrongThis===0){ S.combo++; if (S.combo>1) Snd.combo(S.combo); } else S.combo=0;
  if (S.combo>S.bestCombo) S.bestCombo=S.combo;

  Snd.right(S.combo);
  const inp=$('#type'); inp.classList.remove('bad'); inp.classList.add('good');
  const b=$('#big'); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  const mult = (DIFF_MULT[d]||1);
  flyPop('+'+gain + (mult>1?' ('+DIFF_NAME[d]+')':''), S.combo>=3?'combo':'');
  bump($('#sScore')); syncHud(); dbg();

  const svg = Ink.build(ch);
  const next = ()=>{
    S.pos++;
    if (S.pos >= S.list.length) endGroup();
    else showCard();
  };
  if (svg){
    $('#big').style.display='none';
    const box=$('#ink'); box.innerHTML=''; box.appendChild(svg); box.classList.add('on');
    const hold = Math.min(420 + svg.dataset.strokes*300, 3600);
    setTimeout(next, hold);
  } else setTimeout(next, 220);
}

/* ══════════ 组结算 ══════════ */
function endGroup(){
  const got = S.score - S.groupScore;
  const par = parOfGroup(S.list);
  const r = par ? got/par : 0;
  $('#gpRows').innerHTML = '本组得分 <b>'+got+'</b>　标准分 '+par+'<br>' +
    (r>=0.95?'太棒了，接近满分！': r>=0.8?'很好，继续保持':'再快一点就更好啦');
  $('#gpIcon').textContent = r>=0.95?'🌟': r>=0.8?'👍':'💪';
  $('#gpTitle').textContent = '第 '+(S.gi+1)+' 组完成';
  $('#gpanel').classList.add('on');
  Snd.group();
  dbg();
}
$('#gpNext').addEventListener('click', ()=>{
  $('#gpanel').classList.remove('on');
  S.gi++;
  if (S.gi >= S.groups.length) finish();
  else { startGroup(); focusInput(); }
});

/* ══════════ 关结算 ══════════ */
function finish(){
  S.playing = false;
  const par = parOfLevel(S.li);
  const avg = S.times.length ? S.times.reduce((a,b)=>a+b,0)/S.times.length : 0;
  const tot = S.right + S.wrong;
  const acc = tot ? S.right/tot : 1;
  const g = gradeFor(S.score, par, S.wrong);
  const key = S.li < 0 ? 'all' : S.li;
  Save.level(key, g, S.score);
  Save.today({ chars: S.right, right: S.right, wrong: S.wrong,
               score: S.score, secs: Math.round(S.secsTotal), levels: 1 });

  $('#ovGrade').className = 'gbadge big g-' + g;
  $('#ovGrade').textContent = g;
  const okPass = passed(g);
  $('#ovTitle').textContent = g==='S' ? '完美！一次都没错！'
                            : okPass ? (S.li<0?'挑战完成！':LEVELS[S.li].name+' 过关！')
                            : '差一点点，再来一次？';
  $('#ovRows').innerHTML =
    '得分 <b>'+S.score+'</b>　过关线 '+par+'<br>' +
    '打对 '+S.right+' 个字　打错 '+S.wrong+' 次　正确率 <b>'+Math.round(acc*100)+'%</b><br>' +
    '平均 <b>'+avg.toFixed(2)+'</b> 秒/字　最高连击 <b>'+S.bestCombo+'</b>';
  $('#ovNext').style.display = (S.li>=0 && S.li<LEVELS.length-1) ? '' : 'none';
  $('#over').classList.add('on');
  if (okPass){ Snd.win(); for(let i=0;i<starsFromGrade(g);i++) Snd.star(i); }
  else Snd.fail();
  renderMenu(); dbg();
}

/* ══════════ 统计 ══════════ */
function renderStats(){
  const days = Save.recentDays(7);
  const tot = { chars:0, right:0, wrong:0, secs:0, levels:0 };
  for (const k in Save.d.days){ const d=Save.d.days[k];
    tot.chars+=d.chars||0; tot.right+=d.right||0; tot.wrong+=d.wrong||0;
    tot.secs+=d.secs||0; tot.levels+=d.levels||0; }
  const acc = (tot.right+tot.wrong) ? Math.round(tot.right/(tot.right+tot.wrong)*100) : 0;
  $('#statsTop').innerHTML =
    '一共练了 <b>'+tot.chars+'</b> 个字　'+tot.levels+' 关<br>' +
    '总正确率 <b>'+acc+'%</b>　累计 <b>'+Math.round(tot.secs/60)+'</b> 分钟';
  const maxChars = Math.max(1, ...days.map(x=>x.d?(x.d.chars||0):0));
  let html='';
  let any=false;
  for (const day of days){
    if (day.d){ any=true;
      const d=day.d, a=(d.right+d.wrong)?Math.round(d.right/(d.right+d.wrong)*100):0;
      html += '<div class="srow"><span class="d">'+day.label+'</span>' +
        '<span class="sbar"><i style="width:'+Math.round((d.chars||0)/maxChars*100)+'%"></i></span>' +
        '<span class="n">'+(d.chars||0)+' 字</span>' +
        '<span class="a">'+a+'%</span>' +
        '<span class="t">'+Math.round((d.secs||0)/60)+' 分</span></div>';
    } else {
      html += '<div class="srow"><span class="d">'+day.label+'</span>' +
        '<span class="sbar"><i style="width:0"></i></span>' +
        '<span class="n">—</span><span class="a">—</span><span class="t">—</span></div>';
    }
  }
  $('#statsBody').innerHTML = html;
  $('#statsEmpty').style.display = any ? 'none' : '';
  $('#stats').classList.add('on');
}

/* ══════════ 按钮 ══════════ */
function backToMenu(){
  S.playing = false;
  $('#play').classList.remove('on');
  $('#menu').classList.remove('hide');
  $('#over').classList.remove('on');
  $('#gpanel').classList.remove('on');
  try{ if (window.RugeScreen && RugeScreen.set) RugeScreen.set('portrait'); }catch(e){}
  renderMenu();
}
$('#tBack').addEventListener('click', backToMenu);
$('#mStats').addEventListener('click', renderStats);
$('#statsClose').addEventListener('click', ()=>$('#stats').classList.remove('on'));
$('#mHome').addEventListener('click', ()=>{
  try{ if (window.RugeNav && RugeNav.home){ RugeNav.home(); return; } }catch(e){}
  alert('请按手机的返回键回到游戏中心');    // 浏览器里没有桥，给个提示
});
$('#tSound').addEventListener('click', ()=>{ Snd.on=!Snd.on;
  $('#tSound').textContent = Snd.on?'🔊':'🔇'; if (Snd.on) Snd.right(0); });
$('#tPy').addEventListener('click', ()=>{ S.showPy=!S.showPy;
  $('#tPy').classList.toggle('on', !S.showPy);
  $('#tPy').textContent = S.showPy?'拼音':'默写';
  $('#py').style.visibility = S.showPy?'visible':'hidden'; });
$('#tKb').addEventListener('click', ()=>{ S.softKb=!S.softKb;
  $('#type').setAttribute('inputmode', S.softKb?'latin':'none');
  $('#tKb').classList.toggle('on', S.softKb);
  $('#tKb').textContent = S.softKb?'⌨ 开':'⌨'; focusInput(); });
$('#ovAgain').addEventListener('click', ()=>startLevel(S.li));
$('#ovNext').addEventListener('click', ()=>startLevel(Math.min(LEVELS.length-1, S.li+1)));
$('#ovMenu').addEventListener('click', backToMenu);

document.addEventListener('pointerdown', (e)=>{
  if (e.target.closest && e.target.closest('button')) return;
  if (S.playing) setTimeout(focusInput, 0);
});
addEventListener('blur', ()=>{ if (S.playing) focusInput(); });

function wantLandscape(){ try{ if (window.RugeScreen && RugeScreen.set) RugeScreen.set('landscape'); }catch(e){} }
addEventListener('pageshow', renderMenu);

function dbg(){
  if (!DEBUG) return;
  const ch = cur() || '?';
  document.getElementById('dbg').textContent =
    `关=${S.li} 组=${S.gi+1}/${S.groups.length} #${S.pos+1}/${S.list.length} 字=${ch} ` +
    `难度=${diff(ch)} 答案=${answersOf(ch).join('/')} 输入="${$('#type').value}" ` +
    `分=${S.score} 连=${S.combo} 对=${S.right} 错=${S.wrong} 完成=${S.charsDone} ` +
    `笔画=${strokeCount(ch)} 存档关=${Object.keys(Save.d.lv).length} 练过=${Save.dayCount()}天`;
}

window.__game = {
  LEVELS, PY, PER_GROUP,
  norm, isPrefix, isExact, scoreFor, shuffled, answersOf,
  diffOf, DIFF_MULT, parScore, gradeFor, GRADE_ORDER, starsFromGrade, groupsOf,
  Save, dayKey,
  state: ()=>({ li:S.li, gi:S.gi, groups:S.groups.length, pos:S.pos, total:S.list.length,
    score:S.score, combo:S.combo, right:S.right, wrong:S.wrong, playing:S.playing,
    ch:cur()||null, ans:cur()?answersOf(cur()):[], diff:cur()?diff(cur()):0,
    parLevel:parOfLevel(S.li), parGroup:parOfGroup(S.list),
    savedLevels:Object.keys(Save.d.lv).length, days:Save.dayCount(), stars:Save.totalStars() }),
  start: startLevel, menu: renderMenu, stats: renderStats,
};

renderMenu();
</script>
