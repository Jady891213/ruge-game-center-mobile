<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e8"><title>怪兽变声冒险</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main><header><button id="home" class="icon" aria-label="返回游戏中心">‹</button><h1>怪兽变声冒险</h1><button id="map" class="icon" aria-label="选择关卡">▦</button></header><section id="menu"><div class="hero"><div class="monster"></div><span class="music">♪</span></div><div id="levels" class="levels" aria-label="关卡"></div></section><section id="play" hidden><div class="levelbar"><strong id="levelLabel"></strong><span id="coins" aria-label="收集星星"></span><button id="reset" class="icon" aria-label="重新开始本关">↻</button></div><div id="stage"><canvas id="canvas" width="520" height="400" aria-label="怪兽冒险场景"></canvas><div id="cue" aria-live="polite"></div></div><div class="voicebar"><button id="microphone" class="mic" aria-label="开启声音控制"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg></button><div class="pitchtrack"><span class="pitchLabel low">低</span><span id="pitchDot"></span><span class="pitchLabel high">高</span></div><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button></div><div class="controls"><button id="jump" class="action" aria-label="跳一下"><span>↟</span>跳</button><button id="duck" class="action peach" aria-label="蹲一下"><span>↓</span>蹲</button></div></section></main>

<div id="win" class="overlay" hidden><div class="dialog"><div class="monster big"></div><div class="stars">★ ★ ★</div><h2>到家啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
