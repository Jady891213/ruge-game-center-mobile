<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e8"><title>唱跳小兔</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main><header><button id="home" class="icon" aria-label="返回游戏中心">‹</button><h1>唱跳小兔</h1><button id="map" class="icon" aria-label="选择关卡">▦</button></header><section id="menu"><div class="hero"><div class="monster"></div><span class="music">♪</span><div class="hero-cloud"></div></div><button id="tryVoice" class="try-voice"><span aria-hidden="true">♪</span> 试声音</button><button id="endless" class="try-voice endless"><span aria-hidden="true">∞</span> 一直跑</button><div id="levels" class="levels" aria-label="关卡"></div></section><section id="play" hidden><div class="levelbar"><strong id="levelLabel"></strong><span id="coins" aria-label="收集星星"></span><button id="practiceBack" class="practice-return" hidden>回关卡</button><button id="reset" class="icon" aria-label="重新开始本关">↻</button></div><div id="stage"><canvas id="canvas" width="520" height="400" aria-label="小兔森林冒险场景"></canvas><div id="cue" aria-live="polite"></div></div><div id="voiceReaction" class="voice-reaction" aria-live="polite"><span id="voiceWord">啊——</span><div class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div><div class="voicebar"><button id="microphone" class="mic" aria-label="开启声音控制"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg></button><div class="pitchtrack" aria-label="声音高低"><span class="pitchLabel low">↓ 低</span><span id="pitchDot"></span><span class="pitchLabel high">高 ↟</span></div><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button></div><div class="controls"><button id="jump" class="action" aria-label="跳一下"><span class="actionPose jumpPose" aria-hidden="true"></span><b>高音跳</b></button><button id="duck" class="action peach" aria-label="蹲一下"><span class="actionPose duckPose" aria-hidden="true"></span><b>低音蹲</b></button></div></section></main>
<div id="ready" class="overlay" hidden><div class="dialog"><div class="monster big"></div><h2 id="readyTitle">一起唱着跑</h2><div id="humMark" hidden><div class="hum-orb" id="humOrb"><span>啊</span><i></i></div><div class="hum-track"><span id="humProgress"></span></div><div id="humCaption">轻轻啊——</div></div><button id="startVoice" class="wide primary">开始</button><button id="startTouch" class="text-button">用手指玩</button></div></div>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="pauseMark">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="wide primary">继续</button><button id="pauseHome" class="wide secondary">回首页</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><div class="monster big"></div><div class="stars">★ ★ ★</div><h2 id="winTitle">到家啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/audio-input.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
