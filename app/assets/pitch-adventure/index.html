<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e4f4f5"><title>哼哼小飞机</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/back-navigation.css"></head>
<body><main>
<header><button id="home" class="icon" aria-label="返回上一级"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h1>哼哼小飞机</h1><button id="pauseButton" class="icon" aria-label="暂停" hidden><svg viewBox="0 0 24 24"><path d="M9 5v14M16 5v14"/></svg></button><span id="headerSpace" aria-hidden="true"></span></header>
<section id="gameArea"><div class="hud" id="hud" hidden><strong id="score" aria-label="通过的云门">0</strong><div id="lives" aria-label="三颗爱心"></div><span id="stars" aria-label="星星">★ 0</span></div><div id="stage"><canvas id="canvas" width="800" height="450" aria-label="小飞机飞过云门"></canvas><div class="scene-wash" id="sceneWash"></div><div id="flightCue" aria-hidden="true">♪</div></div>
<div id="startPanel" class="panel start-panel"><div class="title-tag"><span aria-hidden="true">♪</span> 哼哼，起飞</div><div class="best-badge">最高 <strong id="best">0</strong> 道云门</div><button id="startVoice" class="large primary"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg>开始飞行</button><button id="startTouch" class="text-button">用按钮玩</button></div>
<div id="voiceConsole" class="voice-console" hidden><div class="voice-heading"><span class="mic-dot" id="micDot"></span><strong id="voiceLabel" aria-live="polite">轻轻哼——</strong><button id="helpersToggle" class="helper-toggle" aria-label="展开辅助按钮" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg>按钮</button></div><div class="pitch-meter" id="pitchMeter" aria-label="音调高低"><span class="meter-low">低音 ↓</span><div class="meter-track"><i id="pitchDot"></i><span class="meter-center"></span></div><span class="meter-high">↑ 高音</span></div></div>
<div id="helpers" class="helpers" hidden><button id="descend" class="hold-button low" aria-label="按住降低高度"><svg viewBox="0 0 24 24"><path d="M12 4v16m-7-7 7 7 7-7"/></svg><span>下降</span></button><button id="rise" class="hold-button high" aria-label="按住升高高度"><svg viewBox="0 0 24 24"><path d="M12 20V4m-7 7 7-7 7 7"/></svg><span>上升</span></button></div>
</section></main>
<div id="calibrationPanel" class="overlay" hidden><div class="dialog calibration"><div id="humOrb" class="hum-orb"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg><i></i></div><h2 id="humCaption" aria-live="polite">轻轻哼——</h2><div class="hum-track"><span id="humProgress"></span></div><button id="retryVoice" class="large primary" hidden>再试一次</button><button id="calibrationTouch" class="text-button">用按钮玩</button></div></div>
<div id="pausePanel" class="overlay" hidden><div class="dialog"><div class="pause-picture" aria-hidden="true">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="large primary">继续飞</button><button id="pauseHome" class="large secondary">回首页</button></div></div>
<div id="endPanel" class="overlay" hidden><div class="dialog"><div class="result-star" aria-hidden="true">★</div><h2 id="endTitle">飞得真棒！</h2><div class="result-score"><strong id="endScore">0</strong><span>道云门</span></div><div id="endStars" class="end-stars">★ 0</div><button id="restart" class="large primary">再飞一次</button><button id="menuButton" class="text-button">休息一下</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/audio-input.js"></script><script src="flight-core.js"></script><script src="flight-input.js"></script><script src="art/flight-art.js"></script><script src="game.js"></script>
<script src="../shared/back-navigation.js"></script></body></html>
