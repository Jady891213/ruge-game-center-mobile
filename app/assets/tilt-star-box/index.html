<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="../shared/players.js"></script><script src="../shared/music.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6e8"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>翻转星星盒</title><link rel="stylesheet" href="../shared/back-navigation.css"></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回上一级"></button><h1>翻转星星盒</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="menu"><div class="hero" aria-hidden="true"><span class="artSprite heroNest nest0"></span><span class="artSprite heroStar star0"></span><span class="artSprite heroNest nest1"></span><span class="artSprite heroStar star1"></span></div><div id="levels" aria-label="关卡"></div><button id="continue" class="wide primary" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><div id="nestProgress" aria-label="星星到家"></div><button id="restart" class="icon" aria-label="重新开始本关"></button></div>
<div id="boardFrame"><div id="board" role="img" aria-label="星星盒棋盘"></div><div id="pieces" aria-hidden="true"></div><div id="directionGlow" aria-hidden="true"></div></div>
<div class="controlbar"><button id="tiltMode" aria-label="倾斜控制" class="mode" aria-pressed="true"></button><button id="touchMode" aria-label="点方向控制" class="mode" aria-pressed="false"></button><button id="calibrate" class="icon" aria-label="以当前姿势校准重力"></button></div>
<div id="directionPad" aria-label="移动方向"><button id="up" class="dir" aria-label="向上"></button><button id="left" class="dir" aria-label="向左"></button><div id="tiltIndicator" aria-label="倾斜方向"><span id="tiltDot"></span></div><button id="right" class="dir" aria-label="向右"></button><button id="down" class="dir" aria-label="向下"></button></div>
<div id="sensorNotice" role="status" hidden>试试点方向</div><div id="status" class="sr" aria-live="polite"></div><footer><button id="undo" class="tool"></button><button id="pauseButton" class="tool" aria-label="暂停"></button></footer></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="pauseMark" aria-hidden="true">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="wide primary">继续</button><button id="pauseTouch" class="wide secondary">点方向玩</button><button id="pauseHome" class="wide secondary">回首页</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2>重新开始？</h2><button id="confirmRestart" class="wide primary">重新开始</button><button id="cancelRestart" class="wide secondary">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog winDialog"><div class="winArt" aria-hidden="true"></div><div class="stars" aria-label="成功">★ ★ ★</div><h2>星星到家啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/motion.js"></script><script src="core.js"></script><script src="game.js"></script><script src="../shared/back-navigation.js"></script></body></html>
