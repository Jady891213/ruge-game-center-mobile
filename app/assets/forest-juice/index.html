<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e9"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>森林果汁屋</title><link rel="stylesheet" href="../shared/back-navigation.css"></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回上一级"></button><h1>森林果汁屋</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="scene" aria-hidden="true"><img id="sceneArt" src="../shared/forest-juice-banner.png" alt=""><div class="customer"></div><div class="sceneBadge">♥</div></section>
<section id="menu"><div id="levels" aria-label="关卡"></div><button id="continue" class="wide primary" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><span id="steps" aria-label="倒入次数"></span><button id="restart" class="icon" aria-label="重新开始本关"></button></div><div id="board" aria-label="果汁瓶"></div><div id="status" role="status" aria-live="polite"></div><footer><button id="undo" class="tool" aria-label="撤回上一次倒入"></button><button id="pauseButton" class="tool" aria-label="暂停"></button></footer></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="dialogIcon">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="wide primary">继续</button><button id="pauseHome" class="wide secondary">回首页</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><div class="dialogIcon">↻</div><h2>重新开始？</h2><button id="confirmRestart" class="wide primary">重新开始</button><button id="cancelRestart" class="wide secondary">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog winDialog"><div class="customer prize" aria-hidden="true"></div><div class="stars" aria-label="成功">★ ★ ★</div><h2>果汁好啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
<script src="../shared/feedback.js"></script>
<script src="core.js"></script><script src="game.js"></script><script src="../shared/back-navigation.js"></script></body></html>
