<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf5d5"><title>口令小冒险</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main><header><button id="home" class="icon" aria-label="返回游戏中心">‹</button><h1>口令小冒险</h1><button id="map" class="icon" aria-label="选择关卡">▦</button></header><section id="menu"><div class="hero"><div class="hero-path"></div><div class="hero-goal prop prop-door"></div><div class="hero-player sprite"></div><div class="speech">向右！</div></div><div id="levels" class="levels" aria-label="关卡"></div></section><section id="play" hidden><div class="levelbar"><strong id="levelLabel"></strong><div id="mission" aria-label="本关目标"></div><button id="reset" class="icon" aria-label="重新开始本关">↻</button></div><div id="world"><div id="compass" class="compass" data-facing="right" aria-label="面向右"><span data-facing="up">↑</span><span data-facing="left">←</span><span data-facing="right" class="active">→</span><span data-facing="down">↓</span></div><div class="world-sky"></div><div id="board" aria-label="冒险地图"><div id="tiles"></div><div id="goal" class="entity goal"><span id="goalArt" class="prop"></span></div><div id="item" class="entity item"><span id="itemArt" class="prop"></span></div><div id="actor" class="entity actor"><span id="shadow" class="shadow"></span><span id="player" class="sprite"></span><span id="carried" class="prop"></span><span id="facing" class="facing"></span></div><div id="sparkles" aria-hidden="true"></div></div><div id="taskTrail" class="task-trail" aria-label="任务进度"></div></div><div class="voicebar"><button id="microphone" class="mic" aria-label="重新听口令"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg></button><div class="listening"><div id="heard" role="status" aria-live="polite">准备麦克风</div><div id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button><button id="padToggle" class="icon" aria-label="展开手指辅助" aria-expanded="false"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="2" y="2" width="28" height="20" rx="6"/><path d="M9 8v8M5 12h8M22 9h1M25 15h1"/></svg></button></div><div id="commandCards" tabindex="0" aria-label="可上下滚动的真实口令表"></div><div id="pad" class="pad" hidden><button data-command="up" class="move up" aria-label="向上">↑</button><button data-command="left" class="move left" aria-label="向左">←</button><button data-command="stop" class="move stop" aria-label="停止">■</button><button data-command="right" class="move right" aria-label="向右">→</button><button data-command="down" class="move down" aria-label="向下">↓</button><button data-command="jump" class="task jump" aria-label="跳一下">↟<span>跳</span></button><button data-command="take" class="task take" aria-label="拿起">↑<span>拿起</span></button><button data-command="put" class="task put" aria-label="放下">↓<span>放下</span></button></div></section></main>
<div id="ready" class="overlay" hidden><div class="dialog"><div class="portrait sprite"></div><h2 id="readyTitle">准备麦克风…</h2><div id="loading" class="loading" aria-hidden="true"><i></i><i></i><i></i></div><button id="startVoice" class="wide primary" hidden>再听一次</button><button id="startTouch" class="wide secondary">手指辅助</button></div></div><div id="pause" class="overlay" hidden><div class="dialog"><div class="pauseMark">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="wide primary">继续探险</button><button id="pauseHome" class="wide secondary">回首页</button></div></div><div id="win" class="overlay" hidden><div class="dialog"><div class="portrait sprite celebrating"></div><div class="stars">★ ★ ★</div><h2 id="winTitle">送到啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/audio-input.js"></script><script src="core.js"></script><script src="direction-art.js"></script><script src="game.js"></script></body></html>
