<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><title>口令小冒险</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body><main><header><button id="home" class="icon" aria-label="返回游戏中心">‹</button><h1>口令小冒险</h1><button id="map" class="icon" aria-label="选择关卡">▦</button></header><section id="menu"><div class="hero"><div class="monster"></div><div class="speech">向右</div></div><div id="levels" class="levels" aria-label="关卡"></div></section><section id="play" hidden><div class="levelbar"><strong id="levelLabel"></strong><div id="mission" aria-label="本关目标"></div><button id="reset" class="icon" aria-label="重新开始本关">↻</button></div><div id="board" aria-label="冒险地图"></div><div class="voicebar"><button id="microphone" class="mic" aria-label="开启口令控制"><svg viewBox="0 0 24 24"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0zM6 10v1a6 6 0 0012 0v-1M12 17v4M8 21h8"/></svg></button><div id="heard" role="status" aria-live="polite">用口令来探险</div><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button></div><div class="pad"><button data-command="up" class="move up" aria-label="向上">↑</button><button data-command="left" class="move left" aria-label="向左">←</button><button data-command="stop" class="move stop" aria-label="停止">■</button><button data-command="right" class="move right" aria-label="向右">→</button><button data-command="down" class="move down" aria-label="向下">↓</button><button data-command="jump" class="task jump" aria-label="跳一下">↟<span>跳</span></button><button data-command="take" class="task take" aria-label="拿起来"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M8 21V10a3 3 0 016 0v8-13a3 3 0 016 0v13-10a3 3 0 016 0v12-6a3 3 0 016 0v11c0 9-5 13-13 13-6 0-8-3-11-8l-5-7a3 3 0 015-4l5 4"/></svg><span>拿起</span></button><button data-command="put" class="task put" aria-label="放下">↓<span>放下</span></button></div></section></main>
<div id="ready" class="overlay" hidden><div class="dialog"><div class="monster big"></div><h2 id="readyTitle">一起去探险</h2><button id="startVoice" class="wide primary">用口令玩</button><button id="startTouch" class="wide secondary">用手指玩</button></div></div><div id="pause" class="overlay" hidden><div class="dialog"><div class="pauseMark">Ⅱ</div><h2>歇一歇</h2><button id="resume" class="wide primary">继续</button><button id="pauseHome" class="wide secondary">回首页</button></div></div><div id="win" class="overlay" hidden><div class="dialog"><div class="monster big"></div><div class="stars">★ ★ ★</div><h2>送到啦！</h2><button id="next" class="wide primary">下一关</button><button id="winMap" class="wide secondary">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/audio-input.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
