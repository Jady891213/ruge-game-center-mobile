<script>
'use strict';
const N=1,E=2,S=4,W=8,OPP={1:4,2:8,4:1,8:2},DX={1:0,2:1,4:0,8:-1},DY={1:-1,2:0,4:1,8:0};
// 人工设计的十条水路。所有坐标显式定义，不在页面主线程搜索路径。
const LEVELS=[
 {w:3,h:3,name:'第一口水',tip:'蓝色是水源，金色是小花。<b>点中间的管子接起来。</b>',path:[[0,1],[1,1],[1,2],[2,2]]},
 {w:3,h:3,name:'绕个小弯',tip:'先顺着蓝色水流走，<b>找到下一节断开的管子。</b>',path:[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[2,2]]},
 {w:4,h:3,name:'向上生长',tip:'水也能往上走。<b>直管转半圈看起来一样。</b>',path:[[0,2],[1,2],[1,1],[1,0],[2,0],[2,1],[3,1]]},
 {w:4,h:4,name:'曲折花径',tip:'不是每个格子都要用上。<b>只要把水送到小花。</b>',path:[[0,0],[1,0],[1,1],[2,1],[2,2],[1,2],[1,3],[2,3],[3,3]]},
 {w:4,h:4,name:'秘密近道',tip:'灰色管子里有干扰项。<b>先想好水要从哪里经过。</b>',path:[[0,3],[0,2],[1,2],[1,1],[0,1],[0,0],[1,0],[2,0],[2,1],[3,1],[3,2]]},
 {w:5,h:4,name:'湖畔花田',tip:'长水路也可以一节一节来。<b>按 ↶ 可以撤回上一步。</b>',path:[[0,0],[0,1],[1,1],[1,2],[0,2],[0,3],[1,3],[2,3],[2,2],[2,1],[2,0],[3,0],[3,1],[4,1]]},
 {w:5,h:4,name:'枝叶之间',tip:'水源和小花固定不动。<b>沿水流寻找转弯处。</b>',path:[[0,3],[1,3],[1,2],[0,2],[0,1],[1,1],[1,0],[2,0],[3,0],[3,1],[2,1],[2,2],[3,2],[3,3],[4,3]]},
 {w:5,h:5,name:'花园回廊',tip:'留意看起来能接上的近路。<b>不必追求把每格变蓝。</b>',path:[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3],[0,4],[1,4],[2,4],[2,3],[3,3],[3,2],[2,2],[2,1],[3,1],[3,0],[4,0]]},
 {w:5,h:5,name:'晚风绕行',tip:'一关有三次提示。<b>先观察出口，再规划路线。</b>',path:[[0,4],[0,3],[1,3],[1,4],[2,4],[2,3],[3,3],[3,4],[4,4],[4,3],[4,2],[3,2],[3,1],[2,1],[2,2],[1,2],[1,1],[0,1],[0,0],[1,0],[2,0],[3,0],[4,0]]},
 {w:5,h:5,name:'盛开的花园',tip:'最后一片花园。<b>把一路清水带到花根。</b>',path:[[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[3,3],[2,3],[1,3],[1,2],[1,1],[1,0],[2,0],[2,1],[2,2],[3,2],[3,1],[3,0],[4,0],[4,1],[4,2]]}
];
function rotCW(m){return ((m<<1)|(m>>3))&15}function rotN(m,k){for(let i=0;i<(k%4+4)%4;i++)m=rotCW(m);return m}
function rng(seed){return ()=>((seed=Math.imul(seed,1664525)+1013904223)>>>0)/4294967296}
function dir(a,b){return b[0]>a[0]?E:b[0]<a[0]?W:b[1]>a[1]?S:N}
function newGame(li){const L=LEVELS[li],rnd=rng(1087+li*7919),map=new Map(L.path.map((p,i)=>[p.join(','),i])),tiles=[];for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const pi=map.get(x+','+y),src=pi===0,dst=pi===L.path.length-1;let sol;if(pi!==undefined){sol=(pi?dir([x,y],L.path[pi-1]):W)|(pi<L.path.length-1?dir([x,y],L.path[pi+1]):E)}else sol=rnd()<.55?N|E:N|S;let rot=src||dst?0:1+Math.floor(rnd()*3);if(!src&&!dst&&rotN(sol,rot)===sol)rot=1;tiles.push({x,y,sol,rot,src,dst,locked:src||dst,onPath:pi!==undefined})}const g={li,w:L.w,h:L.h,tiles,path:L.path,moves:0,hints:0,history:[],won:false,par:0};g.par=tiles.reduce((s,t)=>s+(t.onPath&&!t.locked?turnsToSolution(t):0),0);return g}
function turnsToSolution(t){for(let k=0;k<4;k++)if(rotN(t.sol,t.rot+k)===t.sol)return k;return 0}function maskOf(t){return rotN(t.sol,t.rot)}function tileAt(g,x,y){return x<0||y<0||x>=g.w||y>=g.h?null:g.tiles[y*g.w+x]}
function flood(g){const src=g.tiles.findIndex(t=>t.src),wet={},distance={};wet[src]=1;distance[src]=0;const q=[src];for(let k=0;k<q.length;k++){const i=q[k],t=g.tiles[i];for(const d of [N,E,S,W]){if(!(maskOf(t)&d))continue;const nb=tileAt(g,t.x+DX[d],t.y+DY[d]);if(!nb||!(maskOf(nb)&OPP[d]))continue;const ni=nb.y*g.w+nb.x;if(wet[ni])continue;wet[ni]=1;distance[ni]=distance[i]+1;q.push(ni)}}return {wet,distance}}
function isSolved(g){const d=g.tiles.findIndex(t=>t.dst);return !!flood(g).wet[d]}
function rotate(g,i){const t=g.tiles[i];if(!t||t.locked||g.won)return false;g.history.push({i,rot:t.rot,moves:g.moves});t.rot=(t.rot+1)%4;g.moves++;return true}
function undo(g){if(g.won||!g.history.length)return false;const s=g.history.pop();g.tiles[s.i].rot=s.rot;g.moves=s.moves;return true}
function starsFor(g){const n=g.moves<=g.par+2?3:g.moves<=Math.ceil(g.par*1.5)+3?2:1;return g.hints?Math.min(n,2):n}
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',KEY='gardenFlowV2';let progress={highest:0,best:{},stars:{}};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')progress={highest:Math.max(0,Math.min(9,Number(s.highest)||0)),best:s.best||{},stars:s.stars||{}}}catch(e){}
let li=location.hash?Math.min(progress.highest,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1)):progress.highest,G=null,initial=null,winTimer=null,toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function toast(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2400)}
let AC=null;function tone(f,d=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),a=AC.createGain();o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(.045,AC.currentTime);a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const cloud='<svg viewBox="0 0 32 32"><path d="M7 20a5 5 0 0 1 0-10 8 8 0 0 1 15-1 6 6 0 0 1 2 11Z" fill="#F3FCFD" stroke="#268FAB" stroke-width="1.6"/><path d="M12 23l-2 4M20 23l-2 4" stroke="#58B5CA" stroke-width="2" stroke-linecap="round"/></svg>';
const flower='<svg viewBox="0 0 32 32"><path d="M16 30V17M16 25q-9 0-9-7 8-1 9 7M16 22q9 0 9-7-8 0-9 7" fill="#8FBFA2" stroke="#4D826B" stroke-width="1.3"/><g fill="#D97051"><circle cx="16" cy="7" r="5"/><circle cx="22" cy="12" r="5"/><circle cx="19" cy="18" r="5"/><circle cx="12" cy="18" r="5"/><circle cx="9" cy="12" r="5"/></g><circle cx="16" cy="12" r="4" fill="#E7B75A"/></svg>';
function pipePath(mask){const ds=[N,E,S,W].filter(d=>mask&d),end=d=>[50+DX[d]*50,50+DY[d]*50];if(ds.length===2){const a=end(ds[0]),b=end(ds[1]);if(OPP[ds[0]]===ds[1])return `M${a[0]},${a[1]}L${b[0]},${b[1]}`;const p=[50+DX[ds[0]]*19,50+DY[ds[0]]*19],q=[50+DX[ds[1]]*19,50+DY[ds[1]]*19];return `M${a[0]},${a[1]}L${p[0]},${p[1]}Q50,50 ${q[0]},${q[1]}L${b[0]},${b[1]}`}return ds.map(d=>{const a=end(d);return `M50,50L${a[0]},${a[1]}`}).join('')}
function makeSVG(t){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 100 100');for(const cls of ['pipe-edge','pipe-body','water','spark']){const p=document.createElementNS(NS,'path');p.setAttribute('class',cls);p.setAttribute('d',pipePath(maskOf(t)));s.appendChild(p)}return s}
function renderBoard(){const grid=$('#grid');grid.style.gridTemplateColumns=`repeat(${G.w},1fr)`;grid.innerHTML='';G.tiles.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tile'+(t.locked?' locked':'')+(t.src?' source':'')+(t.dst?' flower':'');b.dataset.i=i;b.setAttribute('aria-label',t.src?'固定水源':t.dst?'固定花根':`第${t.y+1}行第${t.x+1}列水管，点击旋转`);b.appendChild(makeSVG(t));if(t.locked){const m=document.createElement('span');m.className='marker';m.textContent='●';b.appendChild(m);const label=document.createElement('span');label.className='endpoint';label.innerHTML=(t.src?cloud:flower)+(t.src?'进水':'花根');b.appendChild(label)}b.addEventListener('click',()=>onTile(i));grid.appendChild(b)});fit();sync()}
function fit(){if(!G)return;const s=$('#stage'),available=Math.max(120,s.clientHeight-36),width=Math.min(s.clientWidth-52,460,available*G.w/G.h);$('#frame').style.width=width+'px';requestAnimationFrame(drawConnections)}
function drawConnections(){
 if(!G)return;
 const overlay=$('#connections'),grid=$('#grid'),r=grid.getBoundingClientRect(),{wet}=flood(G),children=Array.from(grid.children),unit=children[0].getBoundingClientRect().width/100;
 overlay.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);overlay.innerHTML='';
 function line(x1,y1,x2,y2,isWet){
  for(const layer of [{color:'#5F817D',width:18},{color:'#DBE7DF',width:12},...(isWet?[{color:'#58B5CA',width:9}]:[])]){
   const p=document.createElementNS(NS,'line');
   for(const [k,v]of Object.entries({x1,y1,x2,y2}))p.setAttribute(k,v);
   p.style.stroke=layer.color;p.style.strokeWidth=layer.width*unit;p.style.strokeLinecap='butt';overlay.appendChild(p);
  }
 }
 G.tiles.forEach((t,i)=>{
  const a=children[i].getBoundingClientRect(),cx=a.left-r.left+a.width/2,cy=a.top-r.top+a.height/2;
  for(const d of [E,S]){
   const nb=tileAt(G,t.x+DX[d],t.y+DY[d]);if(!nb||!(maskOf(t)&d)||!(maskOf(nb)&OPP[d]))continue;
   const j=nb.y*G.w+nb.x,b=children[j].getBoundingClientRect();
   if(d===E)line(a.right-r.left-1,cy,b.left-r.left+1,cy,wet[i]&&wet[j]);else line(cx,a.bottom-r.top-1,cx,b.top-r.top+1,wet[i]&&wet[j]);
  }
  if(t.src)line(-14,cy,1,cy,wet[i]);if(t.dst)line(r.width-1,cy,r.width+14,cy,wet[i]);
 });
}
function sync(){const {wet,distance}=flood(G);G.tiles.forEach((t,i)=>{const el=$(`#grid [data-i="${i}"]`);el.classList.toggle('wet',!!wet[i]);el.querySelectorAll('path').forEach(p=>p.setAttribute('d',pipePath(maskOf(t))));el.style.setProperty('--distance',distance[i]||0)});$('#moves').textContent=G.moves;$('#undo').disabled=!G.history.length||G.won;$('#hint').disabled=G.hints>=3||G.won;$('#hintLeft').textContent=3-G.hints;const best=progress.best[li];$('#best').innerHTML=best!==undefined?`最佳 <strong>${best} 次</strong><br>${'★'.repeat(progress.stars[li]||0)}`:'初次种下这片花园';$('#status').innerHTML=G.won?'<span class="water-dot"></span>水已送到花根':`<span class="water-dot"></span>清水经过 ${Object.keys(wet).length} 节 · ${LEVELS[li].name}`;drawConnections()}
function onTile(i){if(!rotate(G,i))return;tone(480);document.querySelectorAll('.tile.hint').forEach(t=>t.classList.remove('hint'));sync();const s=$(`#grid [data-i="${i}"] svg`);s.classList.remove('spin');void s.getBoundingClientRect();s.classList.add('spin');if(isSolved(G))winNow()}
function startLevel(i){clearTimeout(winTimer);li=i;G=newGame(li);initial=G.tiles.map(t=>t.rot);$('#win').hidden=true;$('#levels').hidden=true;$('#lvnum').textContent=li+1;$('#lesson').innerHTML=LEVELS[li].tip;$('#dots').innerHTML=LEVELS.map((_,j)=>`<i class="${j<li?'done ':''}${j===li?'now':''}"></i>`).join('');renderBoard()}
function retry(){clearTimeout(winTimer);G.tiles.forEach((t,i)=>t.rot=initial[i]);G.moves=0;G.hints=0;G.history=[];G.won=false;$('#win').hidden=true;document.querySelectorAll('.tile.hint').forEach(t=>t.classList.remove('hint'));sync()}
function winNow(){if(G.won)return;G.won=true;const stars=starsFor(G);progress.highest=Math.max(progress.highest,Math.min(9,li+1));progress.stars[li]=Math.max(progress.stars[li]||0,stars);if(!G.hints&&(progress.best[li]===undefined||G.moves<progress.best[li]))progress.best[li]=G.moves;save();sync();[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.16),i*90));$('#winTitle').textContent=li===9?'十片花园都开花了':'小花喝到水了';$('#stars').innerHTML='★'.repeat(stars)+`<span class="off">${'★'.repeat(3-stars)}</span>`;$('#winSub').textContent=`转了 ${G.moves} 次${G.hints?' · 用了 '+G.hints+' 次提示':''}。`+(stars===3?'水路接得又快又好。':'再少转几次，争取三颗星。');$('#next').textContent=li===9?'回到第一片花园':'下一片花园 →';winTimer=setTimeout(()=>$('#win').hidden=false,500)}
$('#next').addEventListener('click',()=>startLevel(li===9?0:li+1));$('#retry').addEventListener('click',retry);$('#winRetry').addEventListener('click',retry);$('#undo').addEventListener('click',()=>{if(undo(G)){tone(400);sync()}});$('#hint').addEventListener('click',()=>{if(G.hints>=3||G.won)return;const p=G.path.find(([x,y])=>{const t=tileAt(G,x,y);return !t.locked&&maskOf(t)!==t.sol});if(!p){toast('顺着水源再检查一下连接。');return}G.hints++;const t=tileAt(G,p[0],p[1]),el=$(`#grid [data-i="${p[1]*G.w+p[0]}"]`);document.querySelectorAll('.tile.hint').forEach(t=>t.classList.remove('hint'));el.classList.add('hint');toast(`金色框里的管子，再转 ${turnsToSolution(t)} 次。`);sync()});
$('#levelBtn').addEventListener('click',()=>{const grid=$('#levelGrid');grid.innerHTML='';LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className=i===li?'current':'';b.disabled=i>progress.highest;b.innerHTML=(i>progress.highest?'·':i+1)+`<small>${'★'.repeat(progress.stars[i]||0)||L.name.slice(0,2)}</small>`;b.addEventListener('click',()=>startLevel(i));grid.appendChild(b)});$('#levels').hidden=false});$('#closeLevels').addEventListener('click',()=>$('#levels').hidden=true);$('#home').addEventListener('click',()=>{try{if(window.RugeNav&&RugeNav.home)RugeNav.home();else location.href='../index.html'}catch(e){}});addEventListener('resize',fit);
window.__game={LEVELS,newGame,rotCW,rotN,rotate,undo,maskOf,tileAt,flood,isSolved,starsFor,turnsToSolution,loadLevel:startLevel,retry,state:()=>({li,moves:G.moves,hints:G.hints,par:G.par,won:G.won,tiles:G.tiles.map(t=>({...t})),progress:JSON.parse(JSON.stringify(progress))})};
startLevel(li);
