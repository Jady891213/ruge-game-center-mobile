<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>水果天平</title></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回游戏中心"></button><h1>水果天平</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="menu"><div class="hero"><div class="heroItems"><svg class="fruit f0" viewBox="80 55 360 425" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><image href="art/items.png" width="1536" height="1024"/></svg><svg class="fruit f2" viewBox="1080 48 408 430" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><image href="art/items.png" width="1536" height="1024"/></svg><svg class="fruit f5" viewBox="1060 515 440 455" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><image href="art/items.png" width="1536" height="1024"/></svg></div><svg class="heroScale" viewBox="0 0 200 90" aria-hidden="true"><path d="M100 20V80M70 80h60M20 22h160M22 22v30m156-30v30M3 52q20 27 40 0M157 52q20 27 40 0"/></svg></div><div id="levels" aria-label="关卡"></div><button id="continue" class="primary wide" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><button id="restart" class="icon" aria-label="重来本关"></button><button id="pauseButton" class="icon" aria-label="暂停"></button></div><div id="clues" aria-label="天平线索"></div><nav id="bridgeTabs" aria-label="选择天平"></nav>
<section id="board" aria-label="天平"><div class="boardSun"></div><div class="hill leftHill"></div><div class="hill rightHill"></div><div id="beam"><div id="leftPan" class="pan fixedPan"></div><div id="rightPan" class="pan"></div></div><div class="pivot"></div><div id="balanceSignal" aria-live="polite">?</div><div id="countRule" class="countRule" hidden></div></section>
<div id="stock" aria-label="水果篮"></div><footer><button id="clear" class="tool" aria-label="取回水果"></button><button id="weigh" class="primary">放好啦</button></footer></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><svg class="fruit f2 dialogFruit" viewBox="1080 48 408 430" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><image href="art/items.png" width="1536" height="1024"/></svg><h2>休息一下</h2><button id="resume" class="primary wide">继续玩</button><button id="pauseHome" class="secondary wide">回游戏中心</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2>重新开始？</h2><button id="confirmRestart" class="primary wide">重来</button><button id="cancelRestart" class="secondary wide">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><svg class="fruit f5 dialogFruit" viewBox="1060 515 440 455" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><image href="art/items.png" width="1536" height="1024"/></svg><div class="stars">★★★</div><button id="next" class="primary wide">下一关</button><button id="winMap" class="secondary wide">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
