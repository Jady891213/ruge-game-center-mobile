<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>动物天平桥</title></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回游戏中心"></button><h1>动物天平桥</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="menu"><div class="hero"><span class="animal a1"></span><span class="heroBridge">⚖</span><span class="animal a5"></span></div><div id="levels" aria-label="关卡"></div><button id="continue" class="primary wide" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><button id="restart" class="icon" aria-label="重来本关"></button><button id="pauseButton" class="icon" aria-label="暂停"></button></div><div id="clues" aria-label="天平线索"></div><nav id="bridgeTabs" aria-label="选择天平桥"></nav>
<section id="board" aria-label="天平桥"><div class="hill leftHill"></div><div class="hill rightHill"></div><div id="beam"><div id="leftPan" class="pan fixedPan"></div><div id="rightPan" class="pan"></div></div><div class="pivot"></div><div id="balanceSignal" aria-live="polite">?</div><div id="countRule" class="countRule" hidden></div></section>
<div id="stock" aria-label="可用动物"></div><footer><button id="clear" class="tool" aria-label="取回当前动物"></button><button id="weigh" class="primary">称一称</button></footer></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="animal a1"></div><h2>休息一下</h2><button id="resume" class="primary wide">继续玩</button><button id="pauseHome" class="secondary wide">回游戏中心</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2>重新开始？</h2><button id="confirmRestart" class="primary wide">重来</button><button id="cancelRestart" class="secondary wide">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><div class="animal a5"></div><div class="stars">★★★</div><button id="next" class="primary wide">下一关</button><button id="winMap" class="secondary wide">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
