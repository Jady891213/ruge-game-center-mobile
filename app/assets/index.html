<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF7EF"><title>乳鸽游戏中心</title><link rel="stylesheet" href="shared/ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans CJK SC",sans-serif;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}main{max-width:860px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--blue);font-weight:800}h1{font-size:28px;margin:5px 0 8px}header svg{width:54px;height:54px;flex:none}.intro{font-size:13px;color:var(--muted);margin:2px 0 20px;line-height:1.6}.tabs{display:flex;gap:6px;margin:20px 0 17px;overflow:auto}.tabs button{white-space:nowrap;padding:9px 13px;font-size:12px}.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.section-line{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:0 2px 12px}.section-line b{color:var(--ink);font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{text-decoration:none;color:inherit;background:#fffdf8;border:1px solid #dfe5d8;border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #e6e9df;transition:transform .12s}.card:active{transform:translateY(2px);box-shadow:none}.cover{display:block;width:100%;height:auto;aspect-ratio:5/3;object-fit:contain;background:#FBF7EF}.meta{padding:11px 12px 13px}.meta h2{font-size:16px;margin:0 0 5px;line-height:1.3}.meta p{font-size:11px;color:var(--muted);margin:0;line-height:1.6;min-height:35px}.card-foot{margin-top:8px;display:flex;justify-content:space-between;gap:4px;font-size:9px;color:var(--blue);font-weight:700}.recent{display:none;margin:17px 0 3px}.recent a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#EAF0E5;border-radius:15px;padding:11px 14px;font-size:13px}.recent small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.recent .arrow{margin-left:auto;color:var(--blue)}footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}footer button{font-size:11px;padding:8px 12px;min-height:40px}.note{font-size:10px;color:var(--muted);margin-top:11px}@media(min-width:700px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:36px}}
</style></head><body><main><header><div><div class="eyebrow">LITTLE MOMENTS · BIG FUN</div><h1 class="ruge-title">乳鸽游戏中心</h1></div><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="20" fill="#E7EDD9"/><path d="M17 40q-4-18 7-18h17q11 0 8 18q-2 7-9-1H26q-7 8-9 1Z" fill="#243A35"/><path d="M26 26v10m-5-5h10" stroke="#FBF7EF" stroke-width="3" stroke-linecap="round"/><circle cx="39" cy="29" r="2" fill="#E7B75A"/><circle cx="44" cy="34" r="2" fill="#D97051"/></svg></header><p class="intro">动动手，也动动脑。选一个小世界，玩一会儿。</p><div class="recent" id="recent"></div><nav class="tabs" aria-label="游戏分类"><button class="ruge-pill" data-cat="all" aria-pressed="true">全部</button><button class="ruge-pill" data-cat="learn" aria-pressed="false">认字学习</button><button class="ruge-pill" data-cat="puzzle" aria-pressed="false">动脑解谜</button><button class="ruge-pill" data-cat="react" aria-pressed="false">轻松挑战</button></nav><div class="section-line"><b id="heading">七个小世界</b><span id="count">7 款游戏</span></div><div class="cards" id="cards"></div><footer><span>离线游玩 · 无广告</span><button id="awake" class="ruge-pill" aria-pressed="true">屏幕常亮 · 开</button></footer><p class="note">游戏里随时暂停，再继续。常亮仅在应用前台生效。</p></main><script>
'use strict';
const games=[
{id:'pipe-flow',cat:'puzzle',name:'接水管',desc:'转一转，让水流到花园。',tag:'10 关 · 撤销与提示'},
{id:'gravity-maze',cat:'puzzle',name:'重力钢珠',desc:'轻轻倾斜，走出木板迷宫。',tag:'10 关 · 倾斜或摇杆'},
{id:'hanzi-puzzle',cat:'learn',name:'汉字拼一拼',desc:'两个部件，变出一个新字。',tag:'12 关 · 点击或拖动'},
{id:'hanzi-typing',cat:'learn',name:'看字打拼音',desc:'看字、听音，打出拼音。',tag:'60 字 · 笔画演示'},
{id:'flappy-bird',cat:'react',name:'扑翼小鸟',desc:'拍翅膀，飞过小镇的水管。',tag:'练习与挑战'},
{id:'dino-runner',cat:'react',name:'小恐龙冲刺',desc:'跳过障碍，奔向下个驿站。',tag:'长短跳 · 里程奖励'},
{id:'frog-pond',cat:'react',name:'小青蛙跳池塘',desc:'跳上金圈荷叶，接住连击。',tag:'二段跳 · 落点挑战'}];
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function bind(){document.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>{let s=read('rugeCenter');const k=a.dataset.id;s[k]={...(s[k]||{}),last:Date.now(),plays:((s[k]||{}).plays||0)+1};localStorage.setItem('rugeCenter',JSON.stringify(s))})}
function render(cat){const list=games.filter(g=>cat==='all'||g.cat===cat);document.querySelector('#cards').innerHTML=list.map(g=>'<a class="card" href="'+g.id+'/index.html" data-id="'+g.id+'"><img class="cover" src="shared/'+g.id+'.png" alt=""><div class="meta"><h2>'+g.name+'</h2><p>'+g.desc+'</p><div class="card-foot"><span>'+g.tag+'</span><span>开始 →</span></div></div></a>').join('');document.querySelector('#count').textContent=list.length+' 款游戏';document.querySelector('#heading').textContent=cat==='all'?'七个小世界':({learn:'一点一点，学会更多',puzzle:'慢慢想，总能找到路',react:'下一次，再进步一点'})[cat];bind()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.dataset.cat)});
const recent=read('rugeCenter');const last=games.filter(g=>recent[g.id]?.last).sort((a,b)=>recent[b.id].last-recent[a.id].last)[0];if(last){const r=document.querySelector('#recent');r.style.display='block';r.innerHTML='<a href="'+last.id+'/index.html" data-id="'+last.id+'"><div><small>接着玩</small><b>'+last.name+'</b></div><span class="arrow">→</span></a>'}
let awake=true;try{awake=window.RugeScreen?RugeScreen.keepAwakeEnabled():localStorage.getItem('rugeAwake')!=='false'}catch(e){}const ab=document.querySelector('#awake');function showAwake(){ab.textContent='屏幕常亮 · '+(awake?'开':'关');ab.setAttribute('aria-pressed',String(awake))}ab.onclick=()=>{awake=!awake;try{window.RugeScreen?.keepAwake(awake);localStorage.setItem('rugeAwake',String(awake))}catch(e){}showAwake()};showAwake();render('all');try{window.RugeScreen?.set('portrait')}catch(e){}
</script></body></html>
