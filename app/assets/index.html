<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <link rel="icon" href="data:,">
  <title>乳鸽游戏中心</title>
  <link rel="stylesheet" href="shared/ui.css">
  <link rel="stylesheet" href="home/style.css">
</head>
<body>
<main id="homeApp">
  <header id="homeHeader">
    <h1 class="ruge-title">乳鸽游戏中心</h1>
    <div class="header-tools" aria-label="游戏设置">
      <button id="soundToggle" class="ruge-pill header-toggle" aria-label="音效开启" aria-pressed="true"></button>
      <button id="vibrationToggle" class="ruge-pill header-toggle" aria-label="震动开启" aria-pressed="true"></button>
      <button id="awake" class="ruge-pill header-toggle" aria-label="屏幕常亮开启" aria-pressed="true"></button>
    </div>
  </header>
  <div class="library">
    <nav id="categories" class="tabs" aria-label="游戏分类">
      <button data-cat="all" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>全部</span></button>
      <button data-cat="recent" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 6M3 4v5h5M12 7v5l3 2"/></svg><span>最近</span></button>
      <button data-cat="learn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM8 8h8M12 8v9M8 12h8"/></svg><span>认字</span></button>
      <button data-cat="puzzle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 1 1 6 0h4v6a3 3 0 1 0 0 6v4h-6a3 3 0 1 0-6 0H4v-6a3 3 0 1 0 0-6Z"/></svg><span>益智</span></button>
      <button data-cat="tilt" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 2 9 16-4-2-9"/><circle cx="11" cy="11" r="3"/><path d="m17 3 3-1 1 3"/></svg><span>重力</span></button>
      <button data-cat="react" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 2-10 12h7l-1 8 10-12h-7Z"/></svg><span>反应</span></button>
    </nav>
    <section id="gameScroll" tabindex="0" aria-label="全部游戏">
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" role="status" hidden>
        <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="29"/><path d="M40 22v18l12 8M23 63l-6 7M57 63l6 7"/></svg>
        <p>还没玩过</p>
      </div>
    </section>
  </div>
</main>
<script src="shared/feedback.js"></script>
<script src="home/index.js"></script>
</body>
</html>
