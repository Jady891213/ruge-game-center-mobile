<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6e8"><link rel="icon" href="data:,"><title>乳鸽游戏中心</title><link rel="stylesheet" href="shared/ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 20px) 15px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-tap-highlight-color:transparent}main{max-width:650px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:26px;line-height:1.2;margin:0;font-weight:850}header>svg{width:53px;height:53px;flex-shrink:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}.tabs button{white-space:nowrap;padding:10px 0;font-size:18px;min-height:51px;font-weight:850;border-radius:19px}.tabs button[aria-pressed=true]{background:#ffdc85;border-color:#e3b65c;box-shadow:0 4px 0 #cfaa53;color:#6e542b}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 13px}.card{text-decoration:none;color:inherit;border:3px solid #c6d7bf;background:#e4eed8;border-radius:25px;overflow:hidden;box-shadow:0 6px 0 #aabfa0;transition:transform .12s;display:flex;flex-direction:column}.card:nth-child(4n+2){background:#ffe2bc;border-color:#e6c49a;box-shadow:0 6px 0 #d3b38d}.card:nth-child(4n+3){background:#e0e2fa;border-color:#c6c9e1;box-shadow:0 6px 0 #adb3d0}.card:nth-child(4n){background:#fad5c9;border-color:#e4bbae;box-shadow:0 6px 0 #d3aa9b}.card:active{transform:translateY(3px);box-shadow:0 3px 0 #d1c5ae}.cover{display:block;width:100%;height:auto;aspect-ratio:5/3;object-fit:contain;background:#fff7e9;border-bottom:2px solid #ffffff90}.meta{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:15px 10px;flex:1}.meta h2{font-size:20px;line-height:1.3;font-weight:850;margin:0}.meta>svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.recent{display:none;margin:0 0 22px}.recent a{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#3b644a;background:#bce8d1;border:2px solid #8dc9a7;border-radius:22px;box-shadow:0 5px 0 #77b694;padding:14px;font-size:20px;font-weight:850}.recent svg{width:24px;height:24px;fill:currentColor;stroke:none}.recent .arrow{font-size:28px;font-weight:500;margin-left:auto}footer{display:flex;justify-content:center;margin-top:30px}footer button{display:flex;align-items:center;justify-content:center;gap:9px;min-width:150px;font-size:17px;padding:9px 13px;color:#7b856d}footer svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}footer button[aria-pressed=true]{background:#ffe8a7;color:#8a6b25;border-color:#e4cb86;box-shadow:0 3px 0 #d4bc7a}@media(min-width:600px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:350px){h1{font-size:23px}header>svg{width:45px;height:45px}.tabs{gap:6px}.tabs button{font-size:17px}.meta{padding:12px 8px}.meta h2{font-size:18px}.meta>svg{width:16px}.cards{gap:16px 10px}.recent a{font-size:18px}}
.feedbackSettings{display:flex;gap:10px;margin:-5px 0 20px}.feedbackSettings button{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;min-height:48px;font-size:17px;padding:9px}.feedbackSettings svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.feedbackSettings [aria-pressed=true]{background:#d7eddb;border-color:#a1ccb0}.feedbackSettings [aria-pressed=false]{color:#8c897f;background:#f4eddf}</style></head><body><main><header><h1 class="ruge-title">乳鸽游戏中心</h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="20" fill="#bce8d1" stroke="#83b79b" stroke-width="3"/><path d="M16 39q-4-17 8-17h16q12 0 8 17q-2 6-9-1H25q-7 7-9 1Z" fill="#fff8e8" stroke="#507460" stroke-width="2.7"/><path d="M26 27v9m-4.5-4.5h9" stroke="#507460" stroke-width="3" stroke-linecap="round"/><circle cx="39" cy="29" r="2.5" fill="#d5a548"/><circle cx="44" cy="34" r="2.5" fill="#d4968b"/><path d="M26 49q6 6 12 0" fill="none" stroke="#507460" stroke-width="2.5" stroke-linecap="round"/></svg></header><div class="feedbackSettings"><button id="soundToggle" class="ruge-pill" aria-label="游戏音效"></button><button id="vibrationToggle" class="ruge-pill" aria-label="震动反馈"></button></div><div class="recent" id="recent"></div><nav class="tabs" aria-label="游戏分类"><button class="ruge-pill" data-cat="all" aria-pressed="true">全部</button><button class="ruge-pill" data-cat="learn" aria-pressed="false">认字</button><button class="ruge-pill" data-cat="puzzle" aria-pressed="false">益智</button><button class="ruge-pill" data-cat="react" aria-pressed="false">挑战</button></nav><div hidden><span id="heading"></span><span id="count"></span></div><div class="cards" id="cards"></div><footer><button id="awake" class="ruge-pill" aria-pressed="true"></button></footer></main><script src="shared/feedback.js"></script><script>
'use strict';
const games=[
{id:'forest-juice',cat:'puzzle',name:'森林果汁屋',desc:'倒一倒，把同色果汁放一起。',tag:'12 关 · 颜色整理'},
{id:'code-breaker',cat:'puzzle',name:'小小密码箱',desc:'猜对数字，再给它们找对位置。',tag:'18 关 · 两位到四位'},
{id:'pipe-flow',cat:'puzzle',name:'接水管',desc:'转一转，让水流到花园。',tag:'10 关 · 撤销与提示'},
{id:'gravity-maze',cat:'puzzle',name:'钢珠迷宫',desc:'转动挡板，滚动钢珠收星星。',tag:'18 关 · 迷宫与机关'},
{id:'number-merge',cat:'puzzle',name:'数字碰碰',desc:'碰一碰，把小数字凑到星星上。',tag:'12 关 · 十以内合并'},
{id:'tilt-star-box',cat:'puzzle',name:'翻转星星盒',desc:'倾斜玩具盒，送星星回家。',tag:'12 关 · 四向翻转'},
{id:'hanzi-puzzle',cat:'learn',name:'字里找字',desc:'从字里找字，还能跨字组合。',tag:'60 关 · 多答案收集'},
{id:'paint-mixing',cat:'puzzle',name:'小小调色师',desc:'一点颜料，调出喜欢的颜色。',tag:'10 关 · 颜料调色'},
{id:'hanzi-typing',cat:'learn',name:'看字打拼音',desc:'看字、听音，打出拼音。',tag:'60 字 · 笔画演示'},
{id:'flappy-bird',cat:'react',name:'扑翼小鸟',desc:'拍翅膀，飞过小镇的水管。',tag:'练习与挑战'},
{id:'dino-runner',cat:'react',name:'小恐龙冲刺',desc:'跳过障碍，奔向下个驿站。',tag:'长短跳 · 里程奖励'},
{id:'frog-pond',cat:'react',name:'小青蛙跳池塘',desc:'跳上金圈荷叶，接住连击。',tag:'二段跳 · 落点挑战'}];
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function bind(){document.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>{let s=read('rugeCenter');const k=a.dataset.id;s[k]={...(s[k]||{}),last:Date.now(),plays:((s[k]||{}).plays||0)+1};localStorage.setItem('rugeCenter',JSON.stringify(s))})}
function render(cat){const list=games.filter(g=>cat==='all'||g.cat===cat);document.querySelector('#cards').innerHTML=list.map(g=>'<a class="card" href="'+g.id+'/index.html" data-id="'+g.id+'"><img class="cover" src="shared/'+g.id+'.png" alt=""><div class="meta"><h2>'+g.name+'</h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></div></a>').join('');document.querySelector('#count').textContent=list.length+' 款游戏';document.querySelector('#heading').textContent=cat==='all'?'十二个小世界':({learn:'一点一点，学会更多',puzzle:'慢慢想，总能找到路',react:'下一次，再进步一点'})[cat];bind()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.dataset.cat)});
const recent=read('rugeCenter');const last=games.filter(g=>recent[g.id]?.last).sort((a,b)=>recent[b.id].last-recent[a.id].last)[0];if(last){const r=document.querySelector('#recent');r.style.display='block';r.innerHTML='<a href="'+last.id+'/index.html" data-id="'+last.id+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><b>'+last.name+'</b><span class="arrow">→</span></a>'}
let awake=true;try{awake=window.RugeScreen?RugeScreen.keepAwakeEnabled():localStorage.getItem('rugeAwake')!=='false'}catch(e){}const ab=document.querySelector('#awake');function showAwake(){ab.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>常亮 '+(awake?'开':'关')+'</span>';ab.setAttribute('aria-label','屏幕常亮'+(awake?'开启':'关闭'));ab.setAttribute('aria-pressed',String(awake))}ab.onclick=()=>{awake=!awake;try{window.RugeScreen?.keepAwake(awake);localStorage.setItem('rugeAwake',String(awake))}catch(e){}showAwake()};showAwake();render('all');
const fxIcons={sound:'<path d="M4 9v6h4l5 4V5L8 9zM17 8a7 7 0 0 1 0 8M20 5a11 11 0 0 1 0 14"/>',vibration:'<rect x="7" y="4" width="10" height="16" rx="3"/><path d="M3 7v10M21 7v10M1 10v4M23 10v4"/>'};
function refreshFeedback(){for(const [id,kind,label] of [['soundToggle','sound','音效'],['vibrationToggle','vibration','震动']]){const b=document.getElementById(id),on=window.RugeFX.enabled(kind);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+fxIcons[kind]+'</svg><span>'+label+' '+(on?'开':'关')+'</span>';b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',label+(on?'开启':'关闭'));}}
document.getElementById('soundToggle').onclick=()=>{const on=window.RugeFX.setSound(!window.RugeFX.enabled('sound'));refreshFeedback();if(on)window.RugeFX.emit('select');};document.getElementById('vibrationToggle').onclick=()=>{const on=window.RugeFX.setVibration(!window.RugeFX.enabled('vibration'));refreshFeedback();if(on)window.RugeFX.emit('select');};window.addEventListener('ruge:feedback-change',refreshFeedback);refreshFeedback();
try{window.RugeScreen?.set('portrait')}catch(e){}
</script></body></html>
