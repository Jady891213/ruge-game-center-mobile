<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e9"><link rel="icon" href="data:,"><title>脑力游乐园</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="identify.css"><link rel="stylesheet" href="memory.css"><link rel="stylesheet" href="analysis.css"><link rel="stylesheet" href="compute.css"><link rel="stylesheet" href="visual.css"><link rel="stylesheet" href="../shared/back-navigation.css"></head><body>
<main id="app"><header><button id="back" class="icon" aria-label="返回上一级">‹</button><h1 id="title">脑力游乐园</h1><button id="pauseButton" class="icon" aria-label="暂停" hidden>Ⅱ</button></header>
<section id="hub"><div class="hub-banner"><span class="hero-star">✦</span><strong>今天，玩哪一个？</strong><span class="hero-symbol symbol" style="background-position:0% 0%" aria-hidden="true"></span></div><div class="hub-body"><nav id="categories" aria-label="游戏分类"></nav><div id="cards" aria-label="20种脑力游戏"></div></div></section>
<section id="detail" hidden><div id="detailArt"></div><h2 id="detailName"></h2><p id="detailRule"></p><div class="record">最高分 <strong id="detailBest">0</strong></div><button id="start" class="primary">开始玩</button><button id="detailBack" class="secondary">选玩法</button></section>
<section id="play" hidden><div class="scorebar"><span class="timer" aria-label="剩余时间">◷ <b id="seconds">60</b></span><span class="score" aria-label="本局得分">★ <b id="score">0</b></span><span class="difficulty" id="difficulty">1级</span></div><div class="time-track"><i id="timeFill"></i></div><div id="stage"></div><div id="reaction" role="status" aria-live="polite"></div></section>
<section id="result" hidden><div class="trophy">★</div><h2>挑战完成</h2><strong id="resultScore"></strong><p id="resultStats"></p><button id="again" class="primary">再玩一次</button><button id="resultBack" class="secondary">选玩法</button></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><span class="pause-art">☁</span><h2>休息一下</h2><button id="resume" class="primary">继续玩</button><button id="pauseMenu" class="secondary">选玩法</button></div></div>
<script src="../shared/feedback.js"></script><script src="core.js"></script><script src="identify.js"></script><script src="memory.js"></script><script src="analysis.js"></script><script src="compute.js"></script><script src="visual.js"></script><script src="app.js"></script><script src="../shared/back-navigation.js"></script></body></html>
