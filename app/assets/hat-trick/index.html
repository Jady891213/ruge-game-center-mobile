<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>帽子小捣蛋</title><link rel="stylesheet" href="../shared/back-navigation.css"></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回上一级"></button><h1>帽子小捣蛋</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="menu"><nav class="modes" aria-label="玩法"><button class="selected" aria-pressed="true">帽子藏藏</button><button id="memoryMode">翻牌对对碰</button></nav><div class="hero"><span class="animal a2"></span><span class="heroHat"><i></i></span><span class="animal a1"></span></div><div id="levels" aria-label="关卡"></div><button id="continue" class="primary wide" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><button id="restart" class="icon" aria-label="重来本关"></button><button id="pauseButton" class="icon" aria-label="暂停"></button></div><div id="mission"><span id="phaseWord">记一记</span><div id="targets" aria-label="要找的小玩具"></div></div><section id="hatStage" aria-label="帽子游戏"></section><div id="progress" aria-hidden="true"></div><footer><button id="replay" class="tool" aria-label="重新观察"></button><button id="hideAnimals" class="primary">藏好啦</button></footer></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="animal a2"></div><h2>休息一下</h2><button id="resume" class="primary wide">继续玩</button><button id="pauseHome" class="secondary wide">回游戏中心</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2>重新开始？</h2><button id="confirmRestart" class="primary wide">重来</button><button id="cancelRestart" class="secondary wide">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><div class="animal a1"></div><div class="stars">★★★</div><button id="next" class="primary wide">下一关</button><button id="winMap" class="secondary wide">选关</button></div></div>
<script src="../shared/feedback.js"></script><script src="core.js"></script><script src="game.js"></script><script src="../shared/back-navigation.js"></script></body></html>
