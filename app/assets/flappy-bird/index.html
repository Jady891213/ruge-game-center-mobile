<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff6e8;color:#35544b;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:none!important}button:focus-visible{outline:4px solid #ffdc85;outline-offset:3px}
#stage{position:fixed;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:40}
#controls{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:7px;pointer-events:auto}
#controls button{width:48px;height:48px;padding:11px;border-radius:18px;background:#fffdf5;border:2px solid #e7dfcc;color:#35544b;box-shadow:0 3px 0 #e8ddc7}
#controls svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#controls button:disabled{opacity:.4}
#scores{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:17px;text-align:right;font-variant-numeric:tabular-nums;color:#35544b}
#score{font-size:43px;font-weight:850;line-height:1.1;text-shadow:0 2px #fff6e8}#hi{display:none}
#mission{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 79px);display:flex;align-items:center;gap:8px;background:#fff9e6e8;border:2px solid #e6d9b9;border-radius:18px;padding:7px 12px;color:#6d7855;font-size:20px;font-weight:850;font-variant-numeric:tabular-nums}
#objective{display:grid;place-items:center}#objective svg{width:25px;height:25px;fill:none;stroke:#739f76;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#cue,#hint,.card .tag,.card .intro,.card .goal-note,.card .sub,.card .result-label{display:none}
.screen{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:76px 20px 25px;background:#fff6e838}.screen.hide{display:none}
.card{width:100%;max-width:370px;max-height:calc(100dvh - 108px);overflow:auto;text-align:center;background:#fff9ed;color:#35544b;border:3px solid #e7dbc0;border-radius:34px;box-shadow:0 7px 0 #e1d5ba99;padding:25px 20px 28px}
.card h1{font-size:29px;font-weight:850;line-height:1.25;margin:0 0 18px;letter-spacing:.2px}.hero{width:100%;height:155px;display:block;margin:0 auto 23px}.hero canvas{border-radius:23px;border:2px solid #eadfc9;display:block;width:100%;height:100%;object-fit:cover}
.card button{width:100%;min-height:64px;border:3px solid #80bc9b;border-radius:23px;padding:12px 10px;font-size:27px;font-weight:850;background:#bce8d1;color:#355a45;box-shadow:0 5px 0 #71ae8c}
.card button.secondary{background:#ffdc85;border-color:#e5bb61;box-shadow:0 5px 0 #d3a951;color:#6a552b}
.card .actions{display:flex;gap:11px;margin-top:18px}.card .actions button{font-size:22px;min-height:58px;padding:10px 4px}
.card .big{font-size:76px;line-height:1.15;font-weight:850;font-variant-numeric:tabular-nums;margin:15px 0 30px;color:#4a8b67}
.card .newhi{display:inline-block;background:#ffdc85;color:#805e22;padding:9px 18px;border:2px solid #edca78;border-radius:17px;font-size:21px;margin-bottom:10px}
#pauseScreen{z-index:35;background:#fff6e8c4;backdrop-filter:blur(4px)}#pauseScreen .card h1{font-size:30px;margin:8px 0 28px}
.result-mascot{display:block;width:70px;height:70px;margin:0 auto;color:#a7c68b}.result-mascot svg{width:100%;height:100%;fill:#ffdc85;stroke:#d2ac61;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
body.night #scores{color:#fff6e8}body.night #score{text-shadow:0 2px #55746b}body.night .screen{background:#55746b28}
@media(max-width:350px){#controls{left:10px;gap:6px}#controls button{width:43px;height:44px;padding:9px;border-radius:15px}#scores{right:12px}#score{font-size:37px}.card{padding:23px 17px 26px}.card h1{font-size:26px}.card .actions button{font-size:20px}.screen{padding-left:16px;padding-right:16px}}
@media(max-height:640px){.hero{height:127px;margin-bottom:20px}.card h1{margin-bottom:16px}.card button{min-height:59px;font-size:25px}.card .actions{margin-top:15px}.card .actions button{min-height:53px}.card .big{font-size:67px;margin:12px 0 23px}.result-mascot{width:57px;height:57px}.screen{padding-top:69px;padding-bottom:20px}.card{max-height:calc(100dvh - 93px);padding-top:21px}}
@media(max-height:480px){.screen{padding:65px 18px 12px}.card{max-height:calc(100dvh - 82px);max-width:440px;padding:17px 22px 23px}.hero{height:80px;margin-bottom:14px}.card h1{font-size:23px;margin-bottom:13px}.card button{min-height:52px;font-size:23px}.card .actions{margin-top:12px}.card .big{font-size:54px}.result-mascot{width:40px;height:40px}#mission{left:160px;top:calc(env(safe-area-inset-top,0px) + 16px);font-size:16px;padding:5px 9px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body class="action-game">
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="controls"><button id="homeBtn" aria-label="返回游戏中心"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7M6 9v12h12V9M10 21v-7h4v7"/></svg></button><button id="pauseBtn" aria-label="暂停游戏"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button id="mute" aria-label="声音开关" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 8q4 4 0 8"/></svg></button></div>
    <div id="scores"><div id="score">0</div><div id="hi">BEST 0</div></div>
    <div id="mission"><span id="objective"></span><b id="progress"></b></div><div id="cue"></div>
    <div id="hint" hidden></div>
  </div>

  <div id="startScreen" class="screen">
    <div class="card">
      <h1>扑翼小鸟</h1>
      <div class="hero" aria-hidden="true"></div>

      <button id="startBtn">开始</button><div class="actions"><button id="practiceBtn" class="secondary">练习</button></div>
    </div>
  </div>

  <div id="overScreen" class="screen hide">
    <div class="card">
      <div id="newhi" class="newhi" style="display:none">新纪录！</div>
      <div class="result-mascot" aria-hidden="true"><svg viewBox="0 0 72 72"><path d="m36 5 9 19 21 3-15 16 4 21-19-10-19 10 4-21L6 27l21-3z"/><path d="M25 35v3m22-3v3m-17 7q6 5 12 0" stroke="#805c36"/></svg></div><div class="result-label" hidden></div><div class="big" id="finalScore">0</div>
      <div class="sub" id="finalSub" hidden></div>
      <button id="againBtn">再玩</button><div class="actions"><button id="overHomeBtn" class="secondary">返回</button></div>
    </div>
  </div>
  <div id="pauseScreen" class="screen hide"><div class="card"><h1>休息一下</h1><button id="resumeBtn">继续</button><div class="actions"><button id="restartBtn" class="secondary">重玩</button><button id="pauseHomeBtn" class="secondary">返回</button></div></div></div>
</div>

<script src="../shared/feedback.js"></script>
<script src="../shared/garden-art.js"></script>
<script>
(function () {
'use strict';
var GAME_ID = 'flappy-bird';
console.log('[flappy] boot');

/* ============================ 基础 ============================ */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha: false });
var elStage = document.getElementById('stage');
var elScore = document.getElementById('score');
var elHi = document.getElementById('hi');
var elMute = document.getElementById('mute');
var elStart = document.getElementById('startScreen');
var elOver = document.getElementById('overScreen');
var elFinal = document.getElementById('finalScore');
var elFinalSub = document.getElementById('finalSub');
var elNewHi = document.getElementById('newhi');
var elHint = document.getElementById('hint');

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ============================ 配色 ============================ */
var DAY = {
  skyTop:'#d6f0e3', skyMid:'#f0f4da', skyBot:'#fff6e8', sun:'#ffdc85',
  far:'#e0eccb', mid:'#bce0c3', cloud:'#fffdf2',
  dirt:'#f3dfb9', grass:'#a6d3ac', grassDark:'#7cb395', dirtDash:'#dec99d',
  pipe:'#74ce66', pipeHi:'#b4f28b', pipeDark:'#42b16e', pipeEdge:'#206d65',
  birdBody:'#ffdc85', birdBelly:'#fff4c5', birdWing:'#f0bc6a', beak:'#f1ad86',
  eye:'#fffdf5', pupil:'#35544b', scarf:'#f9c8ba', gem:'#7bbbab', gemHi:'#f0fff2'
};
var NIGHT = {
  skyTop:'#708f98', skyMid:'#a2bbb5', skyBot:'#d0d9c5', sun:'#fff2c6',
  far:'#8eac9e', mid:'#87ad98', cloud:'#d5e5dc',
  dirt:'#f3dfb9', grass:'#a6d3ac', grassDark:'#7cb395', dirtDash:'#dec99d',
  pipe:'#74ce66', pipeHi:'#b4f28b', pipeDark:'#42b16e', pipeEdge:'#206d65',
  birdBody:'#ffdc85', birdBelly:'#fff4c5', birdWing:'#f0bc6a', beak:'#f1ad86',
  eye:'#fffdf5', pupil:'#35544b', scarf:'#f9c8ba', gem:'#7bbbab', gemHi:'#f0fff2'
};
function hex2rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
var DAYR = {}, NIGHTR = {}, palette = {}, lastMix = -1;
for (var pk in DAY) { DAYR[pk] = hex2rgb(DAY[pk]); NIGHTR[pk] = hex2rgb(NIGHT[pk]); palette[pk] = DAY[pk]; }

var nightMix = 0, nightTarget = 0;
function applyPalette() {
  if (nightMix === lastMix) return;
  lastMix = nightMix;
  var t = nightMix;
  for (var k in DAYR) {
    var a = DAYR[k], b = NIGHTR[k];
    palette[k] = 'rgb(' + Math.round(lerp(a[0],b[0],t)) + ',' +
      Math.round(lerp(a[1],b[1],t)) + ',' + Math.round(lerp(a[2],b[2],t)) + ')';
  }
}

/* ============================ 音效 ============================ */
var muted = window.RugeFX ? !window.RugeFX.enabled('sound') : false;
var recordFeedbackPending = false;
elMute.setAttribute('aria-pressed',String(muted));
if(muted)elMute.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>';
function feedback(name) {
  if (paused || document.hidden || /[?&]cover=1(?:&|$)/.test(location.search)) return;
  if (window.RugeFX) window.RugeFX.emit(name);
}

/* ============================ 布局 ============================ */
var W = 360, H = 640, DPR = 1;
var L = {};
function layout() {
  var r = cv.getBoundingClientRect();
  W = Math.max(220, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  DPR = clamp(window.devicePixelRatio || 1, 1, 3);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var U = clamp(W / 390, 0.78, 1.4);
  L.U = U;
  L.groundBand = Math.max(H * 0.12, 60 * U);
  L.groundY = H - L.groundBand;

  L.birdW = 50 * U;
  L.birdH = 44 * U;
  L.birdX = W * 0.26;
  L.pipeW = 60 * U;
  L.capH = 24 * U;
  L.capOver = 6 * U;

  L.g = 1650 * U;
  L.FLAP = -425 * U;
  L.maxFall = 430 * U;
  L.maxRise = -540 * U;
  // 单次拍翅净升幅 与 连续爬升速率（用于限制相邻管口的落差，避免死局）
  L.flapRise = (L.FLAP * L.FLAP) / (2 * L.g);
  L.climbRate = L.flapRise / (Math.abs(L.FLAP) / L.g);

  L.speed0 = 152 * U;
  L.speedMax = 268 * U;
  L.accel = L.speed0 * 0.028;

  L.marginTop = 34 * U;
  L.marginBot = 26 * U;
  var avail = L.groundY - L.marginTop - L.marginBot;
  L.gap = clamp(L.groundY * 0.228, 140 * U, 215 * U);
  if (L.gap > avail - 30 * U) L.gap = Math.max(88 * U, avail - 30 * U);
  L.gapMin = L.gap / 2 + L.marginTop;
  L.gapMax = Math.max(L.gapMin, L.groundY - L.gap / 2 - L.marginBot);

  L.spacing = W * 0.64;
  L.readyY = L.groundY * 0.42;
  L.span = W * 1.9 + 420;
}
function wrapX(base, par) {
  var x = base - worldX * par;
  x = ((x % L.span) + L.span) % L.span;
  return x - 200;
}

/* ============================ 状态 ============================ */
var state = 'ready';             // ready | run | dead
var paused = false, lastT = 0, clock = 0;
var speed = 0, worldX = 0, distSinceSpawn = 0;
var score = 0, gemsGot = 0, nextNight = 18, passed = 0, goal = 8;
var practice = false, rescues = 3, invincible = 0;
var pipes = [], parts = [], pops = [], clouds = [], hills = [];
var player = null, shake = 0, flash = 0, deadT = 0, newRecord = false;
var best=0;try{best=parseInt(localStorage.getItem('flappyDashBest')||'0',10);}catch(e){}
if (!isFinite(best) || best < 0) best = 0;

/* ============================ 装饰 ============================ */
function buildDecor() {
  clouds = [];
  for (var i = 0; i < 7; i++) {
    clouds.push({ x: rand(0, L.span), y: rand(H * 0.04, H * 0.50), s: rand(0.5, 1.35), p: rand(0.12, 0.30) });
  }
  hills = [];
  for (var j = 0; j < 8; j++) {
    var far = j % 2 === 0;
    hills.push({
      x: rand(0, L.span), p: far ? 0.08 : 0.16,
      w: rand(W * 0.30, W * 0.60), h: rand(H * 0.030, H * 0.070),
      layer: far ? 0 : 1
    });
  }
}

/* ============================ 粒子 ============================ */
function addPuff(ax, ay, n, spd) {
  for (var i = 0; i < n; i++) {
    parts.push({
      x: ax + rand(-4, 4) * L.U, y: ay + rand(-4, 4) * L.U,
      vx: -speed * 0.35 + rand(-70, 10) * L.U,
      vy: rand(-30, 60) * L.U,
      r: rand(1.5, 3.6) * L.U, life: rand(0.22, 0.5), max: 0.5
    });
  }
}
function addPop(ax, ay, txt) {
  pops.push({ x: ax, y: ay, text: txt, life: 0.9, max: 0.9 });
}

/* ============================ 生命周期 ============================ */
function reset() {
  speed = L.speed0 * (practice ? 0.82 : 1);
  worldX = 0; distSinceSpawn = 0;
  score = 0; gemsGot = 0; nextNight = 18; passed = 0; goal = 8; rescues = 3; invincible = 0;
  pipes = []; parts = []; pops = [];
  lastGapY = -1;
  player = { y: L.readyY, vy: 0, rot: 0, flapT: 0 };
  shake = 0; flash = 0; deadT = 0; newRecord = false;
  nightMix = 0; nightTarget = 0; lastMix = -1;
  document.body.classList.remove('night');
  buildDecor();
  applyPalette();
  syncScore();
}

function startGame(isPractice) {
  if (typeof isPractice === 'boolean') practice = isPractice;
  reset();
  recordFeedbackPending = false;
  paused = false; lastT = 0;
  elPause.classList.add('hide');
  state = 'run';
  reportStat(0, false);
  player.vy = L.FLAP * 0.7;
  elStart.classList.add('hide');
  elOver.classList.add('hide');
  elHint.classList.add('show');
  setTimeout(function () { elHint.classList.remove('show'); }, 2400);
  console.log('[flappy] start');
}

function showOver() {
  elFinal.textContent = String(score);
  elFinalSub.textContent = '';
  document.querySelector('#overScreen .result-label').textContent = '';
  elNewHi.style.display = newRecord ? 'inline-block' : 'none';
  elOver.classList.remove('hide');
  if (recordFeedbackPending) feedback('win');
  recordFeedbackPending = false;
}

function die() {
  if (state !== 'run' || paused || invincible > 0) return;
  if (practice && rescues > 0) {
    feedback('error');
    rescues--; invincible = 1.35; player.y = L.readyY; player.vy = L.FLAP * 0.55;
    pipes = pipes.filter(function(p){return p.x > L.birdX + L.birdW + 60;});
    addPop(L.birdX + L.birdW / 2, player.y - 42, '♥ ' + rescues);
    syncScore(); return;
  }
  state = 'dead';
  deadT = 0; shake = 1; flash = 0.42;
  player.vy = L.FLAP * 0.55;
  if (!practice && score > best) { best = score; newRecord = true; try { localStorage.setItem('flappyDashBest', String(best)); } catch (e) {} }
  reportStat(score, !practice);
  recordFeedbackPending = newRecord;
  feedback('error');
  addPuff(L.birdX + L.birdW * 0.5, player.y, 14, 1);
  setTimeout(function () { if (state === 'dead') showOver(); }, 700);
}

/* ============================ 输入 ============================ */
function flap() {
  if (state !== 'run' || paused) return;
  player.vy = L.FLAP;
  player.flapT = 0.15;
  feedback('jump');
  addPuff(L.birdX + L.birdW * 0.20, player.y + L.birdH * 0.18, 4);
}

elStage.addEventListener('pointerdown', function (e) {
  if (e.target && e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  if (paused) return;
  if (state === 'ready') return;
  flap();
}, { passive: false });
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (state === 'ready') return;
    else flap();
  }
  if (e.code === 'Enter' && state === 'dead') startGame();
});

document.getElementById('startBtn').addEventListener('click', function (e) { e.stopPropagation(); startGame(false); });
document.getElementById('practiceBtn').addEventListener('click',function(e){e.stopPropagation();startGame(true);});
document.getElementById('againBtn').addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
elMute.addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  elMute.setAttribute('aria-pressed', String(muted));
  elMute.innerHTML = muted ? '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 8q4 4 0 8"/></svg>';
  if (window.RugeFX) window.RugeFX.setSound(!muted);
});

document.addEventListener('visibilitychange', function () {
  if (document.hidden) recordFeedbackPending = false;
  if (document.hidden && state === 'run') setPaused(true);
  lastT = 0;
});

var elPause = document.getElementById('pauseScreen');
function setPaused(value) {
  if (state !== 'run' && !paused) return;
  paused = !!value; lastT = 0;
  elPause.classList.toggle('hide', !paused);
}
function goHome() {
  try { if (window.RugeNav && window.RugeNav.home) { window.RugeNav.home(); return; } } catch(e) {}
  location.href = '../index.html';
}
document.getElementById('homeBtn').addEventListener('click', function(e){e.stopPropagation();if(state==='run')setPaused(true);goHome();});
document.getElementById('pauseBtn').addEventListener('click', function(e){e.stopPropagation();if(state==='run') setPaused(!paused);});
document.getElementById('resumeBtn').addEventListener('click',function(){setPaused(false);});
document.getElementById('restartBtn').addEventListener('click',function(){startGame();});
document.getElementById('pauseHomeBtn').addEventListener('click',goHome);
document.getElementById('overHomeBtn').addEventListener('click',goHome);
window.addEventListener('ruge:pause',function(){recordFeedbackPending=false;if(state==='run')setPaused(true);lastT=0;});
window.addEventListener('ruge:resume',function(){lastT=0;});
window.addEventListener('keydown',function(e){if(e.code==='Escape'&&state==='run'){e.preventDefault();setPaused(!paused);}});
function reportStat(value, record) {
  if (/[?&]cover=1(?:&|$)/.test(location.search)) return;
  try { var all=JSON.parse(localStorage.getItem('rugeStat')||'{}');var s=all[GAME_ID]||{};s.last=Date.now();if(record)s.best=Math.max(Number(s.best)||0,value);all[GAME_ID]=s;localStorage.setItem('rugeStat',JSON.stringify(all)); } catch(e){}
}

function relayout() {
  var oldW=W,oldGround=L.groundY,oldU=L.U,oldSpeed=L.speed0;
  if(state==='run')setPaused(true);
  layout();
  if(player){player.y*=L.groundY/oldGround;player.vy*=L.U/oldU;}
  pipes.forEach(function(p){p.x*=W/oldW;p.gapY=clamp(p.gapY*L.groundY/oldGround,L.gapMin,L.gapMax);});
  speed*=L.speed0/oldSpeed;distSinceSpawn*=W/oldW;
  buildDecor();lastT=0;render();
}
window.addEventListener('resize',relayout);
window.addEventListener('ruge:orientation',function(){setTimeout(relayout,80);});

/* ============================ UI ============================ */
var lastShown = -1;
function syncScore() {
  if (score !== lastShown) { lastShown = score; elScore.textContent = String(score); }
  elHi.textContent = practice ? '练习 · 不计纪录' : '最高 ' + Math.max(best, score);
  document.getElementById('objective').innerHTML='<svg viewBox="0 0 24 24" aria-label="水管目标"><path d="M7 3h10v5H7zM9 8v13h6V8"/></svg>';
  document.getElementById('progress').textContent = passed + ' / ' + goal + (practice ? ' · ♥ ' + rescues : '');
}

/* ============================ 水管 ============================ */
var lastGapY = -1;
function spawnPipe() {
  var gy = passed < 3 ? L.readyY + passed * 18 * L.U : rand(L.gapMin, L.gapMax);
  if (lastGapY >= 0) {
    // 落差上限 = 两根管之间小鸟「来得及」爬升的高度（随速度收紧），否则会出现无解死局
    var timeGap = L.spacing / Math.max(1, speed);
    var step = clamp(L.climbRate * timeGap * 0.5, 46 * L.U, L.gapMax - L.gapMin);
    gy = clamp(gy, lastGapY - step, lastGapY + step);
  }
  gy = clamp(gy, L.gapMin, L.gapMax);
  lastGapY = gy;

  var gemOff = 0;
  if (passed > 1 && Math.random() < 0.42) gemOff = Math.random() < 0.5 ? -0.58 : 0.58;

  pipes.push({ x: W + 24, gapY: gy, scored: false, gemOff: gemOff, gemGot: false });
  distSinceSpawn = 0;
}

function pipeBoxes(p) {
  var inset = 2 * L.U, half = L.gap / 2, top = p.gapY - half, bottom = p.gapY + half;
  // 柱身和管口分别判断；外沿和画面一致，仍留 2px 轮廓容差。
  return [
    {x:p.x+inset,y:-20,w:L.pipeW-inset*2,h:Math.max(0,top-L.capH+20)},
    {x:p.x-L.capOver+inset,y:top-L.capH+inset,w:L.pipeW+L.capOver*2-inset*2,h:L.capH-inset*2},
    {x:p.x-L.capOver+inset,y:bottom+inset,w:L.pipeW+L.capOver*2-inset*2,h:L.capH-inset*2},
    {x:p.x+inset,y:bottom+L.capH,w:L.pipeW-inset*2,h:Math.max(0,L.groundY-bottom-L.capH)}
  ];
}
function birdBox() {
  var bw = L.birdW, bh = L.birdH;
  return { x: L.birdX + bw * 0.5 - bw * 0.30, y: player.y - bh * 0.30, w: bw * 0.60, h: bh * 0.60 };
}
function hitRect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, r, b) {
  var nx = clamp(cx, b.x, b.x + b.w);
  var ny = clamp(cy, b.y, b.y + b.h);
  var dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

/* ============================ 更新 ============================ */
function updateParts(dt) {
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) {
    p = parts[i];
    p.x += (p.vx - speed * 0.30) * dt;
    p.y += p.vy * dt;
    p.vy += 220 * L.U * dt;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = pops.length - 1; i >= 0; i--) {
    p = pops[i];
    p.x -= speed * dt;
    p.y -= 46 * dt;
    p.life -= dt;
    if (p.life <= 0) pops.splice(i, 1);
  }
}

function update(dt) {
  clock += dt;
  nightMix += (nightTarget - nightMix) * Math.min(1, dt * 1.5);
  if (nightMix < 0.004) nightMix = 0;
  if (nightMix > 0.996) nightMix = 1;
  applyPalette();

  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);

  if (state === 'ready') {
    worldX += 46 * dt;
    player.y = L.readyY + Math.sin(clock * 3.1) * 9 * L.U;
    player.rot = Math.sin(clock * 3.1) * 0.12;
    if (player.flapT > 0) player.flapT -= dt;
    updateParts(dt);
    return;
  }

  if (state === 'dead') {
    deadT += dt;
    player.vy = Math.min(L.maxFall * 1.5, player.vy + L.g * 1.35 * dt);
    player.y += player.vy * dt;
    player.rot = Math.min(1.75, player.rot + dt * 3.4);
    if (player.y + L.birdH * 0.5 > L.groundY) {
      player.y = L.groundY - L.birdH * 0.5;
      player.vy = 0;
    }
    if (player.flapT > 0) player.flapT -= dt;
    updateParts(dt);
    return;
  }

  /* ---- running ---- */
  if (invincible > 0) invincible = Math.max(0, invincible - dt);
  speed = Math.min(L.speedMax * (practice ? 0.86 : 1), speed + L.accel * dt * (practice ? 0.6 : 1));
  var move = speed * dt;
  worldX += move;
  distSinceSpawn += move;

  // 小鸟
  player.vy = clamp(player.vy + L.g * dt, L.maxRise, L.maxFall);
  player.y += player.vy * dt;
  if (player.y - L.birdH * 0.5 < 0) {
    player.y = L.birdH * 0.5;
    if (player.vy < 0) player.vy = 0;
  }
  var tr = clamp(player.vy / L.maxFall, -1, 1);
  player.rot = lerp(player.rot, tr < 0 ? tr * 0.52 : tr * 1.15, Math.min(1, dt * 11));
  if (player.flapT > 0) player.flapT -= dt;

  // 生成
  if (distSinceSpawn >= L.spacing) spawnPipe();

  // 水管
  var i, j, p, boxes;
  for (i = 0; i < pipes.length; i++) pipes[i].x -= move;
  for (i = pipes.length - 1; i >= 0; i--) {
    if (pipes[i].x + L.pipeW + L.capOver < -40) pipes.splice(i, 1);
  }

  // 碰撞 + 计分
  var pb = birdBox();
  for (i = 0; i < pipes.length; i++) {
    p = pipes[i];
    boxes = pipeBoxes(p);
    for (j = 0; j < boxes.length; j++) {
      if (hitRect(pb, boxes[j])) { die(); return; }
    }
    if (!p.scored && p.x + L.pipeW < L.birdX + L.birdW * 0.5) {
      p.scored = true;
      score++; passed++;
      if (passed >= goal) {addPop(L.birdX + L.birdW / 2, player.y - 40, '★');goal += 8;feedback('success');}
      else feedback('collect');
      if (score % 10 === 0) flash = Math.max(flash, 0.14);
      if (passed >= nextNight) {
        nextNight += 18;
        nightTarget = nightTarget ? 0 : 1;
        document.body.classList.toggle('night', nightTarget === 1);
      }
      syncScore();
    }
    // 宝石
    if (p.gemOff !== 0 && !p.gemGot) {
      var gx = p.x + L.pipeW * 0.5;
      var gy = p.gapY + p.gemOff * (L.gap / 2);
      if (circleRect(gx, gy, 12 * L.U, pb)) {
        p.gemGot = true;
        gemsGot++;
        score += 3;
        feedback('collect');
        addPop(gx, gy, '+3');
        syncScore();
      }
    }
  }

  // 掉地上
  if (player.y + L.birdH * 0.5 >= L.groundY) {
    player.y = L.groundY - L.birdH * 0.5;
    die();
    return;
  }

  updateParts(dt);
}

/* ============================ 绘制 ============================ */
function drawSky() {
  if(window.RugeGardenArt && window.RugeGardenArt.background(ctx,"meadow",W,H,worldX,L.groundY,L.U)) return;
  var g = ctx.createLinearGradient(0, 0, 0, L.groundY);
  g.addColorStop(0, palette.skyTop);
  g.addColorStop(0.58, palette.skyMid);
  g.addColorStop(1, palette.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, L.groundY + 2);

  var sx = W * 0.78, sy = H * 0.13, sr = Math.min(W, H) * 0.070;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = palette.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#997c43';
  ctx.beginPath();ctx.arc(sx-sr*.25,sy-sr*.08,sr*.065,0,Math.PI*2);ctx.arc(sx+sr*.25,sy-sr*.08,sr*.065,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#997c43';ctx.lineWidth=Math.max(1.5,sr*.055);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(sx,sy+sr*.02,sr*.24,.25,Math.PI-.25);ctx.stroke();
}

function drawHills() {
  if(window.RugeGardenArt && window.RugeGardenArt.available("meadow")) return;
  for (var i = 0; i < hills.length; i++) {
    var h = hills[i];
    var x = wrapX(h.x, h.p);
    if (x < -h.w || x > W + h.w) continue;
    ctx.fillStyle = h.layer === 0 ? palette.far : palette.mid;
    ctx.beginPath();
    ctx.moveTo(x - h.w / 2, L.groundY + 1);
    ctx.bezierCurveTo(x - h.w * 0.40, L.groundY - h.h, x - h.w * 0.05, L.groundY - h.h * 1.4, x + h.w * 0.16, L.groundY - h.h * 0.82);
    ctx.lineTo(x + h.w / 2, L.groundY + 1);
    ctx.closePath();
    ctx.fill();
  }
}

function drawClouds() {
  if(window.RugeGardenArt && window.RugeGardenArt.available("meadow")) return;
  ctx.fillStyle = palette.cloud;
  ctx.globalAlpha = 0.9;
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var x = wrapX(c.x, c.p), y = c.y, s = c.s * L.U * 34;
    if (x < -s * 2 || x > W + s * 2) continue;
    ctx.beginPath();
    ctx.arc(x, y, s * 0.52, 0, 6.2832);
    ctx.arc(x + s * 0.60, y + s * 0.10, s * 0.40, 0, 6.2832);
    ctx.arc(x - s * 0.58, y + s * 0.14, s * 0.34, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVillage() {
  if(window.RugeGardenArt && window.RugeGardenArt.available("meadow")) return;
  var step=172*L.U, off=(worldX*.22)%step;
  for(var x=-off-step;x<W+step;x+=step){
    var y=L.groundY-58*L.U;
    ctx.fillStyle=nightMix>.5?'#a7b9a7':'#cfdfba';
    ctx.fillRect(x+30*L.U,y,34*L.U,58*L.U);
    ctx.beginPath();ctx.moveTo(x+24*L.U,y);ctx.lineTo(x+47*L.U,y-24*L.U);ctx.lineTo(x+70*L.U,y);ctx.fill();
    ctx.fillStyle=nightMix>.5?'#e7b75a':'#fbf7ef';
    ctx.fillRect(x+43*L.U,y+12*L.U,9*L.U,13*L.U);
  }
}
function drawGround() {
  if(window.RugeGardenArt && window.RugeGardenArt.available("meadow")) return;
  var gy = L.groundY;
  ctx.fillStyle = palette.dirt;
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = palette.grass;
  ctx.fillRect(0, gy, W, 13 * L.U);
  ctx.fillStyle = palette.grassDark;
  ctx.fillRect(0, gy + 13 * L.U, W, 4 * L.U);

  ctx.fillStyle = palette.dirtDash;
  var step = 72 * L.U, off = worldX % step;
  for (var x = -off; x < W + step; x += step) {
    ctx.fillRect(x, gy + 32 * L.U, 24 * L.U, 3 * L.U);
    ctx.fillRect(x + 40 * L.U, gy + 50 * L.U, 14 * L.U, 2.5 * L.U);
  }
}

function drawPipe(p) {
  var w = L.pipeW, half = L.gap / 2;
  var topEnd = p.gapY - half;
  var botStart = p.gapY + half;
  var capH = L.capH, over = L.capOver;
  var lw = Math.max(2, 2.4 * L.U);

  // ---- 上管 ----
  if (topEnd > 0) {
    pipeColumn(p.x, 0, w, topEnd - capH, lw);
    pipeCap(p.x - over, topEnd - capH, w + over * 2, capH, lw);
  }
  // ---- 下管 ----
  var bh = L.groundY - botStart;
  if (bh > 0) {
    pipeCap(p.x - over, botStart, w + over * 2, capH, lw);
    pipeColumn(p.x, botStart + capH, w, Math.max(0, bh - capH), lw);
  }

  // ---- 宝石 ----
  if (p.gemOff !== 0 && !p.gemGot) {
    var gx = p.x + w * 0.5;
    var gy = p.gapY + p.gemOff * half;
    var r = 12 * L.U * (1 + Math.sin(clock * 5 + p.x * 0.02) * 0.07);
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = palette.gemHi;
    ctx.beginPath(); ctx.arc(gx, gy, r * 2.1, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = palette.gem;
    ctx.beginPath();
    ctx.moveTo(gx, gy - r * 1.30);
    ctx.lineTo(gx + r, gy - r * 0.14);
    ctx.lineTo(gx, gy + r * 1.30);
    ctx.lineTo(gx - r, gy - r * 0.14);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = palette.gemHi;
    ctx.beginPath();
    ctx.moveTo(gx, gy - r * 1.30);
    ctx.lineTo(gx - r, gy - r * 0.14);
    ctx.lineTo(gx, gy + r * 0.18);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function pipeColumn(x, y, w, h, lw) {
  if (h <= 0) return;
  ctx.fillStyle = palette.pipe;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = palette.pipeHi;
  ctx.fillRect(x + w * 0.12, y, w * 0.17, h);
  ctx.fillStyle = palette.pipeDark;
  ctx.fillRect(x + w * 0.78, y, w * 0.22, h);
  ctx.strokeStyle = palette.pipeEdge;
  ctx.lineWidth = lw;
  ctx.strokeRect(x + lw * 0.5, y, w - lw, h + lw);
}

function pipeCap(x, y, w, h, lw) {
  var r=Math.min(7*L.U,h*.25);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  ctx.fillStyle=palette.pipe;ctx.fill();ctx.strokeStyle=palette.pipeEdge;ctx.lineWidth=lw;ctx.stroke();
  ctx.fillStyle=palette.pipeHi;ctx.fillRect(x+w*.15,y+lw*2,w*.12,h-lw*4);

}

function drawBird() {
  var bw=L.birdW,bh=L.birdH;
  ctx.save();ctx.globalAlpha=invincible>0&&Math.floor(invincible*9)%2?.5:1;
  ctx.translate(L.birdX+bw*.5,player.y);ctx.rotate(player.rot);
  var art=window.RugeGardenArt;
  if(!art||!art.sprite(ctx,player.flapT>0?'birdUp':'birdDown',-bw*.55,-bh*.55,bw*1.18,bh*1.12)){
    ctx.fillStyle='#ffd254';ctx.beginPath();ctx.ellipse(0,0,bw*.45,bh*.44,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawParts() {
  var i, p;
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.round(15 * L.U + 6) + 'px system-ui,-apple-system,sans-serif';
  for (i = 0; i < pops.length; i++) {
    p = pops[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = palette.gem;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10 * L.U, rand(-1, 1) * shake * 8 * L.U);
  drawSky();
  drawHills();
  drawClouds();
  drawVillage();
  drawGround();
  var i;
  for (i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
  drawParts();
  drawBird();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* 封面和入口直接调用本页实际角色/场景 renderer，避免另一套 SVG 角色漂移。 */
function drawPreview(target,width,height,pixelRatio) {
  width=width||600;height=height||360;pixelRatio=pixelRatio||1;
  var old={ctx:ctx,W:W,H:H,L:L,player:player,state:state,worldX:worldX,palette:palette,clouds:clouds,hills:hills,clock:clock,invincible:invincible};
  try {
    target.width=Math.round(width*pixelRatio);target.height=Math.round(height*pixelRatio);
    ctx=target.getContext('2d',{alpha:false});ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    W=width;H=height;L=Object.assign({},old.L);state='ready';worldX=0;palette=Object.assign({},DAY);
    var unit=width/600;
    L.U=2.05*unit;L.birdW=50*L.U;L.birdH=44*L.U;L.birdX=width*.25;
    L.groundY=height*.83;L.pipeW=60*L.U;L.capH=24*L.U;L.capOver=6*L.U;L.gap=height*.48;L.span=width*1.9+420;
    player={y:height*.48,vy:0,rot:-.08,flapT:.1};clock=.8;invincible=0;
    clouds=[{x:width*.30+200,y:height*.19,s:.82,p:.2},{x:width*.58+200,y:height*.11,s:.58,p:.2}];
    hills=[{x:width*.20+200,p:.08,w:width*.7,h:height*.13,layer:0},{x:width*.62+200,p:.16,w:width*.8,h:height*.095,layer:1}];
    drawSky();drawHills();drawClouds();drawVillage();drawGround();
    drawPipe({x:width*.74,gapY:height*.46,gemOff:.46,gemGot:false});drawBird();
  } finally { ctx=old.ctx;W=old.W;H=old.H;L=old.L;player=old.player;state=old.state;worldX=old.worldX;palette=old.palette;clouds=old.clouds;hills=old.hills;clock=old.clock;invincible=old.invincible; }
  return target;
}
window.__actionPreview={draw:drawPreview,export:function(width,height){var target=document.createElement('canvas');drawPreview(target,width||1200,height||720,1);return target.toDataURL('image/png');}};
function showPreview() {
  var cover=/[?&]cover=1(?:&|$)/.test(location.search),target=document.createElement('canvas');
  if(cover){
    var wm=/[?&]w=(\d+)/.exec(location.search),hm=/[?&]h=(\d+)/.exec(location.search);
    var pw=wm?Math.min(2048,Math.max(100,Number(wm[1]))):600,ph=hm?Math.min(1536,Math.max(100,Number(hm[1]))):360;
    drawPreview(target,pw,ph,window.devicePixelRatio||1);
    document.body.innerHTML='';document.body.appendChild(target);
    target.style.cssText='position:fixed;left:0;top:0;width:'+pw+'px;height:'+ph+'px;display:block';
    document.title='action-cover-ready';return true;
  }
  drawPreview(target,320,180,Math.min(3,window.devicePixelRatio||1));var hero=document.querySelector('.hero');hero.innerHTML='';hero.appendChild(target);return false;
}

/* ============================ 主循环 ============================ */
function frame(t) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (!lastT) lastT = t;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt <= 0) return;
  if (dt > 1 / 30) dt = 1 / 30;
  update(dt);
  render();
}

/* ============================ 启动 ============================ */
layout();
reset();
state = 'ready';
reportStat(best, true);
elHi.textContent = 'BEST ' + best;
if(!showPreview())requestAnimationFrame(frame);
if(window.RugeGardenArt)window.RugeGardenArt.whenReady(function(){showPreview();if(!/[?&]cover=1(?:&|$)/.test(location.search))render();});
console.log('[flappy] ready, ' + W + 'x' + H + ' DPR=' + DPR + ' groundY=' + Math.round(L.groundY) + ' gap=' + Math.round(L.gap));

})();
</script>
