<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff6e8"><link rel="icon" href="data:,"><title>字里找字</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/back-navigation.css"></head><body>
<header><button id="home" class="icon" aria-label="返回上一级"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><button id="levelBtn">第 <b id="levelNum">1</b> 关 <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button id="reset" class="icon" aria-label="重来这一关"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 7M5 3v6h6"/></svg></button></header>
<main><section class="answer-area" aria-label="已找到的汉字"><div class="progress"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span id="count">0 / 3</span></div><div id="answers"></div></section>
<div id="feedback" role="status" aria-live="polite"></div>
<div id="boardWrap"><div class="board" id="boards"><svg id="strokeBoard" viewBox="0 0 1024 1024" aria-label="点选汉字笔画" role="group"><path class="guide" d="M512 0V1024M0 512H1024M0 0L1024 1024M1024 0L0 1024"/><g id="strokes" transform="translate(0,900) scale(1,-1)"></g></svg></div><button id="hint" class="hint" aria-label="提示笔画"><svg viewBox="0 0 24 24"><path d="M9 19h6M10 22h4M8.3 14.5a6 6 0 1 1 7.4 0c-1 .8-1.7 1.8-1.7 3.5h-4c0-1.7-.7-2.7-1.7-3.5ZM12 1v2M2 10h2M20 10h2"/></svg></button></div>
<div class="actions"><button id="clear"><svg viewBox="0 0 24 24"><path d="m8 5-6 7 6 7h12V5ZM10 9l6 6M16 9l-6 6"/></svg>清空</button><button id="submit">提交 <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button><button id="next" hidden>下一关 <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div></main>
<dialog id="levelDialog"><div class="dialog-head"><h2>字里找字</h2><button id="closeLevels" class="icon" aria-label="关闭选关">×</button></div><div id="levelGrid"></div></dialog>
<dialog id="resetDialog"><h2>重新找这一关？</h2><div class="dialog-actions"><button id="cancelReset">取消</button><button id="confirmReset">重来</button></div></dialog>
<div id="pausePanel" hidden><div class="pause-card"><svg class="pause-mark" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><button id="resume">继续</button><button id="pauseHome">回首页</button></div></div>
<script src="strokes.js"></script><script src="levels-extra.js"></script><script src="../shared/feedback.js"></script><script src="core.js"></script><script src="composites.js"></script><script src="answer-catalog.js"></script><script src="board-geometry.js"></script><script src="game.js"></script><script src="../shared/back-navigation.js"></script></body></html>
