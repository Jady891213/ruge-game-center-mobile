<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff5e7"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>小熊点心店</title></head><body>
<main id="app"><header><button id="home" class="icon" aria-label="返回游戏中心"></button><h1>小熊点心店</h1><button id="map" class="icon" aria-label="选择关卡"></button></header>
<section id="menu"><div class="shopScene" role="img" aria-label="小熊的森林点心店"></div><button id="continue" class="primary" hidden>继续玩</button><div id="levels" aria-label="关卡"></div></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><div id="orders" aria-label="订单进度"></div><button id="restart" class="icon" aria-label="重新开始本关"></button></div>
<section class="orderCard"><div id="customer" role="img"></div><div class="ticket"><div class="ticketHead"><b>点单</b><span id="rule"></span></div><div id="target" aria-label="客人的订单"></div></div></section>
<section class="serving"><div class="trayLabel"><span>摆盘</span><span id="message" role="status" aria-live="polite"></span></div><div id="plate" aria-label="我的点心盘"></div></section>
<div id="palette" aria-label="点心柜"></div><div class="actions"><button id="undo" class="icon" aria-label="撤回一个点心"></button><button id="serve" class="primary">送出</button><button id="next" class="primary" hidden>下一位</button><button id="pauseButton" class="icon" aria-label="暂停"></button></div>
</section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><div class="customerArt" aria-hidden="true"></div><h2>歇一歇</h2><button id="resume" class="primary">继续</button><button id="pauseHome" class="secondary">回首页</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2>重新开始？</h2><button id="confirmRestart" class="primary">重新开始</button><button id="cancelRestart" class="secondary">继续玩</button></div></div>
<script src="core.js"></script><script src="game.js"></script></body></html>
