<head>

<title>小青蛙跳池塘 · Frog Pond</title>
<link rel="stylesheet" href="../shared/ui.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff6e8;color:#35544b;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:none!important}button:focus-visible{outline:4px solid #ffdc85;outline-offset:3px}
#stage{position:fixed;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:40}
#controls{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:7px;pointer-events:auto}
#controls button{width:48px;height:48px;padding:11px;border-radius:18px;background:#fffdf5;border:2px solid #e7dfcc;color:#35544b;box-shadow:0 3px 0 #e8ddc7}
#controls svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#controls button:disabled{opacity:.4}
#scores{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:17px;text-align:right;font-variant-numeric:tabular-nums;color:#35544b}
#score{font-size:43px;font-weight:850;line-height:1.1;text-shadow:0 2px #fff6e8}#hi{display:none}
#mission{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 79px);display:flex;align-items:center;gap:8px;background:#fff9e6e8;border:2px solid #e6d9b9;border-radius:18px;padding:7px 12px;color:#6d7855;font-size:20px;font-weight:850;font-variant-numeric:tabular-nums}
#objective{display:grid;place-items:center}#objective svg{width:25px;height:25px;fill:none;stroke:#739f76;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#cue,#hint,.card .tag,.card .intro,.card .goal-note,.card .sub,.card .result-label{display:none}
.screen{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:76px 20px 25px;background:#fff6e838}.screen.hide{display:none}
.card{width:100%;max-width:370px;max-height:calc(100dvh - 108px);overflow:auto;text-align:center;background:#fff9ed;color:#35544b;border:3px solid #e7dbc0;border-radius:34px;box-shadow:0 7px 0 #e1d5ba99;padding:25px 20px 28px}
.card h1{font-size:29px;font-weight:850;line-height:1.25;margin:0 0 18px;letter-spacing:.2px}.hero{width:100%;height:155px;display:block;margin:0 auto 23px}.hero canvas{border-radius:23px;border:2px solid #eadfc9;display:block;width:100%;height:100%;object-fit:cover}
.card button{width:100%;min-height:64px;border:3px solid #80bc9b;border-radius:23px;padding:12px 10px;font-size:27px;font-weight:850;background:#bce8d1;color:#355a45;box-shadow:0 5px 0 #71ae8c}
.card button.secondary{background:#ffdc85;border-color:#e5bb61;box-shadow:0 5px 0 #d3a951;color:#6a552b}
.card .actions{display:flex;gap:11px;margin-top:18px}.card .actions button{font-size:22px;min-height:58px;padding:10px 4px}
.card .big{font-size:76px;line-height:1.15;font-weight:850;font-variant-numeric:tabular-nums;margin:15px 0 30px;color:#4a8b67}
.card .newhi{display:inline-block;background:#ffdc85;color:#805e22;padding:9px 18px;border:2px solid #edca78;border-radius:17px;font-size:21px;margin-bottom:10px}
#pauseScreen{z-index:35;background:#fff6e8c4;backdrop-filter:blur(4px)}#pauseScreen .card h1{font-size:30px;margin:8px 0 28px}
.result-mascot{display:block;width:70px;height:70px;margin:0 auto;color:#a7c68b}.result-mascot svg{width:100%;height:100%;fill:#ffdc85;stroke:#d2ac61;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
body.night #scores{color:#fff6e8}body.night #score{text-shadow:0 2px #55746b}body.night .screen{background:#55746b28}
@media(max-width:350px){#controls{left:10px;gap:6px}#controls button{width:43px;height:44px;padding:9px;border-radius:15px}#scores{right:12px}#score{font-size:37px}.card{padding:23px 17px 26px}.card h1{font-size:26px}.card .actions button{font-size:20px}.screen{padding-left:16px;padding-right:16px}}
@media(max-height:640px){.hero{height:127px;margin-bottom:20px}.card h1{margin-bottom:16px}.card button{min-height:59px;font-size:25px}.card .actions{margin-top:15px}.card .actions button{min-height:53px}.card .big{font-size:67px;margin:12px 0 23px}.result-mascot{width:57px;height:57px}.screen{padding-top:69px;padding-bottom:20px}.card{max-height:calc(100dvh - 93px);padding-top:21px}}
@media(max-height:480px){.screen{padding:65px 18px 12px}.card{max-height:calc(100dvh - 82px);max-width:440px;padding:17px 22px 23px}.hero{height:80px;margin-bottom:14px}.card h1{font-size:23px;margin-bottom:13px}.card button{min-height:52px;font-size:23px}.card .actions{margin-top:12px}.card .big{font-size:54px}.result-mascot{width:40px;height:40px}#mission{left:160px;top:calc(env(safe-area-inset-top,0px) + 16px);font-size:16px;padding:5px 9px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body class="action-game">
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="controls"><button id="homeBtn" aria-label="返回游戏中心"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7M6 9v12h12V9M10 21v-7h4v7"/></svg></button><button id="pauseBtn" aria-label="暂停游戏"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button id="mute" aria-label="声音开关" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 8q4 4 0 8"/></svg></button></div>
    <div id="scores"><div id="score">0</div><div id="hi">HI 0</div></div>
    <div id="mission"><span id="objective"></span><b id="progress"></b></div><div id="cue"></div>
    <div id="hint" hidden></div>
  </div>

  <div id="startScreen" class="screen">
    <div class="card">
      <h1>小青蛙跳池塘</h1>
      <div class="hero" aria-hidden="true"></div>

      <button id="startBtn">开始</button>
    </div>
  </div>

  <div id="overScreen" class="screen hide">
    <div class="card">
      <div id="newhi" class="newhi" style="display:none">新纪录！</div>
      <div class="result-mascot" aria-hidden="true"><svg viewBox="0 0 72 72"><path d="m36 5 9 19 21 3-15 16 4 21-19-10-19 10 4-21L6 27l21-3z"/><path d="M25 35v3m22-3v3m-17 7q6 5 12 0" stroke="#805c36"/></svg></div><div class="result-label" hidden></div><div class="big" id="finalScore">0</div>
      <div class="sub" id="finalSub" hidden></div>
      <button id="againBtn">再玩</button><div class="actions"><button id="overHomeBtn" class="secondary">返回</button></div>
    </div>
  </div>
  <div id="pauseScreen" class="screen hide"><div class="card"><h1>休息一下</h1><button id="resumeBtn">继续</button><div class="actions"><button id="restartBtn" class="secondary">重玩</button><button id="pauseHomeBtn" class="secondary">返回</button></div></div></div>
</div>

<script>
(function () {
'use strict';
var GAME_ID = 'frog-pond';

/* ============================ 基础工具 ============================ */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha: false });
var elStage = document.getElementById('stage');
var elScore = document.getElementById('score');
var elHi = document.getElementById('hi');
var elMute = document.getElementById('mute');
var elStart = document.getElementById('startScreen');
var elOver = document.getElementById('overScreen');
var elFinal = document.getElementById('finalScore');
var elFinalSub = document.getElementById('finalSub');
var elNewHi = document.getElementById('newhi');
var elHint = document.getElementById('hint');

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ============================ 配色（昼/夜插值） ============================ */
var DAY = {
  skyTop:'#d2eee1', skyMid:'#eef3d4', skyBot:'#fff6e8', sun:'#ffdc85',
  far:'#d8e8bb', mid:'#b3d4aa',
  ground:'#b3dfd7', groundDeep:'#8dc6bb', gline:'#edfae1', dash:'#d3ece1',
  lily:'#bce8a9', lilyDark:'#71a176',
  body:'#bce8d1', bodyDark:'#77ad89', belly:'#fff3bc',
  eye:'#fffdf5', pupil:'#35544b',
  cactus:'#f9c8ba', cactusDark:'#b78372',
  bird:'#84beaf', birdWing:'#e4f3de',
  gem:'#ffdc85', gemHi:'#fff5c2',
  ripple:'#86bdb2', submerge:'rgba(179,223,215,0.55)', submergeHi:'rgba(237,250,225,0.78)',
  rock:'#b9b9ab', rockHi:'#e1dfcb',
  gemBonus:'#f9c8ba', gemBonusHi:'#fff1da',
  scarf:'#f9c8ba', cloud:'#fffdf5'
};
var NIGHT = {
  skyTop:'#708f98', skyMid:'#a2bbb5', skyBot:'#d0d9c5', sun:'#fff2c6',
  far:'#8eac9e', mid:'#87ad98',
  ground:'#b3dfd7', groundDeep:'#8dc6bb', gline:'#edfae1', dash:'#d3ece1',
  lily:'#bce8a9', lilyDark:'#71a176',
  body:'#bce8d1', bodyDark:'#77ad89', belly:'#fff3bc',
  eye:'#fffdf5', pupil:'#35544b',
  cactus:'#f9c8ba', cactusDark:'#b78372',
  bird:'#84beaf', birdWing:'#e4f3de',
  gem:'#ffdc85', gemHi:'#fff5c2',
  ripple:'#86bdb2', submerge:'rgba(70,160,190,0.55)', submergeHi:'rgba(150,220,240,0.70)',
  rock:'#b9b9ab', rockHi:'#e1dfcb',
  gemBonus:'#f9c8ba', gemBonusHi:'#fff1da',
  scarf:'#f9c8ba', cloud:'#d5e5dc'
};
function hex2rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
var DAYR = {}, NIGHTR = {}, palette = {}, lastMix = -1;
// 只有 '#rrggbb' 形式的键才能插值；rgba(...) 之类的原样保留
// （否则 hex2rgb('rgba..') → parseInt('rg',16) = NaN → palette 变 'rgb(NaN,NaN,NaN)'
//   → canvas 赋非法 fillStyle 会**静默忽略**，用上一个颜色画出错的东西）
for (var pk in DAY) {
  if (DAY[pk].charAt(0) === '#' && NIGHT[pk] && NIGHT[pk].charAt(0) === '#') {
    DAYR[pk] = hex2rgb(DAY[pk]); NIGHTR[pk] = hex2rgb(NIGHT[pk]);
  }
  palette[pk] = DAY[pk];
}

var nightMix = 0, nightTarget = 0;
function applyPalette() {
  if (Math.abs(nightMix - lastMix) < 0.002 && (nightMix === 0 || nightMix === 1)) return;
  lastMix = nightMix;
  var t = nightMix;
  for (var k in DAY) {
    if (DAYR[k]) {
      var a = DAYR[k], b = NIGHTR[k];
      palette[k] = 'rgb(' + Math.round(lerp(a[0],b[0],t)) + ',' +
        Math.round(lerp(a[1],b[1],t)) + ',' + Math.round(lerp(a[2],b[2],t)) + ')';
    } else {
      palette[k] = (t > 0.5 && NIGHT[k]) ? NIGHT[k] : DAY[k];   // rgba 之类直接切
    }
  }
}

/* ============================ 音效 ============================ */
var AC = null, muted = false;
try{muted=localStorage.getItem('rugeMuted')==='true';}catch(e){}
elMute.setAttribute('aria-pressed',String(muted));
if(muted)elMute.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>';
function audioCtx() {
  if (AC === null) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = false; }
  }
  if (AC && AC.state === 'suspended') { AC.resume().catch(function () {}); }
  return AC || null;
}
function blip(f1, f2, dur, type, vol) {
  if (muted) return;
  var ac = audioCtx();
  if (!ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

/* ============================ 布局常量 ============================ */
var W = 360, H = 640, DPR = 1;
var L = {};
function layout() {
  var r = cv.getBoundingClientRect();
  W = Math.max(220, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  DPR = clamp(window.devicePixelRatio || 1, 1, 3);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var pH = clamp(H * 0.072, 32, 72);
  L.playerH = pH;
  L.playerW = pH * 1.18;
  L.S = pH / 58;
  L.groundY = H - Math.max(H * 0.23, 78);
  L.G = 4448 * L.S;               // 重力 px/s²
  L.JUMP_UP = 1223 * L.S;         // 起跳初速 px/s（向上）
  L.airtime = 2 * L.JUMP_UP / L.G; // ≈0.55s
  // 降难度：起速慢一点、上限低一点、加速更缓
  L.baseSpeed = W * 0.60;
  L.maxSpeed = L.baseSpeed * 1.50;
  L.accel = L.baseSpeed * 0.022;
  L.playerX = W * 0.17;
  L.span = W * 1.9 + 420;
}
function wrapX(base, par) {
  var x = base - worldX * par;
  x = ((x % L.span) + L.span) % L.span;
  return x - 200;
}

/* ============================ 状态 ============================ */
var state = 'ready';            // ready | run | dead
var paused = false, lastT = 0;
var speed = 0, worldX = 0, distSinceSpawn = 0, nextGap = 0;
var scoreF = 0, gemsGot = 0, prevBand = 0, nextNight = 700;
var pads=[],padTravel=0,padHits=0,padCombo=0,bestCombo=0,goal=3,spawnCount=0,deathCause='';
var obstacles = [], gems = [], parts = [], pops = [], clouds = [], hills = [];
var player = null, shake = 0, flash = 0, deadT = 0, newRecord = false;
var hi=0;try{hi=parseInt(localStorage.getItem('frogPondHi')||'0',10);}catch(e){}
if (!isFinite(hi) || hi < 0) hi = 0;

/* ============================ 场景装饰 ============================ */
function buildDecor() {
  clouds = [];
  for (var i = 0; i < 6; i++) {
    clouds.push({ x: rand(0, L.span), y: rand(H * 0.06, H * 0.40), s: rand(0.55, 1.3), p: rand(0.16, 0.30) });
  }
  hills = [];
  for (var j = 0; j < 8; j++) {
    var far = j % 2 === 0;
    hills.push({
      x: rand(0, L.span), p: far ? 0.10 : 0.20,
      w: rand(W * 0.26, W * 0.52), h: rand(H * 0.028, H * 0.072),
      layer: far ? 0 : 1
    });
  }
}

/* ============================ 粒子 / 飘字 ============================ */
function addDust(ax, ay, n, power) {
  for (var i = 0; i < n; i++) {
    parts.push({
      x: ax + rand(-6, 6) * L.S, y: ay + rand(-4, 2) * L.S,
      vx: -speed * rand(0.15, 0.45) + rand(-40, 40),
      vy: -rand(30, 130) * L.S,
      r: rand(1.4, 3.4) * L.S, life: rand(0.25, 0.55), max: 0.55
    });
  }
}
/* ---- 水波 / 尾迹 ---------------------------------------------------- */
var ripples = [], rippleAcc = 0;
function spawnRipple(x, y, r0, rmax, grow, alpha) {
  ripples.push({ x: x, y: y, r: r0, rmax: rmax, grow: grow, life: 1, a: alpha === undefined ? 1 : alpha });
}
/** 青蛙下水/上岸/蹬水时溅起一圈水花 */
function splashWater(x, y, n) {
  for (var i = 0; i < n; i++) {
    spawnRipple(x + rand(-9, 9) * L.S, y + rand(0, 7) * L.S,
                L.playerH * rand(0.10, 0.20), L.playerH * rand(0.55, 1.05),
                L.playerH * rand(0.9, 1.7), 0.9);
  }
}
function updateRipples(dt) {
  for (var i = ripples.length - 1; i >= 0; i--) {
    var r = ripples[i];
    r.r += r.grow * dt;
    r.x -= speed * dt * 0.62;          // 比地面慢 → 看起来是留在身后的尾迹
    r.life -= dt * 1.05;
    if (r.life <= 0 || r.r >= r.rmax) ripples.splice(i, 1);
  }
}
function drawRipples() {
  ctx.save();
  ctx.lineWidth = Math.max(1.6, 2.6 * L.S);
  for (var i = 0; i < ripples.length; i++) {
    var r = ripples[i];
    var t = clamp(r.r / r.rmax, 0, 1);
    ctx.globalAlpha = (1 - t) * (1 - t) * r.life * r.a;   // 越扩越淡
    ctx.strokeStyle = palette.ripple || palette.gline;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * 0.34, 0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function addPop(ax, ay, text) {
  pops.push({ x: ax, y: ay, text: text, life: 0.85, max: 0.85 });
}

/* ============================ 生命周期 ============================ */
function reset() {
  speed = L.baseSpeed;
  worldX = 0; distSinceSpawn = 0; nextGap = W * 1.0;
  scoreF = 0; gemsGot = 0; prevBand = 0; nextNight = 700;
  pads=[{x:W*.78,r:L.playerW*.66,hit:false}];padTravel=0;padHits=0;padCombo=0;bestCombo=0;goal=3;spawnCount=0;deathCause='';
  obstacles = []; gems = []; parts = []; pops = [];
  player = { yOff: 0, vy: 0, onGround: true, runPhase: 0, blink: 0, blinkT: rand(1.5, 4), jumps: 0, spinT: 0, bobPhase: 0 };
  shake = 0; flash = 0; deadT = 0; newRecord = false;
  nightMix = 0; nightTarget = 0; lastMix = -1;
  document.body.classList.remove('night');
  buildDecor();
  applyPalette();
  syncScore();
}

function startGame() {
  reset();
  paused = false; lastT = 0;
  elPause.classList.add('hide');
  state = 'run';
  reportStat(0, false);
  elStart.classList.add('hide');
  elOver.classList.add('hide');
  elHint.classList.add('show');
  setTimeout(function () { elHint.classList.remove('show'); }, 2600);
  audioCtx();
}

function showOver() {
  elFinal.textContent = String(Math.floor(scoreF));
  elFinalSub.textContent = '';
  document.querySelector('#overScreen .result-label').textContent = '';
  elNewHi.style.display = newRecord ? 'inline-block' : 'none';
  elOver.classList.remove('hide');
}

function die() {
  if (state === 'dead') return;
  state = 'dead';
  deadT = 0; shake = 1; flash = 0.42;
  var s = Math.floor(scoreF);
  if (s > hi) { hi = s; newRecord = true; try { localStorage.setItem('frogPondHi', String(hi)); } catch (e) {} }
  reportStat(s,true);
  blip(340, 55, 0.42, 'sawtooth', 0.085);
  var cxp = L.playerX + L.playerW * 0.5;
  addDust(cxp, L.groundY, 16);
  setTimeout(function () { if (state === 'dead') showOver(); }, 640);
}

/* ============================ 输入 ============================ */
function pressJump() {
  if (state !== 'run' || paused) return;
  if (player.onGround) {
    player.vy = L.JUMP_UP;
    if (player.yOff <= 0) player.yOff = 0.6;
    player.onGround = false;
    player.jumps = 1;
    player.spinT = 0;
    blip(520, 780, 0.07, 'square', 0.042);
    addDust(L.playerX + L.playerW * 0.5, L.groundY, 5);
    splashWater(L.playerX + L.playerW * 0.5, L.groundY, 5);      // 蹬水花
  } else if (player.jumps < 2) {
    // 二段跳：空中再蹬一下，窜一截 + 翻跟头
    player.vy = L.JUMP_UP * 0.88;
    player.jumps = 2;
    player.spinT = 0;
    blip(700, 1010, 0.08, 'square', 0.040);
    addDust(L.playerX + L.playerW * 0.5, L.groundY - player.yOff + L.playerH, 7);
  }
}
function releaseJump() {}

elStage.addEventListener('pointerdown', function (e) {
  if (e.target && e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  if (paused) return;
  audioCtx();
  if (state === 'ready') return;
  if (state === 'run') pressJump();
}, { passive: false });
elStage.addEventListener('pointerup', function (e) {
  if (e.target && e.target.closest && e.target.closest('button')) return;
  releaseJump();
});
elStage.addEventListener('pointercancel', releaseJump);
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    audioCtx();
    if (state === 'ready') return;
    else if (state === 'run') pressJump();
  }
  if (e.code === 'Enter' && state === 'dead') startGame();
});
window.addEventListener('keyup', function (e) {

/* ============================ 生成物 ============================ */
function spawnObstacle() {
  var pH = L.playerH;
  var jumpDist = speed * L.airtime;
  var r = spawnCount < 3 ? 0.2 : Math.random();
  spawnCount++;
  var o;

  // 单跳最高能到 2.90·pH（脚底），所以 h > 2.9·pH 的障碍**必须二段跳**。
  // 二段跳最高 5.14·pH —— 高障碍取 3.05·pH，留出近 2·pH 的余量，不难。
  if (r < 0.42) {
    o = { kind: 'cactus', n: 1, w: pH * 0.42, h: pH * 0.82, base: 0 };
  } else if (r < 0.62) {
    o = { kind: 'cactus', n: 1, w: pH * 0.56, h: pH * 1.22, base: 0 };
  } else if (r < 0.76) {
    var n = Math.random() < 0.20 ? 3 : 2;          // 三连更少见（原来 45%）
    o = { kind: 'cactus', n: n, w: pH * 0.44 * n, h: pH * 0.82, base: 0 };
  } else if (r < 0.86) {
    o = { kind: 'bird', w: pH * 0.80, h: pH * 0.56, base: pH * 0.38, mul: 1.0, flap: rand(0, 6) };
  } else if (r < 0.94) {
    o = { kind: 'bird', w: pH * 0.80, h: pH * 0.56, base: pH * 1.28, mul: 1.0, flap: rand(0, 6) };
  } else {
    // ★ 高石头：单跳过不去，必须二段跳
    o = { kind: 'tall', w: pH * 0.72, h: pH * 3.45, base: 0 };
  }

  o.x = W + 24;
  o.passed = false;
  obstacles.push(o);

  // 降难度：间隙整体放大 —— 单跳够用之外还留余量
  var gap = jumpDist * 1.20 + pH * 2.4 + Math.random() * W * 0.72;
  if (o.kind === 'bird' && o.base > pH) gap += jumpDist * 0.85;
  if (o.kind === 'tall') gap += jumpDist * 1.30;      // 高障碍后留更长的助跑距离
  nextGap = gap;
  distSinceSpawn = 0;

  // 普通宝石：挂一颗在间隙中段，补一个跳就够
  if (o.kind !== 'tall' && Math.random() < 0.55) {
    gems.push({
      x: o.x + gap * 0.52,
      yOff: pH * rand(1.15, 2.05),
      r: pH * 0.22,
      ph: rand(0, 6.28), got: false
    });
  }
  // ★ 高空紫水晶：单跳最高只够到 4.08·pH，所以这个**只有二段跳能吃到**
  if (Math.random() < 0.34) {
    gems.push({
      x: o.x + gap * rand(0.42, 0.62),
      yOff: pH * rand(4.35, 5.30),
      r: pH * 0.30,
      ph: rand(0, 6.28), got: false, bonus: true
    });
  }
}

/* ============================ 碰撞 ============================ */
function playerBox() {
  var pw = L.playerW, ph = L.playerH;
  return {
    x: L.playerX + pw * 0.17,
    y: L.groundY - ph - player.yOff + ph * 0.12,
    w: pw * 0.68,
    h: ph * 0.78
  };
}
function obsBox(o) {
  if(o.kind==='bird')return{x:o.x+o.w*.12,y:L.groundY-o.base-o.h*.65,w:o.w*.80,h:o.h*.32};
  // 内缩取「高度 10%」和「玩家身高 9%」的**较小值**。
  // 原来只按高度 10% 算：仙人掌没事，但 3.05·pH 的高石头会被缩掉 0.61·pH，
  // 判定高度只剩 2.44·pH —— 单跳就能过，「必须二段跳」的设计直接失效。
  var pad = Math.min(o.h * 0.10, L.playerH * 0.09);
  return {
    x: o.x + o.w * 0.09,
    y: L.groundY - o.base - o.h + pad,
    w: o.w * 0.82,
    h: o.h - pad * 2
  };
}
function hitRect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, r, b) {
  var nx = clamp(cx, b.x, b.x + b.w);
  var ny = clamp(cy, b.y, b.y + b.h);
  var dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

/* ============================ 更新 ============================ */
function updateParts(dt) {
  updateRipples(dt);
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) {
    p = parts[i];
    p.x += (p.vx - speed * 0.35) * dt;
    p.y += p.vy * dt;
    p.vy += 950 * L.S * dt;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = pops.length - 1; i >= 0; i--) {
    p = pops[i];
    p.x -= speed * dt;
    p.y -= 46 * dt;
    p.life -= dt;
    if (p.life <= 0) pops.splice(i, 1);
  }
}

function update(dt) {
  // 昼夜插值
  nightMix += (nightTarget - nightMix) * Math.min(1, dt * 1.5);
  if (nightMix < 0.004) nightMix = 0;
  if (nightMix > 0.996) nightMix = 1;
  applyPalette();

  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);

  if (state === 'ready') {
    worldX += 62 * dt;
    player.runPhase += dt * 7.5;
    blinkTick(dt);
    updateParts(dt);
    return;
  }

  if (state === 'dead') {
    deadT += dt;
    updateParts(dt);
    return;
  }

  /* ---- running ---- */
  speed = Math.min(L.maxSpeed, speed + L.accel * dt);
  var move = speed * dt;
  worldX += move;
  distSinceSpawn += move;

  scoreF += move * 0.10;
  var band = Math.floor(scoreF / 100);
  if (band > prevBand) {
    prevBand = band;
    flash = Math.max(flash, 0.14);
    blip(660, 1000, 0.09, 'square', 0.045);
  }
  if (scoreF >= nextNight) {
    nextNight += 700;
    nightTarget = nightTarget ? 0 : 1;
    document.body.classList.toggle('night', nightTarget === 1);
    blip(nightTarget ? 420 : 720, nightTarget ? 300 : 980, 0.22, 'sine', 0.05);
  }

  padTravel+=move;
  if(padTravel>Math.max(W*.68,speed*L.airtime*1.7)){pads.push({x:W+60,r:L.playerW*.66,hit:false});padTravel=0;}
  for(i=0;i<pads.length;i++)pads[i].x-=move;
  pads=pads.filter(function(p){return p.x+p.r>-30;});

  // 玩家物理
  if (player.onGround) {
    player.runPhase += dt * (7 + (speed / L.baseSpeed) * 7);
    player.bobPhase += dt * (3.4 + (speed / L.baseSpeed) * 2.6);   // 水里的上下浮动
    // 尾迹：每隔一小段就蹬出一圈水波
    rippleAcc += dt;
    if (rippleAcc > 0.14) {
      rippleAcc = 0;
      spawnRipple(L.playerX + L.playerW * 0.5 + rand(-4, 16) * L.S, L.groundY + rand(2, 9) * L.S,
                  L.playerH * 0.14, L.playerH * rand(0.62, 0.92), L.playerH * 0.85, 0.72);
    }
    blinkTick(dt);
  } else {
    player.yOff += player.vy * dt;
    player.spinT += dt * 2.4;      // 二段跳翻滚推进
    player.vy -= L.G * dt;
    if (player.yOff <= 0) {
      player.yOff = 0; player.vy = 0; player.onGround = true; player.jumps = 0; player.spinT = 0;
      landOnPad();
      splashWater(L.playerX + L.playerW * 0.5, L.groundY, 7);     // 落水花
      addDust(L.playerX + L.playerW * 0.5, L.groundY, 7);
    }
  }

  // 生成
  if (distSinceSpawn >= nextGap) spawnObstacle();

  // 障碍前进
  var i, o;
  for (i = 0; i < obstacles.length; i++) {
    o = obstacles[i];
    o.x -= move * (o.mul || 1);
    if (o.kind === 'bird') o.flap += dt * 9;
  }
  for (i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].x + obstacles[i].w < -90) obstacles.splice(i, 1);
  }

  // 宝石前进
  for (i = 0; i < gems.length; i++) { gems[i].x -= move; gems[i].ph += dt * 4; }
  for (i = gems.length - 1; i >= 0; i--) {
    if (gems[i].got || gems[i].x < -70) gems.splice(i, 1);
  }

  var nearest=obstacles.find(function(o){return o.x+o.w>L.playerX;});
  // 碰撞
  var pb = playerBox();
  for (i = 0; i < obstacles.length; i++) {
    var ob=obstacles[i];
    if (hitRect(pb, obsBox(ob))) {deathCause=ob.kind==='tall'?'高石头需要在空中再蹬一下。':ob.kind==='bird'&&ob.base>L.playerH?'遇到高蜻蜓，留在水面更安全。':'小鱼和低蜻蜓，轻点即可跃过。';die(); return;}
  }

  // 吃宝石
  for (i = gems.length - 1; i >= 0; i--) {
    var g = gems[i];
    var gy = L.groundY - g.yOff + Math.sin(g.ph) * L.playerH * 0.10;
    if (circleRect(g.x, gy, g.r, pb)) {
      g.got = true;
      gemsGot++;
      var val = g.bonus ? 50 : 25;
      scoreF += val;
      blip(900, 1400, 0.09, 'triangle', 0.05);
      addPop(g.x, gy, '+' + val);
    }
  }

  updateParts(dt);
  syncScore();
}

function landOnPad() {
  var cx=L.playerX+L.playerW/2, pad=null;
  for(var i=0;i<pads.length;i++)if(!pads[i].hit&&Math.abs(pads[i].x-cx)<=pads[i].r*.82){pad=pads[i];break;}
  if(!pad){padCombo=0;return;}
  pad.hit=true;padHits++;padCombo=Math.min(5,padCombo+1);bestCombo=Math.max(bestCombo,padCombo);
  var bonus=15*padCombo;scoreF+=bonus;
  addPop(cx,L.groundY-L.playerH*1.6,'+'+bonus);
  blip(680+padCombo*90,1080+padCombo*90,.10,'triangle',.045);
  if(padHits>=goal)goal+=3;
}
function drawTargetPads() {
  for(var i=0;i<pads.length;i++){
    var p=pads[i],cy=L.groundY+4*L.S;
    ctx.save();ctx.shadowColor='rgba(20,65,67,.2)';ctx.shadowBlur=7*L.S;ctx.shadowOffsetY=5*L.S;drawLily(p.x,cy,p.r);ctx.restore();
    ctx.strokeStyle=p.hit?'#eef8da':'#cfa247';ctx.lineWidth=2.5*L.S;ctx.beginPath();ctx.ellipse(p.x,cy,p.r*.68,p.r*.19,0,0,Math.PI*2);ctx.stroke();
    if(!p.hit){ctx.fillStyle='#f9edc4';ctx.beginPath();ctx.arc(p.x,cy,3*L.S,0,Math.PI*2);ctx.fill();}
  }
}
function drawReeds() {
  var step=150*L.S,off=(worldX*.24)%step;
  for(var x=-off-step;x<W+step;x+=step){
    ctx.strokeStyle=nightMix>.5?'#345b4e':'#7a9b6f';ctx.lineWidth=2.5*L.S;ctx.lineCap='round';
    for(var k=0;k<3;k++){var rx=x+k*8*L.S;ctx.beginPath();ctx.moveTo(rx,L.groundY);ctx.quadraticCurveTo(rx-8*L.S,L.groundY-38*L.S,rx-2*L.S,L.groundY-(48+k*9)*L.S);ctx.stroke();}
    ctx.fillStyle=nightMix>.5?'#6e7561':'#a28656';rr(x+11*L.S,L.groundY-71*L.S,6*L.S,20*L.S,3*L.S);
  }
}
function blinkTick(dt) {
  player.blinkT -= dt;
  if (player.blinkT <= 0) { player.blinkT = rand(2.4, 6); player.blink = 0.11; }
  if (player.blink > 0) player.blink -= dt;
}

/* ============================ 绘制 ============================ */
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function drawSky() {
  var g = ctx.createLinearGradient(0, 0, 0, L.groundY);
  g.addColorStop(0, palette.skyTop);
  g.addColorStop(0.55, palette.skyMid);
  g.addColorStop(1, palette.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, L.groundY + 2);

  var sx = W * 0.76, sy = H * 0.15, sr = Math.min(W, H) * 0.072;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = palette.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#997c43';
  ctx.beginPath();ctx.arc(sx-sr*.25,sy-sr*.08,sr*.065,0,Math.PI*2);ctx.arc(sx+sr*.25,sy-sr*.08,sr*.065,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#997c43';ctx.lineWidth=Math.max(1.5,sr*.055);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(sx,sy+sr*.02,sr*.24,.25,Math.PI-.25);ctx.stroke();
}

function drawHills() {
  for (var i = 0; i < hills.length; i++) {
    var h = hills[i];
    var x = wrapX(h.x, h.p);
    if (x < -h.w || x > W + h.w) continue;
    ctx.fillStyle = h.layer === 0 ? palette.far : palette.mid;
    ctx.beginPath();
    ctx.moveTo(x - h.w / 2, L.groundY + 1);
    ctx.bezierCurveTo(x-h.w*.36,L.groundY-h.h*1.2,x+h.w*.24,L.groundY-h.h*1.1,x+h.w/2,L.groundY+1);
    ctx.closePath();
    ctx.fill();
  }
}

function drawClouds() {
  ctx.fillStyle = palette.cloud;
  ctx.globalAlpha = 0.88;
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var x = wrapX(c.x, c.p), y = c.y, s = c.s * L.playerH * 0.62;
    if (x < -s * 2 || x > W + s * 2) continue;
    ctx.beginPath();
    ctx.arc(x, y, s * 0.52, 0, 6.2832);
    ctx.arc(x + s * 0.60, y + s * 0.10, s * 0.40, 0, 6.2832);
    ctx.arc(x - s * 0.58, y + s * 0.14, s * 0.34, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLily(cx, cy, r) {
  ctx.fillStyle = palette.lily;
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r * 0.40, 0, 0.34, 6.2832 - 0.34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = palette.lilyDark;
  ctx.globalAlpha = 0.40;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.05, r * 0.66, r * 0.24, 0, 0.42, 6.2832 - 0.42);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawGround() {
  var g = ctx.createLinearGradient(0, L.groundY, 0, H);
  g.addColorStop(0, palette.gline);
  g.addColorStop(0.18, palette.ground);
  g.addColorStop(1, palette.groundDeep);
  ctx.fillStyle = g;
  ctx.fillRect(0, L.groundY, W, H - L.groundY);

  // 荷叶漂在水面上，跟着世界滚
  var step = 132, off = worldX % step;
  for (var x = -off - step; x < W + step; x += step) {
    drawLily(x + step * 0.28, L.groundY + 26 * L.S, 30 * L.S);
    drawLily(x + step * 0.74, L.groundY + 52 * L.S, 21 * L.S);
  }

  ctx.fillStyle=nightMix>.5?'#ad8074':'#dba68e';
  for(var fx=-off+34;fx<W+step;fx+=step*2){var fy=L.groundY+58*L.S;for(var petal=0;petal<5;petal++){ctx.beginPath();ctx.ellipse(fx+(petal-2)*3*L.S,fy,4*L.S,9*L.S,(petal-2)*.35,0,Math.PI*2);ctx.fill();}}
  // 水面高光线
  ctx.fillStyle = palette.gline;
  ctx.fillRect(0, L.groundY, W, Math.max(2.5, 3 * L.S));

  // 波纹
  ctx.strokeStyle = palette.dash;
  ctx.lineWidth = Math.max(1.6, 2.2 * L.S);
  var ws = 104, wo = worldX % ws;
  for (var wx = -wo; wx < W + ws; wx += ws) {
    ctx.beginPath();
    ctx.arc(wx + 26, L.groundY + 84 * L.S, 19 * L.S, 0.18, Math.PI - 0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(wx + 74, L.groundY + 118 * L.S, 13 * L.S, 0.18, Math.PI - 0.18);
    ctx.stroke();
  }
}

function drawCactus(o) {                     // 其实画的是「跃出水面的鱼」
  var n = o.n || 1;
  var cw = o.w / n;
  for (var i = 0; i < n; i++) {
    var cx = o.x + i * cw + cw * 0.5;
    var w = cw * 0.96, h = o.h;
    var cy = L.groundY - h * 0.52;
    // 水花
    ctx.fillStyle = palette.gline;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.ellipse(cx, L.groundY + h * 0.04, w * 0.62, h * 0.10, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
    // 尾鳍
    ctx.fillStyle = palette.cactusDark;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.34, cy + h * 0.04);
    ctx.lineTo(cx - w * 0.60, cy - h * 0.34);
    ctx.lineTo(cx - w * 0.60, cy + h * 0.40);
    ctx.closePath(); ctx.fill();
    // 身体
    ctx.fillStyle = palette.cactus;
    ctx.beginPath();
    ctx.ellipse(cx, cy, w * 0.40, h * 0.40, 0, 0, 6.2832);
    ctx.fill();ctx.strokeStyle=palette.cactusDark;ctx.lineWidth=1.5*L.S;ctx.stroke();
    // 背鳍
    ctx.fillStyle = palette.cactusDark;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.10, cy - h * 0.34);
    ctx.lineTo(cx + w * 0.06, cy - h * 0.66);
    ctx.lineTo(cx + w * 0.22, cy - h * 0.30);
    ctx.closePath(); ctx.fill();
    // 眼
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx + w * 0.20, cy - h * 0.10, w * 0.11, 0, 6.2832); ctx.fill();
    ctx.fillStyle = palette.pupil;
    ctx.beginPath(); ctx.arc(cx + w * 0.23, cy - h * 0.10, w * 0.055, 0, 6.2832); ctx.fill();
  }
}

function drawBird(o) {                       // 其实画的是「蜻蜓」
  var x = o.x + o.w * 0.5;
  var y = L.groundY - o.base - o.h * 0.5;
  var w = o.w, h = o.h;
  var flap = Math.sin(o.flap * 3.4) * 0.5 + 0.5;
  // 两对翅膀
  ctx.fillStyle = palette.birdWing || palette.bird;
  ctx.globalAlpha = 0.62;
  for (var sgn = -1; sgn <= 1; sgn += 2) {
    for (var k = 0; k < 2; k++) {
      ctx.save();
      ctx.translate(x - w * 0.04 + k * w * 0.10, y - h * 0.06);
      ctx.rotate(sgn * (0.30 + flap * 0.30));
      ctx.beginPath();
      ctx.ellipse(sgn * w * 0.30, 0, w * 0.34, h * 0.13, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  // 身体
  ctx.fillStyle = palette.bird;
  rr(x - w * 0.30, y - h * 0.11, w * 0.62, h * 0.22, h * 0.11);
  // 头
  ctx.beginPath(); ctx.arc(x + w * 0.34, y, h * 0.17, 0, 6.2832); ctx.fill();
  // 眼
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x + w * 0.38, y - h * 0.03, h * 0.075, 0, 6.2832); ctx.fill();
  ctx.fillStyle = palette.pupil;
  ctx.beginPath(); ctx.arc(x + w * 0.40, y - h * 0.03, h * 0.038, 0, 6.2832); ctx.fill();
}

function drawTall(o) {                        // 高高的大石头 —— 单跳过不去，要二段跳
  var x = o.x + o.w * 0.5;
  var y = L.groundY - o.h;
  var w = o.w, h = o.h;

  ctx.fillStyle = palette.rock;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.50, L.groundY + 1);
  ctx.quadraticCurveTo(x - w * 0.64, y + h * 0.34, x - w * 0.30, y + h * 0.11);
  ctx.quadraticCurveTo(x + w * 0.02, y - h * 0.05, x + w * 0.31, y + h * 0.13);
  ctx.quadraticCurveTo(x + w * 0.63, y + h * 0.36, x + w * 0.50, L.groundY + 1);
  ctx.closePath(); ctx.fill();

  // 受光面
  ctx.fillStyle = palette.rockHi;
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.30, L.groundY + 1);
  ctx.quadraticCurveTo(x - w * 0.34, y + h * 0.34, x - w * 0.10, y + h * 0.14);
  ctx.quadraticCurveTo(x - w * 0.02, y + h * 0.42, x - w * 0.06, L.groundY + 1);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // 顶上一撮芦苇，强调「很高」
  ctx.strokeStyle = palette.lilyDark;
  ctx.lineWidth = Math.max(1.6, 2.4 * L.S);
  ctx.lineCap = 'round';
  for (var i = -1; i <= 1; i++) {
    var rx = x + i * w * 0.22;
    var top = y + h * 0.12;
    var rh = h * (0.13 + 0.045 * (i + 1));
    ctx.beginPath();
    ctx.moveTo(rx, top);
    ctx.quadraticCurveTo(rx + i * w * 0.10, top - rh * 0.62, rx + i * w * 0.16, top - rh);
    ctx.stroke();
  }
}

function drawGem(g) {
  var x = g.x;
  var y = L.groundY - g.yOff + Math.sin(g.ph) * L.playerH * 0.10;
  var r = g.r * (1 + Math.sin(g.ph * 1.7) * 0.07);

  var gCol = g.bonus ? palette.gemBonus : palette.gem;
  var gHi  = g.bonus ? palette.gemBonusHi : palette.gemHi;

  ctx.globalAlpha = g.bonus ? 0.34 : 0.20;
  ctx.fillStyle = gHi;
  ctx.beginPath(); ctx.arc(x, y, r * (g.bonus ? 2.9 : 2.2), 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = gCol;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 1.30);
  ctx.lineTo(x + r, y - r * 0.14);
  ctx.lineTo(x, y + r * 1.30);
  ctx.lineTo(x - r, y - r * 0.14);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = 0.55;
  ctx.fillStyle = gHi;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 1.30);
  ctx.lineTo(x - r, y - r * 0.14);
  ctx.lineTo(x, y + r * 0.18);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawPlayer() {                      // 小青蛙
  var pw = L.playerW, ph = L.playerH;
  var px = L.playerX;
  // 在水里（落地状态）就上下浮动 + 微微下沉，看起来是泡着而不是站在路上
  var inWater = (state === 'run' || state === 'ready') && player.onGround;
  var bob = inWater ? Math.sin(player.bobPhase) * ph * 0.055 : 0;
  var sink = inWater ? ph * 0.11 : 0;
  var py = L.groundY - ph - player.yOff + bob + sink;

  ctx.save();
  if (state === 'dead') {
    ctx.translate(px + pw / 2, py + ph / 2);
    ctx.rotate(Math.min(1.55, deadT * 2.6));
    ctx.translate(-pw / 2, -ph / 2);
  } else {
    ctx.translate(px, py);
    // 二段跳：空中翻个跟头（青蛙蹬空气）
    if (!player.onGround && player.jumps >= 2) {
      var st = clamp(player.spinT, 0, 1);
      ctx.translate(pw / 2, ph / 2);
      ctx.rotate((1 - st) * 6.2832);
      ctx.translate(-pw / 2, -ph / 2);
    }
  }

  var body = palette.body, dark = palette.bodyDark, belly = palette.belly;
  var running = (state === 'run' || state === 'ready') && player.onGround;
  var legPh = running ? Math.sin(player.runPhase) : 0;

  // 后腿（蹬地/收腿）
  ctx.fillStyle = dark;
  var l1 = running ? legPh * pw * 0.14 : (player.onGround ? 0 : -pw * 0.11);
  var l2 = running ? -legPh * pw * 0.14 : (player.onGround ? 0 : pw * 0.11);
  rr(pw * 0.05 + l1, ph * 0.60, pw * 0.30, ph * 0.40, pw * 0.13);
  rr(pw * 0.52 + l2, ph * 0.60, pw * 0.32, ph * 0.40, pw * 0.13);

  // 身体（圆滚滚）
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(pw * 0.50, ph * 0.52, pw * 0.47, ph * 0.41, 0, 0, 6.2832);
  ctx.fill();ctx.strokeStyle='#78ad8b';ctx.lineWidth=2.5*L.S;ctx.stroke();

  // 肚皮
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.ellipse(pw * 0.53, ph * 0.63, pw * 0.31, ph * 0.25, 0, 0, 6.2832);
  ctx.fill();

  // 招牌凸眼睛
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(pw * 0.34, ph * 0.19, pw * 0.21, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(pw * 0.67, ph * 0.19, pw * 0.21, 0, 6.2832); ctx.fill();
  ctx.fillStyle = palette.eye;
  ctx.beginPath(); ctx.arc(pw * 0.35, ph * 0.17, pw * 0.145, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(pw * 0.68, ph * 0.17, pw * 0.145, 0, 6.2832); ctx.fill();
  if (player.blink > 0 && state !== 'dead') {
    ctx.fillStyle = body;
    ctx.fillRect(pw * 0.16, ph * 0.06, pw * 0.70, ph * 0.20);
  } else {
    ctx.fillStyle = palette.pupil;
    ctx.beginPath(); ctx.arc(pw * 0.37, ph * 0.17, pw * 0.072, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(pw * 0.70, ph * 0.17, pw * 0.072, 0, 6.2832); ctx.fill();
  }

  if(player.blink<=0){ctx.fillStyle='#fffdf5';ctx.beginPath();ctx.arc(pw*.388,ph*.135,pw*.03,0,Math.PI*2);ctx.arc(pw*.718,ph*.135,pw*.03,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#f9bba7';ctx.beginPath();ctx.ellipse(pw*.22,ph*.4,pw*.09,ph*.045,0,0,Math.PI*2);ctx.ellipse(pw*.81,ph*.4,pw*.09,ph*.045,0,0,Math.PI*2);ctx.fill();
  // 嘴
  ctx.strokeStyle = dark;
  ctx.lineWidth = Math.max(1.4, pw * 0.042);
  ctx.beginPath();
  ctx.arc(pw * 0.52, ph * 0.40, pw * 0.21, 0.30, Math.PI - 0.30);
  ctx.stroke();

  // 泡在水里：把水面以下那截染成水色，再加一道水线高光
  if (inWater) {
    var wl = ph - sink;                       // 水面在本地坐标里的位置
    ctx.save();
    // 关键：裁剪区要**贴着青蛙自己的形状**（身体椭圆 + 两条后腿），
    // 直接填一个大矩形会露在青蛙两边，变成一块方块。
    ctx.beginPath();
    ctx.ellipse(pw * 0.50, ph * 0.52, pw * 0.47, ph * 0.41, 0, 0, 6.2832);
    ctx.rect(pw * 0.03 + l1, ph * 0.56, pw * 0.34, ph * 0.50);
    ctx.rect(pw * 0.50 + l2, ph * 0.56, pw * 0.36, ph * 0.50);
    ctx.clip();
    ctx.fillStyle = palette.submerge || 'rgba(179,223,215,0.55)';
    ctx.fillRect(-pw, wl, pw * 4, ph * 0.6);
    ctx.fillStyle = palette.submergeHi || 'rgba(237,250,225,0.78)';
    ctx.fillRect(-pw, wl, pw * 4, Math.max(1.5, ph * 0.045));
    ctx.restore();
  }

  ctx.restore();
}

function drawParts() {
  var i, p;
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.55;
    ctx.fillStyle = palette.dash;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '700 ' + Math.round(14 * L.S + 6) + 'px system-ui,-apple-system,sans-serif';
  for (i = 0; i < pops.length; i++) {
    p = pops[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = palette.gem;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(rand(-1, 1) * shake * 10 * L.S, rand(-1, 1) * shake * 8 * L.S);
  }
  drawSky();
  drawHills();
  drawClouds();
  drawReeds();
  drawGround();
  drawTargetPads();

  var i;
  for (i = 0; i < obstacles.length; i++) {
    var ob = obstacles[i];
    if (ob.kind === 'bird') drawBird(ob);
    else if (ob.kind === 'tall') drawTall(ob);
    else drawCactus(ob);
  }
  for (i = 0; i < gems.length; i++) drawGem(gems[i]);
  drawParts();
  drawRipples();
  drawPlayer();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* 封面和入口直接调用本页实际角色/场景 renderer，避免另一套 SVG 角色漂移。 */
function drawPreview(target,width,height,pixelRatio) {
  width=width||600;height=height||360;pixelRatio=pixelRatio||1;
  var old={ctx:ctx,W:W,H:H,L:L,player:player,state:state,worldX:worldX,palette:palette,clouds:clouds,hills:hills,nightMix:nightMix,pads:pads};
  try {
    target.width=Math.round(width*pixelRatio);target.height=Math.round(height*pixelRatio);
    ctx=target.getContext('2d',{alpha:false});ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    W=width;H=height;L=Object.assign({},old.L);state='ready';worldX=0;palette=Object.assign({},DAY);
    var unit=width/600,ph=100*unit;
    L.playerH=ph;L.playerW=ph*1.18;L.S=ph/58;L.groundY=height*.80;L.playerX=width*.24;L.span=width*1.9+420;
    player={yOff:0,vy:0,onGround:true,runPhase:.7,blink:0,blinkT:3,jumps:0,spinT:0,bobPhase:.6};nightMix=0;
    pads=[{x:L.playerX+L.playerW*.5,r:L.playerW*.66,hit:false}];
    clouds=[{x:width*.30+200,y:height*.19,s:.82,p:.2},{x:width*.58+200,y:height*.11,s:.58,p:.2}];
    hills=[{x:width*.20+200,p:.08,w:width*.7,h:height*.13,layer:0},{x:width*.62+200,p:.16,w:width*.8,h:height*.095,layer:1}];
    drawSky();drawHills();drawClouds();drawReeds();drawGround();drawTargetPads();
    drawCactus({x:width*.74,w:ph*.55,h:ph*.88,n:1});drawBird({x:width*.68,w:ph*.80,h:ph*.56,base:ph*1.25,mul:1,flap:.7});drawPlayer();
  } finally { ctx=old.ctx;W=old.W;H=old.H;L=old.L;player=old.player;state=old.state;worldX=old.worldX;palette=old.palette;clouds=old.clouds;hills=old.hills;nightMix=old.nightMix;pads=old.pads; }
  return target;
}
window.__actionPreview={draw:drawPreview,export:function(width,height){var target=document.createElement('canvas');drawPreview(target,width||1200,height||720,1);return target.toDataURL('image/png');}};
function showPreview() {
  var cover=/[?&]cover=1(?:&|$)/.test(location.search),target=document.createElement('canvas');
  if(cover){
    var wm=/[?&]w=(\d+)/.exec(location.search),hm=/[?&]h=(\d+)/.exec(location.search);
    var pw=wm?Math.min(2048,Math.max(100,Number(wm[1]))):600,ph=hm?Math.min(1536,Math.max(100,Number(hm[1]))):360;
    drawPreview(target,pw,ph,window.devicePixelRatio||1);
    document.body.innerHTML='';document.body.appendChild(target);
    target.style.cssText='position:fixed;left:0;top:0;width:'+pw+'px;height:'+ph+'px;display:block';
    document.title='action-cover-ready';return true;
  }
  drawPreview(target,320,180,Math.min(3,window.devicePixelRatio||1));document.querySelector('.hero').appendChild(target);return false;
}

/* ============================ 主循环 ============================ */
function frame(t) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (!lastT) lastT = t;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt <= 0) return;
  if (dt > 1 / 30) dt = 1 / 30;
  update(dt);
  render();
}

/* ============================ 启动 ============================ */
layout();
reset();
state = 'ready';
reportStat(hi, true);
elHi.textContent = 'HI ' + hi;
if(!showPreview())requestAnimationFrame(frame);

})();
</script>


</body>
