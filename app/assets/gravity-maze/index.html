<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>钢珠迷宫</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
  <header><button id="home" class="icon" aria-label="回游戏中心"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h1>钢珠迷宫</h1><div class="header-tools"><button id="reset" class="icon" aria-label="重置本关"><svg viewBox="0 0 24 24"><path d="M5 8a8 8 0 1 1-1 7M5 3v5h5"/></svg></button><button id="pause" class="icon" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg></button></div></header>
  <section class="hud"><button id="levelBtn" aria-label="选择关卡"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="2"/><rect x="15" y="3" width="6" height="6" rx="2"/><rect x="3" y="15" width="6" height="6" rx="2"/><rect x="15" y="15" width="6" height="6" rx="2"/></svg><span id="lvnum">1 / 24</span></button><span id="starCount" class="counter"><span class="art art-star" role="img" aria-label="星星"></span><b id="fruit">0 / 2</b></span><span id="keyBadge" hidden><span class="art art-key" role="img" aria-label="钥匙"></span></span></section>
  <section id="stage" aria-label="钢珠迷宫画布"><canvas id="cv"></canvas><div id="rotorButtons"></div><div id="toast" role="status" hidden></div>
    <div id="ready" class="overlay ready-dock"><div class="panel"><h2 id="readyTitle">第 1 关</h2><button id="start" class="primary">开始</button></div></div>
    <div id="pausePanel" class="overlay" hidden><div class="panel"><h2 id="pauseTitle">休息一下</h2><button id="resume" class="primary">继续</button><button id="pauseTouch" class="secondary" hidden>用方向盘</button><div class="paired"><button id="retry" class="secondary">重来</button><button id="pauseLevels" class="secondary">选关</button></div></div></div>
    <div id="flatGuide" class="overlay flat-guide" hidden><div class="panel"><button id="cancelFlat" class="icon guide-close" aria-label="稍后开始">×</button><h2 id="flatTitle">手机放平</h2><div class="flat-picture"><svg viewBox="0 0 280 180" aria-hidden="true"><ellipse cx="140" cy="144" rx="110" ry="14" fill="#d6e9dd" stroke="none"/><path d="m44 103 111-41 88 42-110 43z" fill="#67bea8" stroke="#3c8e7b" stroke-width="5"/><path d="m59 104 94-33 73 33-93 32z" fill="#fff4c9" stroke="none"/><circle cx="145" cy="101" r="10" fill="#bbd9e8" stroke="#6c95b3" stroke-width="3"/><path d="M39 46v31m-8-8 8 8 8-8M238 46v31m-8-8 8 8 8-8" stroke="#edb958" stroke-width="7"/></svg><img src="../shared/phone-flat-guide.png" alt="手机屏幕朝上，像小托盘一样平放" onerror="this.hidden=true"></div><div id="flatCountdown" class="flat-countdown" role="timer" aria-live="polite" hidden></div><div id="flatProgress" class="flat-progress" aria-label="正在检测水平"><span></span><span></span><span></span></div><button id="flatTouch" class="secondary" hidden>用方向盘</button></div></div>
    <div id="win" class="overlay" hidden><div class="panel win-panel"><div id="stars" class="big-stars">★★★</div><h2>到终点啦！</h2><button id="next" class="primary">下一关</button><button id="winRetry" class="secondary">再玩一次</button></div></div>
    <div id="resetPanel" class="overlay" hidden><div class="panel"><h2>重来这一关？</h2><div class="paired"><button id="resetNo" class="secondary">继续玩</button><button id="resetYes" class="primary">重来</button></div></div></div>
  </section>
  <section id="controls" hidden><div id="touchPad" aria-label="按住并拖动方向盘"><div class="pad-ring"><span id="joyDot"></span></div></div></section>
  <div id="levels" class="overlay screen-overlay" hidden><div class="panel level-panel"><div class="level-heading"><h2>选一关</h2><button id="closeLevels" class="icon" aria-label="关闭选关">×</button></div><div class="level-lists"><h3>小迷宫</h3><div id="levelGrid"></div><h3>转转机关</h3><div id="mechanismGrid"></div></div></div></div>
</main><script src="../shared/feedback.js"></script><script src="../shared/motion.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
