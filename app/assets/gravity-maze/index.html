<script>
'use strict';
const WW=1000,WH=1440,BALL_R=32,R_MAX=32,GROW=0,ACC=920,FRIC=3.2,BOUNCE=.16,MAX_SPEED=300,HOLE_R=54,LIVES=3;
// 关卡只增加绕行和障碍；钢珠大小、控制速度保持一致，便于学习手感。
const LEVELS=[
 {name:'草地初晴',tip:'先收四个果子，出口会亮起来。',walls:[],holes:[],fruits:[[300,420],[700,420],[300,1000],[700,1000]],powerups:[],goal:[420,1220,160,160],start:[500,180]},
 {name:'池畔小洞',tip:'黑洞是危险区域，沿两侧慢慢走。',walls:[],holes:[[500,720,HOLE_R]],fruits:[[250,400],[750,400],[250,1040],[750,1040]],powerups:[{x:500,y:300,kind:'shield'}],goal:[420,1220,160,160],start:[500,180]},
 {name:'绕过矮墙',tip:'从木墙右侧绕行，靠近时可以松手减速。',walls:[[0,700,620,42]],holes:[[830,500,50]],fruits:[[200,400],[480,400],[820,360],[300,1050],[700,1100]],powerups:[{x:480,y:1050,kind:'shield'}],goal:[420,1230,160,150],start:[500,180]},
 {name:'湖边果园',tip:'蓝色磁铁会收起附近、没有被墙隔住的果子。',walls:[],holes:[[300,620,50],[700,830,50]],fruits:[[180,320],[820,320],[500,500],[180,900],[820,1050],[620,1200]],powerups:[{x:500,y:860,kind:'magnet'}],goal:[420,1250,160,150],start:[500,170]},
 {name:'折返花径',tip:'先向右，再向左，沿着 Z 字花径走。',walls:[[0,460,700,42],[300,940,700,42]],holes:[[870,740,50]],fruits:[[200,300],[820,300],[200,740],[600,740],[200,1180],[700,1180]],powerups:[{x:830,y:1160,kind:'shield'}],goal:[120,1250,160,150],start:[820,180]},
 {name:'慢慢穿行',tip:'缺口足够宽，经过洞边时轻推摇杆就好。',walls:[[0,620,320,42],[680,620,320,42],[0,1060,320,42],[680,1060,320,42]],holes:[[500,840,48]],fruits:[[200,300],[800,300],[200,830],[800,830],[200,1250],[800,1250]],powerups:[{x:500,y:1250,kind:'shield'}],goal:[430,1230,150,140],start:[500,150]},
 {name:'回廊拾果',tip:'木墙挡住的果子，要绕过去才能拿到。',walls:[[180,300,640,40],[180,300,40,720],[180,980,640,40],[780,600,40,420],[400,600,420,40]],holes:[[600,800,48],[300,1180,48]],fruits:[[320,420],[660,420],[320,860],[660,860],[500,1140],[860,1140],[860,420]],powerups:[{x:500,y:420,kind:'magnet'},{x:430,y:1110,kind:'shield'}],goal:[450,430,150,130],start:[840,1300]},
 {name:'两边的风景',tip:'中间的木墙很长，记得从两头绕。',walls:[[440,280,120,900]],holes:[[180,560,48],[180,1020,48],[820,560,48],[820,1020,48]],fruits:[[280,300],[720,300],[280,780],[720,780],[280,1240],[720,1240]],powerups:[{x:500,y:1240,kind:'shield'}],goal:[420,1280,160,140],start:[500,130]},
 {name:'侧门花园',tip:'每层入口在另一边，到了转角先慢下来。',walls:[[0,380,780,40],[220,780,780,40],[0,1180,780,40]],holes:[[900,580,46],[900,980,46]],fruits:[[200,280],[600,280],[400,600],[200,1000],[600,1000],[200,1320]],powerups:[{x:700,y:600,kind:'magnet'},{x:700,y:1000,kind:'shield'}],goal:[110,1290,160,140],start:[820,170]},
 {name:'花园深处',tip:'不用着急，收齐最后八个果子就到家了。',walls:[[300,240,40,560],[660,660,40,560]],holes:[[170,1150,48],[500,460,48],[830,1150,48],[500,1020,48]],fruits:[[150,300],[500,300],[850,300],[150,700],[850,700],[150,1300],[850,1300],[500,1250]],powerups:[{x:500,y:700,kind:'magnet'},{x:500,y:1250,kind:'shield'}],goal:[430,1290,160,130],start:[140,150]}
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function hypot(x,y){return Math.hypot(x,y)}function ballR(){return BALL_R}function allWalls(lv){return [[-60,-60,WW+120,60],[-60,WH,WW+120,60],[-60,-60,60,WH+120],[WW,-60,60,WH+120]].concat(lv.walls)}
function pushOut(cx,cy,r,rect){const [x,y,w,h]=rect,nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h),dx=cx-nx,dy=cy-ny,d=hypot(dx,dy);if(d>=r)return null;if(d>.0001)return {nx:dx/d,ny:dy/d,depth:r-d};const sides=[cx-x,x+w-cx,cy-y,y+h-cy],m=Math.min(...sides),i=sides.indexOf(m);return {nx:i===0?-1:i===1?1:0,ny:i===2?-1:i===3?1:0,depth:m+r}}
function inHole(lv,x,y){return lv.holes.some(h=>hypot(x-h[0],y-h[1])<h[2]*.60)}function inGoal(lv,x,y){const g=lv.goal,dx=(x-g[0]-g[2]/2)/(g[2]*.38),dy=(y-g[1]-g[3]/2)/(g[3]*.38);return dx*dx+dy*dy<1}function fruitR(){return 27}function fruitLeft(lv){return lv.fruits.reduce((n,f)=>n+(!f[2]?1:0),0)}function allFruitEaten(lv){return fruitLeft(lv)===0}
function newBall(lv){return {x:lv.start[0],y:lv.start[1],vx:0,vy:0,t:0,spin:0,eaten:0,score:0,lives:LIVES,shield:false,magnet:0,invuln:0}}
function respawn(lv,b){b.x=lv.start[0];b.y=lv.start[1];b.vx=b.vy=0;b.invuln=1.8;return b}
// 果子保持固定。磁铁仅收取同一区域内的果子，绝不把果子搬入墙内。
function lineClear(lv,x1,y1,x2,y2){const n=Math.max(1,Math.ceil(hypot(x2-x1,y2-y1)/14));for(let j=1;j<n;j++){const x=x1+(x2-x1)*j/n,y=y1+(y2-y1)*j/n;for(const w of lv.walls)if(x>w[0]-4&&x<w[0]+w[2]+4&&y>w[1]-4&&y<w[1]+w[3]+4)return false}return true}
function shieldEscape(lv,b){const h=lv.holes.reduce((a,h)=>hypot(h[0]-b.x,h[1]-b.y)<hypot(a[0]-b.x,a[1]-b.y)?h:a,lv.holes[0]),a=Math.atan2(b.y-h[1],b.x-h[0]),r=h[2]+BALL_R+15;for(let k=0;k<16;k++){const ang=a+(k%2?1:-1)*Math.ceil(k/2)*Math.PI/8,x=h[0]+Math.cos(ang)*r,y=h[1]+Math.sin(ang)*r;if(x<BALL_R||y<BALL_R||x>WW-BALL_R||y>WH-BALL_R||inHole(lv,x,y))continue;if(allWalls(lv).some(w=>pushOut(x,y,BALL_R,w)))continue;b.x=x;b.y=y;b.vx=b.vy=0;b.invuln=1.4;return}respawn(lv,b)}
function step(lv,b,tx,ty,dt){b.t+=dt;b.invuln=Math.max(0,b.invuln-dt);b.magnet=Math.max(0,b.magnet-dt);b.vx+=clamp(tx,-1,1)*ACC*dt;b.vy+=clamp(ty,-1,1)*ACC*dt;const drag=Math.exp(-FRIC*dt);b.vx*=drag;b.vy*=drag;const v=hypot(b.vx,b.vy);if(v>MAX_SPEED){b.vx*=MAX_SPEED/v;b.vy*=MAX_SPEED/v}b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=hypot(b.vx,b.vy)*dt/BALL_R;const walls=allWalls(lv);for(let k=0;k<4;k++){let hit=null;for(const w of walls){const p=pushOut(b.x,b.y,BALL_R,w);if(p&&(!hit||p.depth>hit.depth))hit=p}if(!hit)break;b.x+=hit.nx*(hit.depth+.01);b.y+=hit.ny*(hit.depth+.01);const vn=b.vx*hit.nx+b.vy*hit.ny;if(vn<0){b.vx-=(1+BOUNCE)*vn*hit.nx;b.vy-=(1+BOUNCE)*vn*hit.ny}}let ev='run';for(const ft of lv.fruits){if(ft[2])continue;const d=hypot(ft[0]-b.x,ft[1]-b.y);if(d<fruitR()+BALL_R*.65||(b.magnet>0&&d<180&&lineClear(lv,b.x,b.y,ft[0],ft[1]))){ft[2]=true;b.eaten++;b.score+=10;ev='eat'}}for(const p of lv.powerups){if(p.got||hypot(p.x-b.x,p.y-b.y)>fruitR()+BALL_R*.7)continue;p.got=true;if(p.kind==='shield')b.shield=true;else if(p.kind==='magnet')b.magnet=9;else b.score+=50;ev='power'}if(b.invuln===0&&inHole(lv,b.x,b.y)){if(b.shield){b.shield=false;shieldEscape(lv,b);return 'shield'}return 'fall'}if(allFruitEaten(lv)&&inGoal(lv,b.x,b.y))return 'win';return ev}
function cloneLevel(i){const L=LEVELS[i];return {...L,walls:L.walls.map(w=>w.slice()),holes:L.holes.map(h=>h.slice()),goal:L.goal.slice(),start:L.start.slice(),fruits:L.fruits.map(f=>[...f,false]),powerups:L.powerups.map(p=>({...p,got:false}))}}

const stage=$('#stage');stage.addEventListener('pointerdown',e=>{if(Input.mode!=='touch'||paused||result!=='run'||Input.touch.active)return;e.preventDefault();const r=stage.getBoundingClientRect();Input.touch={active:true,id:e.pointerId,x:0,y:0,ox:e.clientX,oy:e.clientY};try{stage.setPointerCapture(e.pointerId)}catch(err){}$('#joy').style.left=(e.clientX-r.left)+'px';$('#joy').style.top=(e.clientY-r.top)+'px';$('#joyDot').style.transform='translate(-50%,-50%)';$('#joy').classList.add('show')},{passive:false});stage.addEventListener('pointermove',e=>{if(!Input.touch.active||e.pointerId!==Input.touch.id)return;e.preventDefault();let x=(e.clientX-Input.touch.ox)/52,y=(e.clientY-Input.touch.oy)/52,d=hypot(x,y);if(d>1){x/=d;y/=d}Input.touch.x=x;Input.touch.y=y;$('#joyDot').style.transform=`translate(calc(-50% + ${x*30}px),calc(-50% + ${y*30}px))`},{passive:false});for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,e=>{if(e.pointerId===Input.touch.id)Input.release()});
$('#tiltMode').addEventListener('click',()=>setMode('tilt'));$('#touchMode').addEventListener('click',()=>setMode('touch'));$('#readyTilt').addEventListener('click',()=>setMode('tilt'));$('#readyTouch').addEventListener('click',()=>setMode('touch'));$('#calibrate').addEventListener('click',()=>{if(Input.mode!=='tilt')return;toast(Input.calibrate()?'握姿已校准，轻轻倾斜就好。':'还没有重力读数，可切换触摸摇杆。')});$('#start').addEventListener('click',start);$('#pause').addEventListener('click',()=>pauseGame());$('#resume').addEventListener('click',resume);$('#retry').addEventListener('click',()=>reset());$('#winRetry').addEventListener('click',()=>reset());$('#next').addEventListener('click',()=>reset(li===9?0:li+1));
function showLevels(){if(result==='run'||result==='fall')pauseGame();const grid=$('#levelGrid');grid.innerHTML='';LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className=i===li?'current':'';b.disabled=i>progress.highest;b.innerHTML=(i>progress.highest?'·':i+1)+`<small>${'★'.repeat(progress.stars[i]||0)||L.name.slice(0,2)}</small>`;b.addEventListener('click',()=>reset(i));grid.appendChild(b)});$('#levels').hidden=false}$('#levelBtn').addEventListener('click',showLevels);$('#pauseLevels').addEventListener('click',showLevels);$('#closeLevels').addEventListener('click',()=>$('#levels').hidden=true);
function home(){try{if(window.RugeNav&&RugeNav.home)RugeNav.home();else location.href='../index.html'}catch(e){}}$('#home').addEventListener('click',home);$('#readyHome').addEventListener('click',home);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame('background');last=performance.now()});addEventListener('ruge:pause',()=>pauseGame('background'));addEventListener('ruge:resume',()=>{last=performance.now()});addEventListener('resize',()=>{layout();render()});addEventListener('blur',()=>Input.release());
addEventListener('ruge:orientation',()=>{Input.zero={x:0,y:0};Input.filtered={x:0,y:0};Input.release();if(Input.mode==='tilt'){pauseGame('orientation');$('#pauseTitle').textContent='手机方向变了';$('#pauseSub').textContent='保持舒适握姿，继续时会重新校准。';toast('继续前重新校准握姿。')}});
window.__game={LEVELS,WW,WH,BALL_R,R_MAX,GROW,ACC,LIVES,allWalls,pushOut,inHole,inGoal,newBall,step,reachable,ballR,allFruitEaten,fruitLeft,respawn,clamp,lineClear,cloneLevel,input:Input,loadLevel:reset,start,pause:pauseGame,resume,state:()=>({li,x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,eaten:ball.eaten,lives:ball.lives,shield:ball.shield,magnet:ball.magnet,invuln:ball.invuln,result,paused,mode:Input.mode,time:ball.t})};
reset();requestAnimationFrame(frame);
