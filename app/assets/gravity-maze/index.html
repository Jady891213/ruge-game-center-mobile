<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>钢珠迷宫</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
  <header><button id="home" class="icon" aria-label="回游戏中心"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h1>钢珠迷宫</h1><button id="pause" class="icon" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg></button></header>
  <section class="hud"><button id="levelBtn" aria-label="选择关卡"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="2"/><rect x="15" y="3" width="6" height="6" rx="2"/><rect x="3" y="15" width="6" height="6" rx="2"/><rect x="15" y="15" width="6" height="6" rx="2"/></svg><span id="lvnum">1 / 12</span></button><span id="starCount" class="counter"><span class="art art-star" role="img" aria-label="星星"></span><b id="fruit">0 / 2</b></span><span id="keyBadge" hidden><span class="art art-key" role="img" aria-label="钥匙"></span></span></section>
  <section id="stage" aria-label="钢珠迷宫画布"><canvas id="cv"></canvas><div id="toast" role="status" hidden></div>
    <div id="ready" class="overlay"><div class="panel"><span class="art art-ball hero-ball" aria-hidden="true"></span><h2 id="readyTitle">第 1 关</h2><div class="mini-target"><span class="art art-star" role="img" aria-label="星星"></span><svg viewBox="0 0 40 24"><path d="M5 12h29m-8-7 8 7-8 7"/></svg><span class="goal-mini">✓</span></div><div class="mode-row"><button id="readyTilt" class="secondary">倾斜</button><button id="readyTouch" class="secondary">触摸</button></div><button id="start" class="primary">开始</button><p id="readyHint" class="short-hint" hidden>请选触摸</p></div></div>
    <div id="pausePanel" class="overlay" hidden><div class="panel"><h2 id="pauseTitle">休息一下</h2><button id="resume" class="primary">继续</button><button id="pauseTouch" class="secondary">用触摸继续</button><div class="paired"><button id="retry" class="secondary">重来</button><button id="pauseLevels" class="secondary">选关</button></div></div></div>
    <div id="win" class="overlay" hidden><div class="panel win-panel"><div id="stars" class="big-stars">★★★</div><h2>到终点啦！</h2><button id="next" class="primary">下一关</button><button id="winRetry" class="secondary">再玩一次</button></div></div>
  </section>
  <section id="controls"><div class="control-switch"><button id="tiltMode" class="mode active"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="m9 11 3-3 3 3M12 8v9"/></svg><span>倾斜</span></button><button id="touchMode" class="mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m9 12 3-3 3 3m-3-3v8"/></svg><span>触摸</span></button></div><div id="tiltGuide"><svg viewBox="0 0 70 48"><path d="m15 18 20-9 20 9-20 9zM15 27l20 9 20-9"/><path d="m11 13-4 6 6 2m46 10 4-6-6-2"/></svg><span id="controlHint">轻轻倾斜</span></div><div id="touchPad" hidden aria-label="按住并拖动方向盘"><div class="pad-ring"><span id="joyDot"></span></div></div><button id="calibrate" class="mode"><svg viewBox="0 0 24 24"><path d="M5 8a8 8 0 1 1-1 7M5 3v5H0"/><circle cx="12" cy="12" r="2"/></svg><span>校准</span></button></section>
  <div id="levels" class="overlay screen-overlay" hidden><div class="panel level-panel"><div class="level-heading"><h2>选一关</h2><button id="closeLevels" class="icon" aria-label="关闭选关">×</button></div><div id="levelGrid"></div></div></div>
</main><script src="../shared/feedback.js"></script><script src="../shared/motion.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
