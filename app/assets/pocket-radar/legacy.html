<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9e9"><title>口袋探宝</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><button id="home" class="icon" aria-label="返回游戏中心">⌂</button><h1>以前的关卡</h1><button id="mapButton" class="icon" aria-label="选关">▦</button></header>
<section id="menu"><a href="index.html" style="display:block;padding:10px;text-align:center">回无尽挑战</a><img class="hero" src="art.png" alt="小兔探险家和宝箱"><div class="tabs"><button id="radarTab" aria-pressed="true">探宝</button><button id="safeTab" aria-pressed="false">开锁</button><button id="duelTab" aria-pressed="false">双人</button></div><div id="levels" aria-label="选择关卡"></div><button id="continue" class="wide green" hidden>继续玩</button></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName"></strong><span id="timer">0.0</span><button id="reset" class="icon" aria-label="重玩本关">↻</button><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button></div>
<div id="goals" aria-label="本关目标"></div><div id="boardFrame"><canvas id="board" aria-label="探宝地图或保险箱旋钮"></canvas><div id="posture" hidden><div class="phoneDemo" aria-hidden="true">▯</div><strong id="postureText">竖着拿，左右转</strong><button id="fallback" class="green">用手指</button></div></div>
<div id="signal" aria-label="探测信号"><span></span><span></span><span></span><span></span><span></span></div><div class="inputRow"><button id="inputMode" class="small" aria-pressed="false">手指</button><span id="cue" role="status">找宝箱</span><button id="dig" class="green">挖一下</button></div>
<div id="touchControls"><div id="arrows"><button id="up" aria-label="向上">↑</button><button id="left" aria-label="向左">←</button><button id="right" aria-label="向右">→</button><button id="down" aria-label="向下">↓</button></div><div id="dialButtons" hidden><button id="turnLeft" aria-label="向左旋转">↶</button><button id="turnRight" aria-label="向右旋转">↷</button></div></div></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><h2>歇一歇</h2><button id="resume" class="wide green">继续</button><button id="pauseMap" class="wide">选关</button></div></div>
<div id="confirm" class="overlay" hidden><div class="dialog"><h2 id="confirmTitle">重新开始？</h2><button id="confirmReset" class="wide green">重来</button><button id="cancelReset" class="wide">继续玩</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><div class="winStar">★</div><h2 id="winTitle">找到啦！</h2><strong id="result"></strong><button id="next" class="wide green">下一关</button><button id="winMap" class="wide">选关</button></div></div>
<div id="handover" class="overlay" hidden><div class="dialog"><div class="playerBadge" id="playerBadge">1</div><h2 id="handoverTitle">交给一号玩家</h2><button id="ready" class="wide green">准备好啦</button></div></div>
<script src="../shared/feedback.js"></script><script src="../shared/motion.js"></script><script src="core.js"></script><script src="legacy-game.js"></script></body></html>
