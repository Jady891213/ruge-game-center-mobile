<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9e9"><title>口袋探宝</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="challenge.css"></head><body>
<main><header><button id="home" class="icon" aria-label="返回游戏中心">⌂</button><h1>口袋探宝</h1><button id="mapButton" class="icon" aria-label="返回模式选择">▦</button></header>
<section id="menu"><img class="hero" src="art.png" alt="小兔探险家和宝箱"><div class="modeCards"><button id="safeStart"><span class="modeIcon" aria-hidden="true">◉</span><strong>转转保险箱</strong><small id="safeBest">最高 0 关</small></button><button id="spaceStart"><span class="modeIcon compass" aria-hidden="true">✦</span><strong>空间寻宝</strong><small id="spaceBest">最高 0 关</small></button></div><a class="oldLink" href="legacy.html">以前的关卡 · 双人</a></section>
<section id="play" hidden><div class="levelbar"><strong id="levelName">第 1 关</strong><span id="timer">60 秒</span><button id="pauseButton" class="icon" aria-label="暂停">Ⅱ</button></div>
<div id="boardFrame"><canvas id="board" aria-label="360度方向探测器"></canvas><div id="holdBadge" hidden><strong id="holdCount">3</strong><span>停住啦</span></div><div id="posture" hidden><div class="phoneDemo" aria-hidden="true">▯ ↻</div><strong id="postureText">竖起手机，慢慢转</strong><button id="fallback" class="green">用手指</button></div><div id="bonus" hidden>+12 秒</div></div>
<div class="liveRow"><span id="direction">0°</span><div id="signal" aria-label="探测信号"><span></span><span></span><span></span><span></span><span></span></div><span id="elevation">↕ 0°</span></div><div id="holdTrack" role="progressbar" aria-label="停稳三秒" aria-valuemin="0" aria-valuemax="100"><i id="holdFill"></i></div>
<div class="inputRow"><button id="inputMode" class="small" aria-pressed="false">手机</button><strong id="cue" role="status">慢慢转</strong><span id="bestLive">最高 0 关</span></div><div id="touchControls" hidden><input id="headingSlider" type="range" min="0" max="359" value="0" aria-label="360度方向"><label id="pitchLabel">↕ <input id="elevationSlider" type="range" min="-65" max="65" value="0" aria-label="上下俯仰角度"></label></div></section></main>
<div id="pause" class="overlay" hidden><div class="dialog"><h2>歇一歇</h2><button id="resume" class="wide green">继续</button><button id="pauseMap" class="wide">选玩法</button></div></div>
<div id="win" class="overlay" hidden><div class="dialog"><div class="winStar">★</div><h2 id="winTitle">下次再挑战</h2><strong id="result"></strong><button id="next" class="wide green">再来一次</button><button id="winMap" class="wide">选玩法</button></div></div>
<script src="../shared/feedback.js"></script><script src="challenge-core.js"></script><script src="haptics.js"></script><script src="orientation.js"></script><script src="game.js"></script></body></html>
